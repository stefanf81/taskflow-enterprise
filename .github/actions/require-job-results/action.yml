name: Assert required job results
description: >-
  Fails unless every `required` job's result is `success` and every other job
  in the caller's `needs` is `success` or `skipped`. Used by the required-check
  gates so an upstream failure cannot be masked as a skipped — and therefore
  successful — required status check.
inputs:
  needs:
    description: >-
      The calling job's needs context as JSON (the expression `toJSON(needs)`).
      Every job in it is asserted, so a job added to `needs:` is covered
      without a second list to keep in sync.
    required: true
  required:
    description: Space-separated job IDs from `needs` that must have run successfully.
    required: true
runs:
  using: composite
  steps:
    - name: Assert results
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        NEEDS_JSON: ${{ inputs.needs }}
        REQUIRED_JOBS: ${{ inputs.required }}
      run: |
        set -euo pipefail

        declare -A results=()
        while IFS=$'\t' read -r job result; do
          results["$job"]="$result"
        done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<<"$NEEDS_JSON")

        if (( ${#results[@]} == 0 )); then
          echo "::error::needs is empty or not JSON; pass toJSON(needs)"
          exit 1
        fi

        declare -A required=()
        for job in ${REQUIRED_JOBS}; do
          if [[ -z "${results[$job]+set}" ]]; then
            echo "::error::Required job '${job}' is not in needs"
            exit 1
          fi
          required["$job"]=1
        done

        failed=0
        for job in $(printf '%s\n' "${!results[@]}" | sort); do
          result="${results[$job]}"
          echo "${job}=${result}"
          if [[ -n "${required[$job]+set}" ]]; then
            # Change detection must actually have run: a failed `changes` job
            # leaves its dependents skipped, and a skipped required check
            # still reports success to branch protection.
            if [[ "$result" != "success" ]]; then
              echo "::error::Required job '${job}' did not succeed (${result})"
              failed=1
            fi
          else
            # Dependents may legitimately be skipped (e.g. non-mobile PRs),
            # but a real failure or cancellation must fail the gate.
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::Job '${job}' did not succeed (${result})"
                failed=1
                ;;
            esac
          fi
        done

        exit "$failed"
