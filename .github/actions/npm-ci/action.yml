name: Install npm dependencies
description: >-
  Install the npm version declared in frontend/package.json `packageManager`,
  then run `npm ci` from the repository root against the single npm workspaces
  lockfile, for one workspace (plus shared/schemas) or for all of them. Runs
  from the repository root so callers do not need a working directory.
inputs:
  package-path:
    description: >-
      Workspace to install (e.g. frontend, mobile). Use `.` to install every
      workspace and the root tooling.
    required: true
  shared-schemas:
    description: Also install the shared/schemas workspace (the web and mobile apps import it).
    required: false
    default: "true"
  ignore-scripts:
    description: Pass --ignore-scripts to both installs (supply-chain hardening).
    required: false
    default: "false"
  cache-node-modules:
    description: >-
      Opt-in. Restore the hoisted node_modules, <package-path>/node_modules and
      shared/schemas/node_modules from an exact-match cache keyed on OS,
      architecture, Node and declared npm versions, install flags, the lockfile
      and package.json files (npm 12 allowScripts and overrides live in the root
      one), the .npmrc and this action itself. On a hit, skip the npm upgrade
      and `npm ci`. On a miss, install as usual and save. There are no restore
      keys, so a partial or stale tree is never reused. This mode also owns the
      npm download cache (~/.npm): it is restored only on a node_modules miss,
      so callers set `package-manager-cache: false` on setup-node and omit
      `cache: npm` (setup-node restored ~/.npm before the hit was known).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Compute node_modules cache key
      id: nm-key
      if: inputs.cache-node-modules == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
        SHARED_SCHEMAS: ${{ inputs.shared-schemas }}
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
        # package.json carries npm 12's `allowScripts` (which install scripts
        # run) and is not reflected in the lockfile; this file carries the
        # `npm ci` arguments. Hash both so a policy or flag change misses.
        INPUTS_HASH: ${{ hashFiles('package-lock.json', 'package.json', format('{0}/package.json', inputs.package-path), 'shared/schemas/package.json', '.npmrc', '.github/actions/npm-ci/action.yml') }}
      run: |
        set -euo pipefail
        declared="$(node -p "require('./frontend/package.json').packageManager || 'npm'")"
        key="node-modules-v1-${RUNNER_OS}-${RUNNER_ARCH}-node$(node --version)-${declared}"
        key+="-${PACKAGE_PATH//\//_}-shared${SHARED_SCHEMAS}-ignore${IGNORE_SCRIPTS}-${INPUTS_HASH}"
        echo "key=${key}" >> "$GITHUB_OUTPUT"

    - name: Restore node_modules
      id: nm-cache
      if: inputs.cache-node-modules == 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          node_modules
          ${{ inputs.package-path }}/node_modules
          shared/schemas/node_modules
        key: ${{ steps.nm-key.outputs.key }}

    # Only on a node_modules miss: on a hit nothing is downloaded, so the
    # restore setup-node's `cache: npm` used to do here was wasted time.
    # Exact key, the same scheme as setup-node's (OS, architecture, lockfiles);
    # saved after the installs below when it missed.
    - name: Restore npm download cache
      id: npm-cache
      if: inputs.cache-node-modules == 'true' && steps.nm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.npm
        key: npm-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

    # setup-node only reads `packageManager` to enable npm caching; it never
    # installs that npm version, and Node 24 bundles npm 11. Corepack is
    # deprecated and being removed from Node distributions, so install the
    # declared npm explicitly. Derived from frontend/package.json so the pin
    # cannot drift; npm 12 also enforces the `allowScripts` allowlists.
    - name: Ensure declared npm version
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        declared="$(node -p "require('./frontend/package.json').packageManager")"
        want="${declared#npm@}"
        have="$(npm --version)"

        # Nothing to do when the field is absent (want == declared).
        if [[ -z "$want" || "$want" == "$declared" ]]; then
          echo "No npm packageManager pin found; keeping npm $have"
          exit 0
        fi

        if [[ "$have" != "$want" ]]; then
          echo "npm $have -> installing npm $want (declared in frontend/package.json)"
          npm install --global "npm@$want"
        else
          echo "npm $want already active"
        fi

    - name: Install ${{ inputs.package-path }}
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
        SHARED_SCHEMAS: ${{ inputs.shared-schemas }}
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        set -euo pipefail
        args=(--prefer-offline --no-audit --no-fund)
        if [[ "$PACKAGE_PATH" != "." ]]; then
          # Only the requested workspace(s): `npm ci` reads the one root lockfile but installs
          # just their dependency trees.
          args+=(--workspace "$PACKAGE_PATH")
          if [[ "$SHARED_SCHEMAS" == "true" && "$PACKAGE_PATH" != "shared/schemas" ]]; then
            args+=(--workspace shared/schemas)
          fi
        fi
        if [[ "$IGNORE_SCRIPTS" == "true" ]]; then
          args+=(--ignore-scripts)
        fi
        # `npm ci` prints `npm warn deprecated` for transitively-pinned
        # unmaintained packages (glob 6/7/8, rimraf 2/4, inflight, abab,
        # domexception, whatwg-encoding) pulled in by Jest 29 / jsdom 20 /
        # detox->bunyan. Those majors are deliberately held back, so the
        # warnings are not actionable in normal installs. Filter only those
        # lines from stderr; every other warning and error still surfaces.
        # (The dependency-health audit keeps them - deprecation is signal there.)
        npm ci "${args[@]}" 2> >(grep --line-buffered -v '^npm warn deprecated' >&2)

    - name: Save node_modules
      if: inputs.cache-node-modules == 'true' && steps.nm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          node_modules
          ${{ inputs.package-path }}/node_modules
          shared/schemas/node_modules
        key: ${{ steps.nm-key.outputs.key }}

    - name: Save npm download cache
      if: inputs.cache-node-modules == 'true' && steps.nm-cache.outputs.cache-hit != 'true' && steps.npm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.npm
        key: ${{ steps.npm-cache.outputs.cache-primary-key }}
