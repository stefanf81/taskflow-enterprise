name: Build backend JAR
description: >-
  Set up the backend JDK and a read-only Gradle cache, build the executable JAR
  and upload it as an artifact. One copy of the packaging steps that ci.yml
  (`package`), dast.yml, pushdockerimage.yml and react-native-ci.yml share.
  Expects the repository to be checked out.
inputs:
  java-version:
    description: JDK to build with (the backend toolchain, build.gradle).
    required: true
  gradle-task:
    description: >-
      Gradle task that produces build/libs/*.jar (`assemble`, or `bootJar` when
      nothing else in the job needs the other assemble outputs).
    required: false
    default: assemble
  artifact-name:
    description: Name of the uploaded artifact.
    required: true
  retention-days:
    description: Days to keep the artifact (an intra-run hand-off needs only a few).
    required: true
runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # Read-only: ci.yml's `backend` job owns the shared Gradle cache writes, so
    # packaging jobs never race it on the same keys.
    #
    # GRADLE_BUILD_ACTION_CACHE_KEY_JOB restores the newest `backend` entry
    # (wrapper, dependencies, build cache). setup-gradle keys Gradle User Home by
    # job id, and a read-only job never writes its own, so a packaging job kept
    # restoring a frozen entry of its own id: a stale wrapper (the current
    # distribution was downloaded every run), stale dependencies and an empty
    # build cache, so `compileJava` ran (Build JAR 45-49 s vs 18 s for the same
    # `assemble` in `backend`, run 39180950242). Gradle's own integration tests
    # use this variable the same way
    # (gradle/actions .github/workflows/integ-test-restore-gradle-home.yml).
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      env:
        GRADLE_BUILD_ACTION_CACHE_KEY_JOB: backend
      with:
        cache-read-only: true

    - name: Build JAR
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GRADLE_TASK: ${{ inputs.gradle-task }}
      run: ./gradlew --parallel --build-cache "$GRADLE_TASK" --stacktrace

    - name: Upload backend JAR
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: build/libs/*.jar
        if-no-files-found: error
        compression-level: 0
        retention-days: ${{ inputs.retention-days }}
