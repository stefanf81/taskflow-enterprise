name: Upload SARIF
description: >-
  Upload a SARIF file to GitHub Code Scanning under a stable category. Keeps
  the codeql-action upload pin in one place across every workflow.
inputs:
  path:
    description: Path to the SARIF file.
    required: true
  category:
    description: Code Scanning category (must be unique per tool and component).
    required: true
  wait-for-processing:
    description: >-
      Wait until Code Scanning has processed the upload, so processing errors
      fail the job. Set to "false" when the job gates on the scanner's own exit
      code.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.path }}
        category: ${{ inputs.category }}
        wait-for-processing: ${{ inputs.wait-for-processing }}
