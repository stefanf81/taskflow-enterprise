name: Install Trivy
description: >-
  Install the Trivy CLI from its GitHub release and put it on PATH, for
  trivy-action steps that run with `skip-setup-trivy: true`. The tarball is
  checked against a SHA-256 pinned in this file, not against the release's own
  checksums file: whoever can replace a release asset can replace that file
  too, and a malicious release (v0.69.4, March 2026) ships a matching one. The
  pin is what was reviewed; Renovate moves version and checksum together.
  trivy-action's built-in setup (aquasecurity/setup-trivy) downloads
  the tarball from get.trivy.dev instead; that host stopped resolving on
  2026-11-03 (NXDOMAIN, trivy.dev zone serial 2026110301) and every image scan
  failed with curl exit 6 (run 41793496294). The GitHub release
  serves the same tarball.
inputs:
  version:
    description: Trivy release tag (`vX.Y.Z`, the workflows' TRIVY_VERSION).
    required: true
runs:
  using: composite
  steps:
    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.version }}
        # The release and the SHA-256 of its trivy_<version>_Linux-64bit.tar.gz
        # (the line for that file in the release's trivy_<version>_checksums.txt).
        # Renovate's github-release-attachments datasource finds the pinned
        # checksum in that file and writes the new release's line here, in the
        # same pull request that bumps the workflows' TRIVY_VERSION.
        # trivy-release: tracked by the dedicated regex manager in .github/renovate.json
        TRIVY_PINNED_VERSION: "v0.76.2"
        TRIVY_LINUX_64BIT_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
      # The GITHUB_PATH entry is this step's own directory under RUNNER_TEMP,
      # holding only the checksum-verified binary.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        # A workflow that asks for another version would get a tarball nobody
        # pinned: refuse instead of falling back to the release's checksums.
        if [[ "$TRIVY_VERSION" != "$TRIVY_PINNED_VERSION" ]]; then
          echo "::error::The workflow asks for Trivy ${TRIVY_VERSION}, but .github/actions/install-trivy pins ${TRIVY_PINNED_VERSION}. Bump TRIVY_PINNED_VERSION and TRIVY_LINUX_64BIT_SHA256 together with TRIVY_VERSION."
          exit 1
        fi
        version="${TRIVY_VERSION#v}"
        case "$(uname -m)" in
          x86_64) arch=64bit; sha256="$TRIVY_LINUX_64BIT_SHA256" ;;
          *) echo "::error::No pinned Trivy checksum for runner architecture $(uname -m)"; exit 1 ;;
        esac
        archive="trivy_${version}_Linux-${arch}.tar.gz"
        base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
        work="${RUNNER_TEMP}/trivy-download"
        bin="${RUNNER_TEMP}/trivy-bin"
        mkdir -p "$work" "$bin"

        curl -fsSL --retry 3 -o "${work}/${archive}" "${base}/${archive}"
        echo "${sha256}  ${work}/${archive}" | sha256sum --check --strict

        tar -xzf "${work}/${archive}" -C "$bin" trivy
        rm -rf "$work"
        echo "$bin" >> "$GITHUB_PATH"
        "${bin}/trivy" --version
