name: Dependency Maintenance Audit

on:
  schedule:
    # Run after the daily Renovate job refreshes its abandonment data.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dep-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  node-audit:
    name: Check JS/TS Dependency Usage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize summary
        shell: bash
        run: |
          set -euo pipefail
          cat > node-audit-summary.md <<'EOF'
          # JavaScript / TypeScript Dependency Usage

          EOF

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            mobile/package-lock.json
            shared/schemas/package-lock.json
          check-latest: true

      - name: Verify Node and npm
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Node: $(node --version)"
            echo "npm:  $(npm --version)"
            echo
          } | tee -a node-audit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify package lockfiles
        shell: bash
        run: |
          set -euo pipefail
          PACKAGES=("." "shared/schemas" "frontend" "mobile")
          has_error=false

          for pkg in "${PACKAGES[@]}"; do
            if [[ ! -f "$pkg/package-lock.json" ]]; then
              {
                echo
                echo "## npm dependency installation ($pkg)"
                echo
                echo "A \`package.json\` was found in \`$pkg\`, but no \`package-lock.json\` exists."
                echo "A reproducible dependency check requires a lockfile."
                echo
                echo "Status: **ERROR**"
              } | tee -a node-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
              has_error=true
            fi
          done

          if [[ "$has_error" == "true" ]]; then
            exit 1
          fi

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Installing dependencies across monorepo packages..."

          npm ci --ignore-scripts
          # shared/schemas must be installed before its local consumers.
          npm ci --prefix shared/schemas --ignore-scripts
          npm ci --prefix frontend --ignore-scripts
          npm ci --prefix mobile --ignore-scripts

      - name: Check Unused Dependencies
        shell: bash
        run: |
          set -uo pipefail

          status=0
          npm run deps:unused > knip.log 2>&1 || status=$?

          {
            echo
            echo "## Knip"
            echo

            if [[ "$status" -eq 0 ]]; then
              echo "No unused JavaScript/TypeScript dependencies found."
              echo
              echo "Status: **PASS**"
            else
              echo "Knip reported unused dependencies."
              echo
              echo "Status: **FINDINGS**"
              echo
              echo '<details><summary>Knip output</summary>'
              echo
              echo '```text'
              cat knip.log
              echo '```'
              echo '</details>'
            fi
          } | tee -a node-audit-summary.md >> "$GITHUB_STEP_SUMMARY"

          # This scheduled audit reports findings through the tracking issue.
          exit 0

      - name: Upload Node audit summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-audit-summary
          path: node-audit-summary.md
          if-no-files-found: error
          retention-days: 30


  gradle-audit:
    name: Check Gradle Dependency Usage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize summary
        shell: bash
        run: |
          set -euo pipefail
          cat > gradle-audit-summary.md <<'EOF'
          # Gradle Dependency Usage

          EOF

      - name: Detect Gradle project
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ -x ./gradlew ]]; then
            echo "has_gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gradle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report missing Gradle wrapper
        if: steps.detect.outputs.has_gradle == 'false'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Gradle dependency usage"
            echo
            echo "No executable \`./gradlew\` wrapper was found. Gradle dependency checks skipped."
            echo
            echo "Status: **SKIPPED**"
          } | tee -a gradle-audit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        if: steps.detect.outputs.has_gradle == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        if: steps.detect.outputs.has_gradle == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Check Unused Gradle Dependencies
        if: steps.detect.outputs.has_gradle == 'true'
        shell: bash
        run: |
          set -uo pipefail

          status=0
          ./gradlew buildHealth > buildhealth.log 2>&1 || status=$?

          {
            echo
            echo "## AutonomousApps buildHealth"
            echo

            if [[ -s build/reports/dependency-analysis/build-health-report.txt ]]; then
              echo "Status: **FINDINGS / REPORT**"
              echo
              echo '<details><summary>buildHealth report</summary>'
              echo
              echo '```text'
              cat build/reports/dependency-analysis/build-health-report.txt
              echo '```'
              echo '</details>'
            elif [[ "$status" -eq 0 ]]; then
              echo "No unused Gradle dependencies found."
              echo
              echo "Status: **PASS**"
            else
              echo "buildHealth failed to execute."
              echo
              echo "Status: **ERROR**"
              echo
              echo '<details><summary>buildHealth output</summary>'
              echo
              echo '```text'
              cat buildhealth.log
              echo '```'
              echo '</details>'
            fi
          } | tee -a gradle-audit-summary.md >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

      - name: Upload Gradle audit summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-audit-summary
          path: gradle-audit-summary.md
          if-no-files-found: error
          retention-days: 30

  report:
    name: Update Dependency Maintenance Issue
    needs:
      - node-audit
      - gradle-audit
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write

    steps:
      - name: Download audit summaries
        uses: actions/download-artifact@v8
        with:
          path: summaries
          pattern: '*-audit-summary'
          merge-multiple: true

      - name: Read Renovate abandonment report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "Dependency Dashboard"`;
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 10,
            });
            const dashboard = data.items.find((item) => item.title === 'Dependency Dashboard');

            if (!dashboard) {
              fs.writeFileSync(
                'abandonment-summary.md',
                '# Dependency Maintenance\n\n' +
                  '## Abandoned Dependencies\n\n' +
                  'The Renovate Dependency Dashboard was not found.\n\n' +
                  'Status: **ERROR**\n',
              );
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: dashboard.number,
            });
            const dashboardBody = issue.body ?? '';
            const heading = '## Abandoned Dependencies';
            const start = dashboardBody.indexOf(heading);
            const end =
              start === -1 ? -1 : dashboardBody.indexOf('\n## ', start + heading.length);
            const source =
              `[Renovate Dependency Dashboard](${issue.html_url}), updated ${issue.updated_at}. ` +
              'Threshold: `abandonments:recommended` (one year, with community overrides).';
            const report =
              start === -1
                ? '## Abandoned Dependencies\n\n' +
                  'No dependencies have gone at least one year without a release.\n\n' +
                  'Status: **PASS**'
                : dashboardBody.slice(start, end === -1 ? undefined : end).trim() +
                  '\n\nStatus: **FINDINGS**';

            fs.writeFileSync(
              'abandonment-summary.md',
              `# Dependency Maintenance\n\n${source}\n\n${report}\n`,
            );

      - name: Assemble issue body
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Dependency Maintenance Audit"
            echo
            echo "_Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')_"
            echo
            echo "_Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
            echo
            echo "---"
            echo
            cat summaries/node-audit-summary.md 2>/dev/null || {
              echo "## JavaScript / Node"
              echo
              echo "No Node report was produced. The job may have failed before the summary was uploaded."
            }
            echo
            echo "---"
            echo
            cat summaries/gradle-audit-summary.md 2>/dev/null || {
              echo "## Gradle"
              echo
              echo "No Gradle report was produced. The job may have failed before the summary was uploaded."
            }
            echo
            echo "---"
            echo
            cat abandonment-summary.md
          } > issue-body.md

      - name: Create or update dependency-health issue
        uses: actions/github-script@v9
        env:
          ISSUE_TITLE: Dependency Maintenance Audit
          ISSUE_LABEL: dependency-health
        with:
          script: |
            const fs = require('fs');

            const body = fs.readFileSync('issue-body.md', 'utf8');
            const title = process.env.ISSUE_TITLE;
            const label = process.env.ISSUE_LABEL;

            // Ensure the tracking label exists.
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  description: 'Dependency maintenance audit tracking issue',
                });
              } else {
                throw error;
              }
            }

            const { data: results } =
              await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:${label}`,
                per_page: 10,
              });

            if (results.items.length > 0) {
              const issue = results.items[0];

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title,
                body,
                labels: [label],
              });

              core.info(`Updated dependency maintenance issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });

              core.info(`Created dependency maintenance issue #${created.data.number}`);
            }
