name: Renovate

on:
  schedule:
    # Fires daily at 22:40 UTC; GitHub's scheduler lag lands execution later
    # (observed 2.5-3.6h for this cron, i.e. ~01:15-02:20 UTC). renovate.json
    # schedules branch work "on monday" (UTC), so exactly one daily run lands in
    # the weekly window whatever the lag is. The Dependency Maintenance Audit
    # chains off this run's completion and gates on the same Monday.
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run mode (full / lookup / extract / false)"
        type: choice
        default: "false"
        options:
          - "false"
          - "full"
          - "lookup"
          - "extract"
      logLevel:
        description: "Logging verbosity"
        type: choice
        default: "info"
        options:
          - "info"
          - "debug"
          - "trace"
      repoCache:
        description: "Repository cache control"
        type: choice
        default: "enabled"
        options:
          - "enabled"
          - "disabled"
          - "reset"

# Renovate authenticates with RENOVATE_TOKEN rather than GITHUB_TOKEN so its
# pull requests trigger this repository's normal pull_request workflows.
permissions:
  contents: read

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

env:
  # Keep in sync with the config validator image tag in ci.yml (Workflow Lint).
  renovate_version: "44"
  # Persists both the repository cache (extract results) and the file-based
  # package/HTTP cache beside it, so datasource lookups revalidate with ETags
  # instead of refetching from an empty cache on every ephemeral runner.
  cache_dir: /tmp/renovate/cache/renovate
  cache_key: renovate-cache

jobs:
  renovate:
    name: Update dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    # The config is validated at PR time (ci.yml, Workflow Lint) rather than
    # here, where a validator warning from a newer 44.x image would block every
    # update, security fixes included.
    steps:
      # Only the config file is needed: Renovate clones the repository itself.
      - name: Checkout Renovate config
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/renovate.json
          sparse-checkout-cone-mode: false

      - name: Restore Renovate cache
        id: cache-restore
        if: github.event.inputs.repoCache != 'disabled' && github.event.inputs.repoCache != 'reset'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.cache_key }}-

      - name: Fix restored cache permissions
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: sudo chown -R 12021:0 /tmp/renovate/

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          # Also loaded as global config so the global gitAuthor is this repo's
          # identity; without it Renovate warns on every run about its default
          # Mend address (repo config would still set the commit author).
          configurationFile: .github/renovate.json
          renovate-version: ${{ env.renovate_version }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.repoCache || 'enabled' }}
          RENOVATE_DRY_RUN: ${{ github.event.inputs.dryRun != 'false' && github.event.inputs.dryRun || '' }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}

      # The key is unique per run, so every successful run saves a fresh entry
      # and the next run restores the newest one via the prefix.
      - name: Save Renovate cache
        if: github.event.inputs.repoCache != 'disabled'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
