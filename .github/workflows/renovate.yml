name: Renovate

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run mode (full / lookup / extract / false)"
        type: choice
        default: "false"
        options:
          - "false"
          - "full"
          - "lookup"
          - "extract"
      logLevel:
        description: "Logging verbosity"
        type: choice
        default: "info"
        options:
          - "info"
          - "debug"
          - "trace"
      repoCache:
        description: "Repository cache control"
        type: choice
        default: "enabled"
        options:
          - "enabled"
          - "disabled"
          - "reset"

# Renovate authenticates with RENOVATE_TOKEN rather than GITHUB_TOKEN so its
# pull requests trigger this repository's normal pull_request workflows.
permissions:
  contents: read

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

env:
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-cache

jobs:
  renovate:
    name: Update dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # `npx --package renovate` downloads Renovate (~50s cold) on every run.
      # Cache npm's npx + registry data so an unchanged run reuses the prior
      # download, while a fresh key each run still lets a new Renovate release
      # be fetched when one lands.
      - name: Cache Renovate validator package
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: renovate-npm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            renovate-npm-${{ runner.os }}-

      - name: Validate Renovate configuration
        run: npx --yes --package renovate renovate-config-validator .github/renovate.json

      - name: Restore Renovate cache
        id: cache-restore
        if: github.event.inputs.repoCache != 'disabled' && github.event.inputs.repoCache != 'reset'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.cache_key }}-

      - name: Fix restored cache permissions
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: sudo chown -R 12021:0 /tmp/renovate/

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.1
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: .github/renovate.json
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.repoCache || 'enabled' }}
          RENOVATE_DRY_RUN: ${{ github.event.inputs.dryRun != 'false' && github.event.inputs.dryRun || '' }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}

      - name: Save Renovate cache
        if: github.event.inputs.repoCache != 'disabled' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
