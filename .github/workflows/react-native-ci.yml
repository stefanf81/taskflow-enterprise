name: React Native CI

on:
  workflow_dispatch:
    inputs:
      native_scope:
        description: Native architecture coverage
        type: choice
        options:
          - fast
          - full
        default: fast

permissions:
  contents: read

concurrency:
  group: react-native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  JAVA_VERSION: "17"
  COCOAPODS_VERSION: "1.17.0"

jobs:
  javascript:
    name: TypeScript and Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      # The repository's lint script is the TypeScript check (tsc --noEmit).
      - name: Type-check
        run: npm run lint

      - name: Run Jest tests with coverage
        run: npm test -- --ci --coverage --maxWorkers=50%

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: mobile/coverage/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          set +o pipefail
          yes | "${SDKMANAGER}" --licenses >/dev/null
          set -o pipefail
          "${SDKMANAGER}" --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Native projects are intentionally generated by Expo and ignored by Git.
      - name: Generate Android native project when absent
        shell: bash
        run: |
          if [[ ! -d android ]]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # Qualify the tasks so Gradle does not run same-named unit-test tasks in
      # Expo/RN dependency projects. Gradle 9 fails those tasks when they have
      # test sources but no discoverable tests; the app task is the CI target.
      - name: Run Android app lint, unit tests, and debug build
        working-directory: mobile/android
        shell: bash
        env:
          NATIVE_SCOPE: ${{ inputs.native_scope }}
        run: |
          set -euo pipefail

          architecture_args=()
          if [[ "${NATIVE_SCOPE}" == "fast" ]]; then
            architecture_args+=("-PreactNativeArchitectures=arm64-v8a")
          fi

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            "${architecture_args[@]}" \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/build/reports/
            mobile/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS simulator build
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # The project is developed with Xcode 26.6. Select it explicitly so runner
      # image updates cannot silently switch the build to another Xcode version.
      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select \
            --switch /Applications/Xcode_26.6.app/Contents/Developer

          xcodebuild -version
          xcode-select --print-path

      - name: Generate iOS native project when absent
        shell: bash
        run: |
          if [[ ! -d ios ]]; then
            npx expo prebuild --platform ios --no-install
          fi

      - name: Configure CocoaPods
        shell: bash
        run: |
          set -euo pipefail

          INSTALLED_VERSION="$(pod --version 2>/dev/null || true)"

          if [[ "${INSTALLED_VERSION}" != "${COCOAPODS_VERSION}" ]]; then
            sudo gem install cocoapods \
              --version "${COCOAPODS_VERSION}" \
              --no-document
          fi

          pod --version

      - name: Configure Node for Xcode build phases
        shell: bash
        run: printf 'export NODE_BINARY=%s\n' "$(command -v node)" > ios/.xcode.env.local

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f Podfile.lock ]]; then
            pod install --deployment --no-repo-update
          else
            echo "::warning::Podfile.lock is absent; pod dependency versions are not fully locked."
            pod install --no-repo-update
          fi

      - name: Build unsigned iOS simulator application
        shell: bash
        env:
          NATIVE_SCOPE: ${{ inputs.native_scope }}
        run: |
          set -euo pipefail

          architecture_args=()
          if [[ "${NATIVE_SCOPE}" == "fast" ]]; then
            architecture_args+=('ARCHS=arm64' 'ONLY_ACTIVE_ARCH=YES')
          fi

          xcodebuild \
            -workspace ios/TaskFlowMobile.xcworkspace \
            -scheme TaskFlowMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/DerivedData \
            -resultBundlePath ios/build/TaskFlowMobile.xcresult \
            "${architecture_args[@]}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload iOS simulator application
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-ios-simulator
          path: mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          path: mobile/ios/build/TaskFlowMobile.xcresult
          if-no-files-found: ignore
          retention-days: 7
