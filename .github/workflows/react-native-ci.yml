name: React Native CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "shared/schemas/**"
      - "api/**"
      - "scripts/sync-api-types.js"
      - "package.json"
      - ".github/workflows/react-native-ci.yml"
  # Deliberately unfiltered: the repository's branch ruleset requires the
  # "Mobile JavaScript", "Android build and test", and "iOS simulator build"
  # contexts on every pull request. Path filtering here leaves those contexts
  # "Expected" forever on backend/Gradle-only pull requests and blocks them
  # (e.g. Renovate dependency PRs). The `changes` job below decides whether the
  # individual jobs actually do any work.
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Include the event in the group so a push to main cannot cancel the scheduled
# (or manually dispatched) full native build. Only pull-request runs supersede
# each other.
concurrency:
  group: react-native-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  JAVA_VERSION: "17"
  COCOAPODS_VERSION: "1.17.0"
  # CocoaPods is installed into a cached, workspace-local GEM_HOME so the
  # macOS job does not recompile gems from RubyGems on every run.
  GEM_HOME: ${{ github.workspace }}/.gem
  GEM_PATH: ${{ github.workspace }}/.gem

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    # dorny/paths-filter enumerates PR changed files via the REST API, which
    # requires pull-requests: read. Job-scoped so the rest of the workflow
    # stays at the minimal contents: read default.
    permissions:
      contents: read
      pull-requests: read

    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect mobile changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - 'shared/schemas/**'
              - 'api/**'
              - 'scripts/sync-api-types.js'
              - 'package.json'
              - '.github/workflows/react-native-ci.yml'

  javascript:
    name: Mobile JavaScript
    needs: changes
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            shared/schemas/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: mobile

      # The repository's lint script is the TypeScript check (tsc --noEmit).
      - name: Type-check
        run: npm run lint

      - name: Run Jest tests with coverage
        run: npm test -- --ci --coverage --maxWorkers=50%

      - name: Verify generated API contracts
        working-directory: .
        run: npm run sync:api-types:check

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: mobile/coverage/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android build and test (${{ matrix.os }})
    needs: javascript
    if: |
      github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            startsWith(github.head_ref, 'renovate/') ||
            github.head_ref == 'maintenance/expo-sdk'
          )
        )
    # Trial matrix ahead of GitHub's `ubuntu-latest` migration to 26.04
    # (Oct 19 - Nov 19, 2026). 24.04 is required; 26.04 is non-blocking. The
    # Android SDK/NDK sdkmanager path and JDK/Gradle toolchain are the surfaces
    # most likely to differ. Once the 26.04 leg is green, drop the matrix and
    # pin `runs-on: ubuntu-26.04`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            experimental: false
          - os: ubuntu-26.04
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            shared/schemas/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          set +o pipefail
          yes | "${SDKMANAGER}" --licenses >/dev/null
          set -o pipefail
          "${SDKMANAGER}" --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006'

      - name: Install dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: mobile

      # Native projects are intentionally generated by Expo and ignored by Git.
      - name: Generate Android native project when absent
        shell: bash
        run: |
          if [[ ! -d android ]]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # Qualify the tasks so Gradle does not run same-named unit-test tasks in
      # Expo/RN dependency projects. Gradle 9 fails those tasks when they have
      # test sources but no discoverable tests; the app task is the CI target.
      - name: Run Android app lint, unit tests, and debug build
        working-directory: mobile/android
        shell: bash
        env:
          NATIVE_SCOPE: fast
        run: |
          set -euo pipefail

          gradle_args=(
            ./gradlew
            --no-daemon
            --stacktrace
            --build-cache
          )
          if [[ "${NATIVE_SCOPE}" == "fast" ]]; then
            gradle_args+=("-PreactNativeArchitectures=arm64-v8a")
          fi

          "${gradle_args[@]}" \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-android-debug-${{ matrix.os }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports-${{ matrix.os }}
          path: |
            mobile/android/app/build/reports/
            mobile/android/build/reports/
            mobile/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS simulator build
    needs: javascript
    if: |
      github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            startsWith(github.head_ref, 'renovate/') ||
            github.head_ref == 'maintenance/expo-sdk'
          )
        )
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            shared/schemas/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: mobile

      # The project is developed with Xcode 26.6. Select it explicitly so runner
      # image updates cannot silently switch the build to another Xcode version.
      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select \
            --switch /Applications/Xcode_26.6.app/Contents/Developer

          xcodebuild -version
          xcode-select --print-path

      - name: Generate iOS native project when absent
        shell: bash
        run: |
          if [[ ! -d ios ]]; then
            npx expo prebuild --platform ios --no-install
          fi

      - name: Cache CocoaPods gems
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.gem
          key: cocoapods-${{ runner.os }}-${{ env.COCOAPODS_VERSION }}

      - name: Configure CocoaPods
        shell: bash
        run: |
          set -euo pipefail

          # Install into the cached GEM_HOME (no sudo) and expose its binaries
          # to subsequent steps so `pod install` resolves the pinned version.
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$GEM_HOME/bin:$PATH"

          if [[ "$(pod --version 2>/dev/null || true)" != "${COCOAPODS_VERSION}" ]]; then
            gem install cocoapods \
              --version "${COCOAPODS_VERSION}" \
              --no-document
          fi

          pod --version

      - name: Configure Node for Xcode build phases
        shell: bash
        run: printf 'export NODE_BINARY=%s\n' "$(command -v node)" > ios/.xcode.env.local

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail

          # ios/ is generated by Expo and intentionally excluded from Git. The
          # JavaScript dependency graph is locked by mobile/package-lock.json;
          # generate and use CocoaPods' local lockfile during this build.
          pod install --no-repo-update

      - name: Build unsigned iOS simulator application
        shell: bash
        env:
          NATIVE_SCOPE: fast
        run: |
          set -euo pipefail

          xcodebuild_args=(
            xcodebuild
            -workspace ios/TaskFlowMobile.xcworkspace
            -scheme TaskFlowMobile
            -configuration Debug
            -sdk iphonesimulator
            -destination 'generic/platform=iOS Simulator'
            -derivedDataPath ios/build/DerivedData
            -resultBundlePath ios/build/TaskFlowMobile.xcresult
          )
          if [[ "${NATIVE_SCOPE}" == "fast" ]]; then
            xcodebuild_args+=('ARCHS=arm64' 'ONLY_ACTIVE_ARCH=YES')
          fi

          "${xcodebuild_args[@]}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload iOS simulator application
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-ios-simulator
          path: mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          path: mobile/ios/build/TaskFlowMobile.xcresult
          if-no-files-found: ignore
          retention-days: 7
