name: React Native CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  JAVA_VERSION: '17'
  COCOAPODS_VERSION: '1.17.0'

jobs:
  javascript:
    name: TypeScript and Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      # The repository's lint script is the TypeScript check (tsc --noEmit).
      - name: Type-check
        run: npm run lint

      - name: Run Jest tests with coverage
        run: npm test -- --ci --coverage --runInBand --forceExit

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: mobile/coverage/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android build and test
    needs: javascript
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          set +o pipefail
          yes | "${SDKMANAGER}" --licenses >/dev/null
          set -o pipefail
          "${SDKMANAGER}" --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Native projects are intentionally generated by Expo and ignored by Git.
      - name: Generate Android native project when absent
        shell: bash
        run: |
          if [[ ! -d android ]]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run Android lint, unit tests, and debug build
        working-directory: mobile/android
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/build/reports/
            mobile/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS simulator build
    needs: javascript
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Display Xcode version
        run: xcodebuild -version

      # Expo SDK 57 requires Xcode 26.4 or newer. macos-26 is the public
      # arm64 runner and currently provides a compatible Xcode toolchain.
      - name: Generate iOS native project when absent
        shell: bash
        run: |
          if [[ ! -d ios ]]; then
            npx expo prebuild --platform ios --no-install
          fi

      - name: Install locked CocoaPods version
        run: sudo gem install cocoapods --version "${COCOAPODS_VERSION}" --no-document

      - name: Configure Node for Xcode build phases
        shell: bash
        run: printf 'export NODE_BINARY=%s\n' "$(command -v node)" > ios/.xcode.env.local

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        shell: bash
        run: |
          if [[ -f Podfile.lock ]]; then
            pod install --deployment --no-repo-update
          else
            pod install --no-repo-update
          fi

      - name: Build unsigned iOS simulator application
        run: |
          xcodebuild \
            -workspace ios/TaskFlowMobile.xcworkspace \
            -scheme TaskFlowMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/DerivedData \
            -resultBundlePath ios/build/TaskFlowMobile.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload iOS simulator application
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-ios-simulator
          path: mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/TaskFlowMobile.app
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          path: mobile/ios/build/TaskFlowMobile.xcresult
          if-no-files-found: ignore
          retention-days: 7
