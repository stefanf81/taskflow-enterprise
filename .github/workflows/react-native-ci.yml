name: React Native CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "shared/schemas/**"
      - "api/**"
      - "scripts/sync-api-types.js"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/react-native-ci.yml"
      - ".github/actions/npm-ci/**"
      - ".github/actions/require-job-results/**"
      - ".github/scripts/**"
  # Deliberately unfiltered: the repository's branch ruleset requires the
  # "Mobile JavaScript", "Android build and test", and "iOS simulator build"
  # contexts on every pull request. Path filtering here leaves those contexts
  # "Expected" forever on backend/Gradle-only pull requests and blocks them
  # (e.g. Renovate dependency PRs). The `changes` job below decides whether the
  # individual jobs actually do any work.
  #
  # The "Android build and test" and "iOS simulator build" contexts are emitted
  # by the `android-gate` / `ios-gate` aggregators, not the native jobs (which
  # are named "Android native build" / "iOS native build"). A required check
  # that is merely skipped after an upstream failure reports success, so the
  # gates assert the prerequisite results and fail closed instead.
  pull_request:
    branches: [main]
  schedule:
    # Fires 22:32 UTC to land execution ~03:32 UTC (GitHub scheduler lag ~5h).
    - cron: "32 22 * * *"
  workflow_dispatch:
    inputs:
      native_scope:
        description: "Native build scope: fast (single arch) or full (all ABI/arches)"
        type: choice
        options:
          - fast
          - full
        default: fast

permissions:
  contents: read

# Include the event in the group so a push to main cannot cancel the scheduled
# (or manually dispatched) full native build. Only pull-request runs supersede
# each other.
concurrency:
  group: react-native-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  JAVA_VERSION: "17"
  # renovate: datasource=rubygems depName=cocoapods
  COCOAPODS_VERSION: "1.17.0"
  # CocoaPods is installed into a cached, workspace-local GEM_HOME so the
  # macOS job does not recompile gems from RubyGems on every run.
  GEM_HOME: ${{ github.workspace }}/.gem
  GEM_PATH: ${{ github.workspace }}/.gem

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    # dorny/paths-filter enumerates PR changed files via the REST API, which
    # requires pull-requests: read. Job-scoped so the rest of the workflow
    # stays at the minimal contents: read default.
    permissions:
      contents: read
      pull-requests: read

    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect mobile changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - 'shared/schemas/**'
              - 'api/**'
              - 'scripts/sync-api-types.js'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.github/workflows/react-native-ci.yml'
              - '.github/actions/npm-ci/**'
              - '.github/actions/require-job-results/**'
              - '.github/scripts/**'

  javascript:
    name: Mobile JavaScript
    needs: changes
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Node/npm steps below are YAML anchors reused by the native jobs.
      - &setup-node
        name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          # npm's download cache is managed by the restore/save steps below.
          package-manager-cache: false

      # setup-node's `cache: npm` keys on the exact lockfile hash with no
      # fallback, so every lockfile change (all Renovate PRs, which are the PRs
      # that run the native builds) re-downloaded every package and then saved
      # another ~190 MB PR-scoped entry. Pull requests now fall back to the
      # newest main snapshot and fetch only the delta; they never save. Other
      # events restore by exact key only, so the snapshot main saves holds just
      # the current lockfile's tarballs instead of growing with each fallback.
      - &restore-npm-cache
        name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('npm-{0}-{1}-', runner.os, runner.arch) || '' }}

      - &install-dependencies
        name: Install dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: mobile

      - &save-npm-cache
        name: Save npm download cache
        if: github.event_name != 'pull_request' && steps.npm-cache.outputs.cache-hit != 'true'
        # Best effort: the JavaScript and Android jobs share the Linux key and
        # may race to save it.
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      # The repository's lint script is the TypeScript check (tsc --noEmit).
      - name: Type-check
        run: npm run lint

      - name: Run Jest tests with coverage
        run: npm test -- --ci --coverage --maxWorkers=50%

      - name: Verify generated API contracts
        working-directory: .
        run: npm run sync:api-types:check

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: mobile/coverage/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android native build
    # JavaScript runs in parallel: the native builds only need the lockfiles,
    # not the type-check/Jest results. The android-gate still aggregates the
    # JavaScript result, so a JS failure keeps the required context red.
    needs: changes
    # Shared with `ios` via a YAML anchor: native builds run on the nightly,
    # on manual dispatch, and on same-repo Renovate/Expo-maintenance PRs that
    # actually touch mobile inputs. The `mobile` guard matters because native
    # builds no longer depend on the JavaScript job, so `changes` succeeding is
    # not by itself proof that a backend-only Renovate PR needs a native build.
    if: &native-build-gate |
      github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          needs.changes.outputs.mobile == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            startsWith(github.head_ref, 'renovate/') ||
            github.head_ref == 'maintenance/expo-sdk'
          )
        )
    # Pinned to ubuntu-26.04 ahead of GitHub's `ubuntu-latest` migration
    # (Oct 19 - Nov 19, 2026). The 26.04 image is the single blocking build
    # rather than a continue-on-error trial leg.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      # `fast` builds a single ABI/arch for CI; `full` builds every target and
      # is available only through workflow_dispatch.
      NATIVE_SCOPE: ${{ inputs.native_scope || 'fast' }}
      # ccache hashes the compiler by content (runner images re-download files)
      # and tolerates the timestamp churn of freshly installed node_modules.
      # Env vars outrank config files, so pinning the cache dir here guarantees
      # the CMake compiler launcher writes exactly where the action persists.
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
      CCACHE_MAXSIZE: 1G
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - *setup-node
      - *restore-npm-cache

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # React Native's CMake tasks are not Gradle-cacheable, so cache the
      # compilation results content-addressably via ccache instead. The
      # timestamped save key keeps snapshots writable (GitHub caches are
      # immutable, so a fixed key would freeze the first snapshot forever);
      # restore-keys fall back to the newest earlier snapshot, including ones
      # saved under a previous lockfile hash. `evict-old-files: job` drops
      # entries not touched by this run so each snapshot stays lean instead of
      # accumulating every historical object until max-size forces LRU churn.
      # Note: restore-keys must NOT end with a dash — append-timestamp adds the
      # separator itself.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: android-ccache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            android-ccache-${{ runner.os }}
          append-timestamp: true
          max-size: 1G
          evict-old-files: job

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Expo's generated android/gradle.properties caps the daemon at
      # -Xmx2048m / 512m metaspace, and CI builds ran it out of metaspace
      # ("The Daemon will expire after the build after running out of JVM
      # Metaspace"), which means GC churn during lint and dexing. Gradle-user-home
      # properties override the project's, so CI raises the caps without
      # touching the generated project (the runner has 16 GB).
      - &raise-gradle-memory
        name: Raise Gradle daemon memory for CI
        shell: bash
        run: |
          set -euo pipefail
          props="${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
          mkdir -p "$(dirname "$props")"
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' >> "$props"

      - &install-android-sdk
        name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          set +o pipefail
          yes | "${SDKMANAGER}" --licenses >/dev/null
          set -o pipefail
          "${SDKMANAGER}" --install \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'ndk;27.1.12297006'

      - *install-dependencies
      - *save-npm-cache

      # Native projects are intentionally generated by Expo and ignored by Git.
      - &prebuild-android
        name: Generate Android native project when absent
        shell: bash
        run: |
          if [[ ! -d android ]]; then
            npx expo prebuild --platform android --no-install
          fi

      # Gradle configuration cache is NOT enabled: the Expo-generated
      # app/build.gradle resolves node modules with `.execute()` at
      # configuration time, which Gradle rejects as configuration-cache
      # problems (build fails). Revisit when Expo stops shelling out.
      #
      # Cache the generated project's Gradle configuration/build state. The
      # dependency graph is fixed by the root package-lock.json, so the key is
      # stable across runs and independent of the regenerated android/ tree.
      - name: Cache Android Gradle project state
        uses: actions/cache@v6
        with:
          path: mobile/android/.gradle
          key: android-gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # Qualify the tasks so Gradle does not run same-named unit-test tasks in
      # Expo/RN dependency projects. Gradle 9 fails those tasks when they have
      # test sources but no discoverable tests; the app task is the CI target.
      - name: Run Android app lint, unit tests, and debug build
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail

          gradle_args=(
            ./gradlew
            --no-daemon
            --stacktrace
            --build-cache
            --init-script "$GITHUB_WORKSPACE/.github/scripts/android-ccache.init.gradle"
          )
          if [[ "${NATIVE_SCOPE}" == "fast" ]]; then
            gradle_args+=("-PreactNativeArchitectures=arm64-v8a")
          fi

          "${gradle_args[@]}" \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/build/reports/
            mobile/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ccache-action saves a new timestamped snapshot on every run
  # (`ccache-<job>-ccache-<os>-<lockfile hash>-<timestamp>`, ~37 MB for
  # Android) and restores only the newest one through its prefix restore key.
  # Older snapshots on the same ref are never read again, so keep just the
  # newest per job. Pull-request snapshots are left to cleanup-pr-caches.yml,
  # which deletes every cache of the PR ref when it closes. A job that did not
  # succeed may not have saved a snapshot, so its prefix is left alone.
  ccache-retention:
    name: Prune old ccache snapshots
    needs: [android, ios, android-e2e, ios-e2e]
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      (needs.android.result == 'success' || needs.ios.result == 'success' ||
      needs.android-e2e.result == 'success' || needs.ios-e2e.result == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      actions: write

    # No checkout: this job only calls the GitHub API.
    steps:
      - name: Delete all but the newest snapshot per job on this ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          ANDROID_E2E_RESULT: ${{ needs.android-e2e.result }}
          IOS_E2E_RESULT: ${{ needs.ios-e2e.result }}
        run: |
          set -euo pipefail

          prefixes=()
          [[ "$ANDROID_RESULT" == success ]] && prefixes+=("ccache-android-ccache-")
          [[ "$IOS_RESULT" == success ]] && prefixes+=("ccache-ios-ccache-")
          [[ "$ANDROID_E2E_RESULT" == success ]] && prefixes+=("ccache-android-e2e-ccache-")
          [[ "$IOS_E2E_RESULT" == success ]] && prefixes+=("ccache-ios-e2e-ccache-")
          prefixes_json="$(printf '%s\n' "${prefixes[@]}" | jq -R . | jq -sc .)"

          stale_ids="$(gh api --method GET --paginate --slurp \
            "/repos/$REPO/actions/caches" -f per_page=100 -f ref="$REF" \
            | jq -r --argjson prefixes "$prefixes_json" '
              [.[].actions_caches[]] as $caches
              | $prefixes[] as $p
              | [$caches[] | select(.key | startswith($p))]
              | sort_by([.created_at, .id])
              | .[0:-1][] | .id
            ')"

          if [[ -z "$stale_ids" ]]; then
            echo "No stale ccache snapshots on $REF."
            exit 0
          fi

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          deleted=0
          failures=0
          while IFS= read -r id; do
            if gh api --silent --method DELETE "/repos/$REPO/actions/caches/$id" 2> "$error_file"; then
              deleted=$((deleted + 1))
              continue
            fi
            error="$(<"$error_file")"
            # 404: already evicted or deleted by a concurrent run.
            if [[ "$error" != *"(HTTP 404)"* ]]; then
              echo "::error::Failed to delete cache $id: $error"
              failures=$((failures + 1))
            fi
          done <<< "$stale_ids"

          echo "Deleted $deleted stale ccache snapshot(s) on $REF." | tee -a "$GITHUB_STEP_SUMMARY"
          if (( failures > 0 )); then
            echo "::error::$failures cache deletion(s) failed."
            exit 1
          fi

  # The branch ruleset requires the exact context "Android build and test".
  # This aggregator owns it: it always reports (so non-mobile PRs are not
  # blocked) and fails when an upstream prerequisite failed, rather than
  # letting a skipped native job read as success.
  android-gate:
    name: Android build and test
    # Depend on the whole mobile chain so an upstream failure cannot be masked
    # as a skipped-and-therefore-successful native job.
    needs: [changes, javascript, android]
    # Runs even when `android` is skipped (non-mobile PRs) so the required
    # context is always reported, but not on cancellation (`always()` would
    # report a bogus success for a superseded run).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert mobile job results
        uses: ./.github/actions/require-job-results
        with:
          needs: ${{ toJSON(needs) }}
          required: changes

  ios:
    name: iOS native build
    # JavaScript runs in parallel; ios-gate owns the required context and still
    # aggregates the JavaScript result (see the android job above).
    needs: changes
    if: *native-build-gate
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # `fast` builds a single arch for CI; `full` builds every target and is
      # available only through workflow_dispatch.
      NATIVE_SCOPE: ${{ inputs.native_scope || 'fast' }}
      # React Native's post_install routes every pod's clang through its
      # ccache wrapper only when USE_CCACHE=1 and ccache is on PATH; otherwise
      # it strips the wrapper ("[Ccache]: Removing Ccache from CC, ..."). The
      # wrapper points CCACHE_CONFIGPATH at RN's own ccache.conf (sloppiness,
      # depend mode), which replaces the config file ccache-action writes, so
      # the cache dir and size must come from the environment.
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - *setup-node
      - *restore-npm-cache
      - *install-dependencies
      - *save-npm-cache

      # The project is developed with Xcode 26.6. Select it explicitly so runner
      # image updates cannot silently switch the build to another Xcode version.
      - &select-xcode
        name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select \
            --switch /Applications/Xcode_26.6.app/Contents/Developer

          xcodebuild -version
          xcode-select --print-path

      - &prebuild-ios
        name: Generate iOS native project when absent
        shell: bash
        run: |
          if [[ ! -d ios ]]; then
            npx expo prebuild --platform ios --no-install
          fi

      # The cached gems compile native extensions against the runner's system
      # Ruby. macOS image updates can change that Ruby version, so the key must
      # include it or a stale GEM_HOME would be restored and `pod` would break.
      - &read-ruby-version
        name: Read system Ruby version
        id: ruby
        shell: bash
        run: echo "version=$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"

      - &cache-cocoapods-gems
        name: Cache CocoaPods gems
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.gem
          key: cocoapods-${{ runner.os }}-ruby${{ steps.ruby.outputs.version }}-${{ env.COCOAPODS_VERSION }}

      # CocoaPods' download cache. The pods are local podspecs, but React
      # Native's and Expo's prebuilt pods are `:http` sources, and their
      # extracted copies live here: without it `pod install` took 97 s instead
      # of 53 s (unpacking ReactNativeDependencies alone took 50 s), more than
      # the ~29 s restore. Keyed on the JavaScript dependency lock, which
      # determines the pod graph. Saved right after `pod install` and never
      # from pull requests: a lockfile PR misses the exact key on every run,
      # and saving its PR-scoped copy cost ~9 s while evicting main's caches.
      - &restore-cocoapods-specs
        name: Restore CocoaPods download cache
        id: pods-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-specs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cocoapods-specs-${{ runner.os }}-

      # Same timestamped-snapshot scheme as the Android job (see there); the
      # `ccache-retention` job keeps only the newest snapshot per ref.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ios-ccache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ios-ccache-${{ runner.os }}
          append-timestamp: true
          max-size: 1G
          evict-old-files: job

      # RN's wrapper runs `exec $CCACHE_BINARY clang "$@"`, but CCACHE_BINARY
      # is a build setting, and Xcode exports build settings to script phases,
      # not to compiler processes. The compiles ran bare clang and ccache saw
      # no calls at all (CompileC: 150 tasks, ~1500 s of task time). Compilers
      # do inherit xcodebuild's environment, so provide the variable there.
      - &expose-ccache-binary
        name: Expose ccache to React Native's compiler wrapper
        run: echo "CCACHE_BINARY=$(command -v ccache)" >> "$GITHUB_ENV"

      - &configure-cocoapods
        name: Configure CocoaPods
        shell: bash
        run: |
          set -euo pipefail

          # Install into the cached GEM_HOME (no sudo) and expose its binaries
          # to subsequent steps so `pod install` resolves the pinned version.
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$GEM_HOME/bin:$PATH"

          if [[ "$(pod --version 2>/dev/null || true)" != "${COCOAPODS_VERSION}" ]]; then
            gem install cocoapods \
              --version "${COCOAPODS_VERSION}" \
              --no-document
          fi

          pod --version

      - &configure-xcode-node
        name: Configure Node for Xcode build phases
        shell: bash
        run: printf 'export NODE_BINARY=%s\n' "$(command -v node)" > ios/.xcode.env.local

      # Expo compiles ExpoModulesJSI.xcframework from its SwiftPM sources in a
      # build phase, and skips that only when a slice's recorded .build-hash
      # (sources, jsi.h, RN version, Swift toolchain, absolute paths) matches.
      # A fresh `npm ci` leaves only stub slices, so CI rebuilt it every run.
      # Restored before `pod install`, whose stub stamping keeps existing
      # slices; a stale snapshot is simply rebuilt by Expo's own hash check,
      # so a prefix fallback is safe on every event.
      # npm workspaces hoist expo-modules-jsi to the repository root's node_modules (a version
      # conflict would put it under mobile/node_modules instead), so resolve the real directory
      # from the app rather than hard-coding either location.
      - &locate-expo-modules-jsi
        name: Locate ExpoModulesJSI xcframework
        id: jsi-path
        shell: bash
        working-directory: mobile
        run: |
          set -euo pipefail
          dir="$(node -p "require('path').relative(process.env.GITHUB_WORKSPACE, require('path').dirname(require.resolve('expo-modules-jsi/package.json')))")"
          echo "path=${dir}/apple/Products/ExpoModulesJSI.xcframework" >> "$GITHUB_OUTPUT"

      - &restore-expo-modules-jsi
        name: Restore ExpoModulesJSI xcframework
        id: jsi-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.jsi-path.outputs.path }}
          key: expo-modules-jsi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            expo-modules-jsi-${{ runner.os }}-${{ runner.arch }}-

      - &install-pods
        name: Install CocoaPods dependencies
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail

          # ios/ is generated by Expo and intentionally excluded from Git. The
          # JavaScript dependency graph is locked by the root package-lock.json;
          # generate and use CocoaPods' local lockfile during this build.
          pod install --no-repo-update

      - name: Save CocoaPods download cache
        if: github.event_name != 'pull_request' && steps.pods-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      # C/C++/Objective-C compiles go through ccache (job env above). A
      # restored DerivedData/Build snapshot is deliberately not used: it made
      # xcodebuild slower (fresh project UUIDs invalidate the incremental
      # database). Swift compiles are not cached.
      - name: Build unsigned iOS simulator application
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild_args=(
            xcodebuild
            -workspace ios/TaskFlowMobile.xcworkspace
            -scheme TaskFlowMobile
            -configuration Debug
            -sdk iphonesimulator
            -destination 'generic/platform=iOS Simulator'
            -derivedDataPath ios/build/DerivedData
            -resultBundlePath ios/build/TaskFlowMobile.xcresult
            -showBuildTimingSummary
          )
          if [[ "${NATIVE_SCOPE}" == "fast" ]]; then
            xcodebuild_args+=('ARCHS=arm64' 'ONLY_ACTIVE_ARCH=YES')
          else
            # The Expo-generated Debug configuration sets ONLY_ACTIVE_ARCH=YES;
            # override it so a full build compiles every supported simulator
            # architecture rather than only the runner's own.
            xcodebuild_args+=('ARCHS=arm64 x86_64' 'ONLY_ACTIVE_ARCH=NO')
          fi

          # The raw output (~30k lines, mostly per-task environment dumps) is
          # more than the Actions log API returns, so the console gets
          # xcbeautify's one line per task and the raw log is uploaded below.
          raw_log="${RUNNER_TEMP}/xcodebuild.log"
          formatter=(cat)
          if command -v xcbeautify >/dev/null; then
            formatter=(xcbeautify)
          fi

          # The step result follows xcodebuild alone, not the log formatter.
          set +e
          "${xcodebuild_args[@]}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "${raw_log}" | "${formatter[@]}"
          pipe_status=("${PIPESTATUS[@]}")
          set -e

          # Per-phase totals from -showBuildTimingSummary, so runs can be
          # compared without downloading the raw log.
          timing="$(sed -n '/^Build Timing Summary/,/\*\* BUILD/p' "${raw_log}")"
          if [[ -n "${timing}" ]]; then
            printf '%s\n' "${timing}"
            printf '### iOS build timing\n\n```\n%s\n```\n' "${timing}" >> "${GITHUB_STEP_SUMMARY}"
          fi

          # xcodebuild does not echo script-phase output, but Xcode's activity
          # log keeps it: show whether the cached ExpoModulesJSI slice was
          # reused or rebuilt (and how long the rebuild took).
          find ios/build/DerivedData/Logs/Build -name '*.xcactivitylog' -exec gzip -dc {} + 2>/dev/null \
            | LC_ALL=C grep -a -o -E '\[ExpoModulesJSI\] (Built xcframework successfully in [0-9]+s|xcframework slices up to date, skipping build)' \
            | sort -u || true

          exit "${pipe_status[0]}"

      - name: Save ExpoModulesJSI xcframework
        if: github.event_name != 'pull_request' && steps.jsi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.jsi-path.outputs.path }}
          key: ${{ steps.jsi-cache.outputs.cache-primary-key }}

      - name: Upload iOS simulator application
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-ios-simulator
          path: mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          path: mobile/ios/build/TaskFlowMobile.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload raw xcodebuild log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  # Mirror of `android-gate` for the required "iOS simulator build" context.
  # `ios` has no matrix, but a job skipped after an upstream failure still
  # reports success to branch protection, so the gate asserts the prerequisite
  # results rather than relying on the skipped check.
  ios-gate:
    name: iOS simulator build
    needs: [changes, javascript, ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert mobile job results
        uses: ./.github/actions/require-job-results
        with:
          needs: ${{ toJSON(needs) }}
          required: changes

  ###########################################################
  # Nightly mobile E2E (Detox)
  ###########################################################

  # Detox runs the release apps against a real backend: the packaged JAR on
  # localhost:8080 with the default profile (in-memory H2 with the demo seed
  # data, no Redis, dev admin password), launched like the OpenAPI contract job
  # in ci.yml does it. GitHub's macOS runners have no Docker, so the compose
  # stack the local runs use (nginx on :4200) is not an option there; the
  # tests exercise UI flows, not nginx or PostgreSQL. An iOS simulator shares
  # the host's network, and the app maps localhost to 10.0.2.2 on the Android
  # emulator. Nightly only, and not part of the required gates: a failure turns
  # the nightly red without blocking pull requests.
  e2e-backend-jar:
    name: Mobile E2E backend JAR
    # Nightly, and manually dispatchable so a change to the E2E setup itself
    # (e.g. the Homebrew formula trust fix) can be verified without waiting a
    # day for the schedule. Still outside the required gates.
    if: &e2e-gate |
      github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The backend toolchain (build.gradle), not this workflow's JAVA_VERSION.
          java-version: "25"

      # Restores ci.yml's `backend` entry read-only, like its `package` job.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: backend
        with:
          cache-read-only: true

      - name: Build JAR
        run: ./gradlew --build-cache bootJar --stacktrace

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: e2e-backend-jar
          path: build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  android-e2e:
    name: Android Detox E2E
    needs: e2e-backend-jar
    if: *e2e-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: http://localhost:8080
      EXPO_PUBLIC_E2E_LOCAL_API: "true"
      # The runner and its emulator are x86_64 (.detoxrc.js defaults to arm64-v8a for Apple Silicon).
      DETOX_ANDROID_ABIS: x86_64
      # Same ccache settings as the `android` job; see there.
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
      CCACHE_MAXSIZE: 1G
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - *setup-node
      - *restore-npm-cache

      # 25 runs the backend JAR (Java 25 bytecode); 21, listed last, is the
      # default JAVA_HOME for the app build: the local Detox builds use 21 and
      # JDK 25 fails React Native's CMake configuration (mobile/e2e/README.md).
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      # The `android` job owns the writable Gradle cache; restore its entry.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: android
        with:
          cache-read-only: true

      - *raise-gradle-memory

      - *install-android-sdk

      # The emulator step installs the latest emulator and the system image
      # (~45 s) before it boots. Fetch both now, alongside the app build; that
      # step then finds them installed. Only network and unzip, so unlike an
      # early emulator boot it does not compete with Gradle for the CPU.
      - name: Start downloading the emulator in the background
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          nohup bash -c '"$0" --install emulator "system-images;android-35;google_apis;x86_64" > "$1" 2>&1; echo $? > "$2"' \
            "${SDKMANAGER}" "${RUNNER_TEMP}/emulator-sdk.log" "${RUNNER_TEMP}/emulator-sdk.status" \
            > /dev/null 2>&1 &

      - *install-dependencies
      - *save-npm-cache

      - name: Download backend JAR
        uses: actions/download-artifact@v8
        with:
          name: e2e-backend-jar
          path: e2e-backend-jar

      # Boots while the app builds; wait-backend checks it before the tests.
      - name: Start backend
        id: backend
        uses: ./.github/actions/start-backend
        env: &e2e-backend-access-log
          # CI-only: path/status/duration, never query strings, headers, credentials or bodies.
          SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
          SERVER_TOMCAT_ACCESSLOG_DIRECTORY: ${{ github.workspace }}/e2e-backend-diagnostics
          SERVER_TOMCAT_ACCESSLOG_PATTERN: "%t %m %U %s %D"
          SERVER_TOMCAT_ACCESSLOG_BUFFERED: "false"
        with:
          jar-path: e2e-backend-jar/*.jar
          log-file: e2e-backend.log
          java-home: ${{ env.JAVA_HOME_25_X64 }}
          java-options: -XX:TieredStopAtLevel=1
          wait: "false"

      - *prebuild-android

      # Own snapshots: this x86_64 release build shares few objects with the
      # `android` job's arm64-v8a debug build. Pruned by `ccache-retention`.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: android-e2e-ccache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            android-e2e-ccache-${{ runner.os }}
          append-timestamp: true
          max-size: 1G
          evict-old-files: job

      # The build command lives in .detoxrc.js, so apply the ccache init
      # script through Gradle's init.d directory instead of --init-script.
      - name: Build Detox release APK and test APK
        run: |
          init_d="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_d"
          cp "$GITHUB_WORKSPACE/.github/scripts/android-ccache.init.gradle" "$init_d/"
          chmod +x android/gradlew
          npm run e2e:build:android

      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Not fatal: whatever the download did not install, the emulator step
      # installs itself.
      - name: Wait for the background emulator download
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/emulator-sdk.status"
          start=$SECONDS
          while [[ ! -s "${status_file}" ]]; do sleep 1; done
          echo "Waited $((SECONDS - start)) s for the emulator download."
          if [[ "$(cat "${status_file}")" != 0 ]]; then
            cat "${RUNNER_TEMP}/emulator-sdk.log"
            echo "::warning::Background emulator download failed; the emulator step installs it."
          fi

      - name: Wait for backend
        uses: ./.github/actions/wait-backend
        with:
          pid: ${{ steps.backend.outputs.pid }}
          log-file: e2e-backend.log

      - &mobile-backend-preflight
        name: Verify mobile backend authentication
        working-directory: .
        timeout-minutes: 1
        run: node .github/scripts/mobile-e2e-backend.cjs preflight

      # A fresh AVD without a snapshot, so its clock is the runner's (a resumed
      # snapshot keeps its old date, see mobile/e2e/README.md). The AVD name is
      # the one .detoxrc.js asks for, so Detox attaches to this emulator.
      - name: Run Detox on the Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: Pixel_6_API_35
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          # The google_apis image's setup wizard (com.google.android.googlesdksetup) can ANR on a
          # cold boot; its "isn't responding" dialog takes window focus and every Espresso action
          # then fails (run 40739750111). Disabling it kills the process and its dialog.
          script: |
            adb shell pm disable-user --user 0 com.google.android.googlesdksetup || true
            npx detox test --configuration android.emu.release --headless --take-screenshots failing --record-logs failing --artifacts-location artifacts/detox

      - &mobile-backend-diagnostics
        name: Capture backend diagnostics on failure
        if: failure() && steps.backend.outputs.pid != ''
        continue-on-error: true
        timeout-minutes: 2
        working-directory: .
        env:
          BACKEND_PID: ${{ steps.backend.outputs.pid }}
          # Android builds with JDK 21, but its backend and attach tools must use JDK 25.
          BACKEND_JAVA_HOME: ${{ env.JAVA_HOME_25_X64 || env.JAVA_HOME }}
        run: node .github/scripts/mobile-e2e-backend.cjs diagnostics

      - name: Upload Detox artifacts and backend log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-artifacts
          path: |
            mobile/artifacts/detox/
            e2e-backend.log
            e2e-backend-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  ios-e2e:
    name: iOS Detox E2E
    needs: e2e-backend-jar
    if: *e2e-gate
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: http://localhost:8080
      EXPO_PUBLIC_E2E_LOCAL_API: "true"
      # Same ccache wiring as the `ios` job; see there.
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - *setup-node
      - *restore-npm-cache
      - *install-dependencies
      - *save-npm-cache

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Only runs the backend JAR (build.gradle toolchain).
          java-version: "25"

      - name: Download backend JAR
        uses: actions/download-artifact@v8
        with:
          name: e2e-backend-jar
          path: e2e-backend-jar

      - name: Start backend
        id: backend
        uses: ./.github/actions/start-backend
        env: *e2e-backend-access-log
        with:
          jar-path: e2e-backend-jar/*.jar
          log-file: e2e-backend.log
          java-options: -XX:TieredStopAtLevel=1
          wait: "false"

      # Same setup as the `ios` job (its caches are restored, never saved here).
      - *select-xcode
      - *prebuild-ios
      - *read-ruby-version
      - *cache-cocoapods-gems
      - *restore-cocoapods-specs

      # Own snapshots: this Release build compiles with other flags than the
      # `ios` job's Debug build, so they share no objects. Set up before
      # `pod install`, which wires in the wrapper only when ccache is on PATH.
      # Pruned by `ccache-retention`.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ios-e2e-ccache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ios-e2e-ccache-${{ runner.os }}
          append-timestamp: true
          max-size: 1G
          evict-old-files: job
      - *expose-ccache-binary

      - *configure-cocoapods
      - *configure-xcode-node
      - *locate-expo-modules-jsi
      - *restore-expo-modules-jsi
      - *install-pods

      # Detox drives iOS simulators through applesimutils.
      - name: Install applesimutils
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap wix/brew
          # A fully qualified install trusts only this formula, not the whole tap.
          brew install wix/brew/applesimutils

      - name: Build Detox framework cache
        run: npx detox build-framework-cache

      # The raw xcodebuild output is too long for the Actions log; keep it as
      # an artifact and print the tail when the build fails.
      - name: Build Detox release app
        run: |
          log="${RUNNER_TEMP}/ios-e2e-build.log"
          if ! npm run e2e:build > "${log}" 2>&1; then
            tail -n 150 "${log}"
            exit 1
          fi

      # Checked before the simulator boots: a first boot saturates the runner,
      # and the backend's 3 s health probes all timed out under it.
      - name: Wait for backend
        uses: ./.github/actions/wait-backend
        with:
          pid: ${{ steps.backend.outputs.pid }}
          log-file: e2e-backend.log

      - *mobile-backend-preflight

      # Detox gets this simulator's UDID (.detoxrc.js). Matching by type alone
      # let it pick and boot another "iPhone 17 Pro" inside its silent setup
      # (2-17 min). The boot starts after the builds: booting during them
      # slowed the framework-cache step from seconds to 2.5 min. The wait step
      # before Detox times it.
      - name: Create and start booting the Detox simulator
        id: simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro")] | first | .udid // empty')"
          if [[ -z "$udid" ]]; then
            runtime="$(xcrun simctl list runtimes available -j \
              | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier')"
            udid="$(xcrun simctl create "iPhone 17 Pro" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "${runtime}")"
          fi
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "${udid}"

      - name: Wait for the Detox simulator to finish booting
        timeout-minutes: 25
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          start=$SECONDS
          xcrun simctl bootstatus "${UDID}" -b
          echo "Simulator ready after $((SECONDS - start)) s of waiting." | tee -a "$GITHUB_STEP_SUMMARY"

      # Pinned to the simulator booted above. Debug logging shows the setup
      # phase (device allocation, app install, launch), which info level leaves
      # silent; it sat there for 2-17 min in earlier runs. The step timeout
      # fails a hang well inside the job budget so the diagnostics still run.
      # No `--record-logs`: on iOS it runs `simctl get_app_container` and a
      # debug-level `log stream` before every launch, and every test relaunches
      # the app. On the loaded simulator those calls took 1.5-26 s each and
      # the app took up to 31 s to start (iOS 433 s vs Android 109 s for the
      # same 9 tests). The step below dumps the app's log once on failure.
      - name: Run Detox on the iOS simulator
        timeout-minutes: 30
        env:
          DETOX_IOS_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: npx detox test --configuration ios.sim.release --headless --loglevel debug --take-screenshots failing --artifacts-location artifacts/detox

      - name: Collect the app's simulator log on failure
        if: failure() && steps.simulator.outputs.udid != ''
        continue-on-error: true
        timeout-minutes: 3
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p artifacts/detox
          xcrun simctl spawn "${UDID}" log show --last 1h --info --style compact \
            --predicate 'process == "TaskFlowMobile"' > artifacts/detox/simulator-app.log

      - *mobile-backend-diagnostics

      - name: Upload Detox artifacts, build log and backend log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-artifacts
          path: |
            mobile/artifacts/detox/
            ${{ runner.temp }}/ios-e2e-build.log
            e2e-backend.log
            e2e-backend-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
