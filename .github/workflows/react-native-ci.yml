name: React Native CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "shared/schemas/**"
      - "api/**"
      - "scripts/sync-api-types.js"
      - "package.json"
      - ".github/workflows/react-native-ci.yml"
      - ".github/actions/npm-ci/**"
      - ".github/actions/require-job-results/**"
      - ".github/scripts/**"
  # Deliberately unfiltered: the repository's branch ruleset requires the
  # "Mobile JavaScript", "Android build and test", and "iOS simulator build"
  # contexts on every pull request. Path filtering here leaves those contexts
  # "Expected" forever on backend/Gradle-only pull requests and blocks them
  # (e.g. Renovate dependency PRs). The `changes` job below decides whether the
  # individual jobs actually do any work.
  #
  # The "Android build and test" and "iOS simulator build" contexts are emitted
  # by the `android-gate` / `ios-gate` aggregators, not the native jobs (which
  # are named "Android native build" / "iOS native build"). A required check
  # that is merely skipped after an upstream failure reports success, so the
  # gates assert the prerequisite results and fail closed instead.
  pull_request:
    branches: [main]
  schedule:
    # Fires 22:32 UTC to land execution ~03:32 UTC (GitHub scheduler lag ~5h).
    - cron: "32 22 * * *"
  workflow_dispatch:
    inputs:
      native_scope:
        description: "Native build scope: fast (single arch) or full (all ABI/arches)"
        type: choice
        options:
          - fast
          - full
        default: fast

permissions:
  contents: read

# Include the event in the group so a push to main cannot cancel the scheduled
# (or manually dispatched) full native build. Only pull-request runs supersede
# each other.
concurrency:
  group: react-native-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  JAVA_VERSION: "17"
  COCOAPODS_VERSION: "1.17.0"
  # CocoaPods is installed into a cached, workspace-local GEM_HOME so the
  # macOS job does not recompile gems from RubyGems on every run.
  GEM_HOME: ${{ github.workspace }}/.gem
  GEM_PATH: ${{ github.workspace }}/.gem

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    # dorny/paths-filter enumerates PR changed files via the REST API, which
    # requires pull-requests: read. Job-scoped so the rest of the workflow
    # stays at the minimal contents: read default.
    permissions:
      contents: read
      pull-requests: read

    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect mobile changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - 'shared/schemas/**'
              - 'api/**'
              - 'scripts/sync-api-types.js'
              - 'package.json'
              - '.github/workflows/react-native-ci.yml'
              - '.github/actions/npm-ci/**'
              - '.github/actions/require-job-results/**'
              - '.github/scripts/**'

  javascript:
    name: Mobile JavaScript
    needs: changes
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Node/npm steps below are YAML anchors reused by the native jobs.
      - &setup-node
        name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          # npm's download cache is managed by the restore/save steps below.
          package-manager-cache: false

      # setup-node's `cache: npm` keys on the exact lockfile hash with no
      # fallback, so every lockfile change (all Renovate PRs, which are the PRs
      # that run the native builds) re-downloaded every package and then saved
      # another ~190 MB PR-scoped entry. Pull requests now fall back to the
      # newest main snapshot and fetch only the delta; they never save. Other
      # events restore by exact key only, so the snapshot main saves holds just
      # the current lockfile's tarballs instead of growing with each fallback.
      - &restore-npm-cache
        name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/package-lock.json', 'shared/schemas/package-lock.json') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('npm-{0}-{1}-', runner.os, runner.arch) || '' }}

      - &install-dependencies
        name: Install dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: mobile

      - &save-npm-cache
        name: Save npm download cache
        if: github.event_name != 'pull_request' && steps.npm-cache.outputs.cache-hit != 'true'
        # Best effort: the JavaScript and Android jobs share the Linux key and
        # may race to save it.
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      # The repository's lint script is the TypeScript check (tsc --noEmit).
      - name: Type-check
        run: npm run lint

      - name: Run Jest tests with coverage
        run: npm test -- --ci --coverage --maxWorkers=50%

      - name: Verify generated API contracts
        working-directory: .
        run: npm run sync:api-types:check

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: mobile/coverage/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android native build
    # JavaScript runs in parallel: the native builds only need the lockfiles,
    # not the type-check/Jest results. The android-gate still aggregates the
    # JavaScript result, so a JS failure keeps the required context red.
    needs: changes
    # Shared with `ios` via a YAML anchor: native builds run on the nightly,
    # on manual dispatch, and on same-repo Renovate/Expo-maintenance PRs that
    # actually touch mobile inputs. The `mobile` guard matters because native
    # builds no longer depend on the JavaScript job, so `changes` succeeding is
    # not by itself proof that a backend-only Renovate PR needs a native build.
    if: &native-build-gate |
      github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          needs.changes.outputs.mobile == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            startsWith(github.head_ref, 'renovate/') ||
            github.head_ref == 'maintenance/expo-sdk'
          )
        )
    # Pinned to ubuntu-26.04 ahead of GitHub's `ubuntu-latest` migration
    # (Oct 19 - Nov 19, 2026). The 26.04 image is the single blocking build
    # rather than a continue-on-error trial leg.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      # `fast` builds a single ABI/arch for CI; `full` builds every target and
      # is available only through workflow_dispatch.
      NATIVE_SCOPE: ${{ inputs.native_scope || 'fast' }}
      # ccache hashes the compiler by content (runner images re-download files)
      # and tolerates the timestamp churn of freshly installed node_modules.
      # Env vars outrank config files, so pinning the cache dir here guarantees
      # the CMake compiler launcher writes exactly where the action persists.
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
      CCACHE_MAXSIZE: 1G
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - *setup-node
      - *restore-npm-cache

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # React Native's CMake tasks are not Gradle-cacheable, so cache the
      # compilation results content-addressably via ccache instead. The
      # timestamped save key keeps snapshots writable (GitHub caches are
      # immutable, so a fixed key would freeze the first snapshot forever);
      # restore-keys fall back to the newest earlier snapshot, including ones
      # saved under a previous lockfile hash. `evict-old-files: job` drops
      # entries not touched by this run so each snapshot stays lean instead of
      # accumulating every historical object until max-size forces LRU churn.
      # Note: restore-keys must NOT end with a dash — append-timestamp adds the
      # separator itself.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: android-ccache-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            android-ccache-${{ runner.os }}
          append-timestamp: true
          max-size: 1G
          evict-old-files: job

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          set +o pipefail
          yes | "${SDKMANAGER}" --licenses >/dev/null
          set -o pipefail
          "${SDKMANAGER}" --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006'

      - *install-dependencies
      - *save-npm-cache

      # Native projects are intentionally generated by Expo and ignored by Git.
      - name: Generate Android native project when absent
        shell: bash
        run: |
          if [[ ! -d android ]]; then
            npx expo prebuild --platform android --no-install
          fi

      # Gradle configuration cache is NOT enabled: the Expo-generated
      # app/build.gradle resolves node modules with `.execute()` at
      # configuration time, which Gradle rejects as configuration-cache
      # problems (build fails). Revisit when Expo stops shelling out.
      #
      # Cache the generated project's Gradle configuration/build state. The
      # dependency graph is fixed by mobile/package-lock.json, so the key is
      # stable across runs and independent of the regenerated android/ tree.
      - name: Cache Android Gradle project state
        uses: actions/cache@v6
        with:
          path: mobile/android/.gradle
          key: android-gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # Qualify the tasks so Gradle does not run same-named unit-test tasks in
      # Expo/RN dependency projects. Gradle 9 fails those tasks when they have
      # test sources but no discoverable tests; the app task is the CI target.
      - name: Run Android app lint, unit tests, and debug build
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail

          gradle_args=(
            ./gradlew
            --no-daemon
            --stacktrace
            --build-cache
            --init-script "$GITHUB_WORKSPACE/.github/scripts/android-ccache.init.gradle"
          )
          if [[ "${NATIVE_SCOPE}" == "fast" ]]; then
            gradle_args+=("-PreactNativeArchitectures=arm64-v8a")
          fi

          "${gradle_args[@]}" \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/build/reports/
            mobile/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ccache-action saves a new timestamped snapshot on every run
  # (`ccache-android-ccache-<os>-<lockfile hash>-<timestamp>`, ~37 MB) and
  # restores only the newest one through its prefix restore key. Older
  # snapshots on the same ref are never read again, so keep just the newest.
  # Pull-request snapshots are left to cleanup-pr-caches.yml, which deletes
  # every cache of the PR ref when it closes.
  ccache-retention:
    name: Prune old Android ccache snapshots
    needs: android
    if: github.event_name != 'pull_request' && needs.android.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      actions: write

    # No checkout: this job only calls the GitHub API.
    steps:
      - name: Delete all but the newest snapshot on this ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          stale_ids="$(gh api --method GET --paginate --slurp \
            "/repos/$REPO/actions/caches" -f per_page=100 -f ref="$REF" \
            | jq -r '
              [.[].actions_caches[] | select(.key | startswith("ccache-android-ccache-"))]
              | sort_by([.created_at, .id])
              | .[0:-1][] | .id
            ')"

          if [[ -z "$stale_ids" ]]; then
            echo "No stale ccache snapshots on $REF."
            exit 0
          fi

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          deleted=0
          failures=0
          while IFS= read -r id; do
            if gh api --silent --method DELETE "/repos/$REPO/actions/caches/$id" 2> "$error_file"; then
              deleted=$((deleted + 1))
              continue
            fi
            error="$(<"$error_file")"
            # 404: already evicted or deleted by a concurrent run.
            if [[ "$error" != *"(HTTP 404)"* ]]; then
              echo "::error::Failed to delete cache $id: $error"
              failures=$((failures + 1))
            fi
          done <<< "$stale_ids"

          echo "Deleted $deleted stale ccache snapshot(s) on $REF." | tee -a "$GITHUB_STEP_SUMMARY"
          if (( failures > 0 )); then
            echo "::error::$failures cache deletion(s) failed."
            exit 1
          fi

  # The branch ruleset requires the exact context "Android build and test".
  # This aggregator owns it: it always reports (so non-mobile PRs are not
  # blocked) and fails when an upstream prerequisite failed, rather than
  # letting a skipped native job read as success.
  android-gate:
    name: Android build and test
    # Depend on the whole mobile chain so an upstream failure cannot be masked
    # as a skipped-and-therefore-successful native job.
    needs: [changes, javascript, android]
    # Runs even when `android` is skipped (non-mobile PRs) so the required
    # context is always reported, but not on cancellation (`always()` would
    # report a bogus success for a superseded run).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert mobile job results
        uses: ./.github/actions/require-job-results
        with:
          required: ${{ needs.changes.result }}
          may-skip: ${{ needs.javascript.result }} ${{ needs.android.result }}

  ios:
    name: iOS native build
    # JavaScript runs in parallel; ios-gate owns the required context and still
    # aggregates the JavaScript result (see the android job above).
    needs: changes
    if: *native-build-gate
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # `fast` builds a single arch for CI; `full` builds every target and is
      # available only through workflow_dispatch.
      NATIVE_SCOPE: ${{ inputs.native_scope || 'fast' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - *setup-node
      - *restore-npm-cache
      - *install-dependencies
      - *save-npm-cache

      # The project is developed with Xcode 26.6. Select it explicitly so runner
      # image updates cannot silently switch the build to another Xcode version.
      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select \
            --switch /Applications/Xcode_26.6.app/Contents/Developer

          xcodebuild -version
          xcode-select --print-path

      - name: Generate iOS native project when absent
        shell: bash
        run: |
          if [[ ! -d ios ]]; then
            npx expo prebuild --platform ios --no-install
          fi

      # The cached gems compile native extensions against the runner's system
      # Ruby. macOS image updates can change that Ruby version, so the key must
      # include it or a stale GEM_HOME would be restored and `pod` would break.
      - name: Read system Ruby version
        id: ruby
        shell: bash
        run: echo "version=$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods gems
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.gem
          key: cocoapods-${{ runner.os }}-ruby${{ steps.ruby.outputs.version }}-${{ env.COCOAPODS_VERSION }}

      # Cache the CocoaPods CDN/spec cache so `pod install --no-repo-update`
      # does not re-resolve and re-download pod specs on every run. Keyed on
      # the JavaScript dependency lock, which determines the pod graph. Saved
      # right after `pod install` and never from pull requests: a lockfile PR
      # misses the exact key on every run, and saving its PR-scoped copy cost
      # ~9 s at the end of the job while evicting main's caches.
      - name: Restore CocoaPods spec cache
        id: pods-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-specs-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            cocoapods-specs-${{ runner.os }}-

      - name: Configure CocoaPods
        shell: bash
        run: |
          set -euo pipefail

          # Install into the cached GEM_HOME (no sudo) and expose its binaries
          # to subsequent steps so `pod install` resolves the pinned version.
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$GEM_HOME/bin:$PATH"

          if [[ "$(pod --version 2>/dev/null || true)" != "${COCOAPODS_VERSION}" ]]; then
            gem install cocoapods \
              --version "${COCOAPODS_VERSION}" \
              --no-document
          fi

          pod --version

      - name: Configure Node for Xcode build phases
        shell: bash
        run: printf 'export NODE_BINARY=%s\n' "$(command -v node)" > ios/.xcode.env.local

      # Expo compiles ExpoModulesJSI.xcframework from its SwiftPM sources in a
      # build phase, and skips that only when a slice's recorded .build-hash
      # (sources, jsi.h, RN version, Swift toolchain, absolute paths) matches.
      # A fresh `npm ci` leaves only stub slices, so CI rebuilt it every run.
      # Restored before `pod install`, whose stub stamping keeps existing
      # slices; a stale snapshot is simply rebuilt by Expo's own hash check,
      # so a prefix fallback is safe on every event.
      - name: Restore ExpoModulesJSI xcframework
        id: jsi-cache
        uses: actions/cache/restore@v6
        with:
          path: mobile/node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework
          key: expo-modules-jsi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            expo-modules-jsi-${{ runner.os }}-${{ runner.arch }}-

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail

          # ios/ is generated by Expo and intentionally excluded from Git. The
          # JavaScript dependency graph is locked by mobile/package-lock.json;
          # generate and use CocoaPods' local lockfile during this build.
          pod install --no-repo-update

      - name: Save CocoaPods spec cache
        if: github.event_name != 'pull_request' && steps.pods-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      # Native compile caching is deliberately not enabled on iOS: with the
      # Expo-generated Pods project the ccache objects never landed in the
      # configured directory, and a restored DerivedData/Build snapshot made
      # xcodebuild slower (fresh project UUIDs invalidate the incremental
      # database). Revisit if Expo/RN make the pod graph cache-stable.
      - name: Build unsigned iOS simulator application
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild_args=(
            xcodebuild
            -workspace ios/TaskFlowMobile.xcworkspace
            -scheme TaskFlowMobile
            -configuration Debug
            -sdk iphonesimulator
            -destination 'generic/platform=iOS Simulator'
            -derivedDataPath ios/build/DerivedData
            -resultBundlePath ios/build/TaskFlowMobile.xcresult
            -showBuildTimingSummary
          )
          if [[ "${NATIVE_SCOPE}" == "fast" ]]; then
            xcodebuild_args+=('ARCHS=arm64' 'ONLY_ACTIVE_ARCH=YES')
          else
            # The Expo-generated Debug configuration sets ONLY_ACTIVE_ARCH=YES;
            # override it so a full build compiles every supported simulator
            # architecture rather than only the runner's own.
            xcodebuild_args+=('ARCHS=arm64 x86_64' 'ONLY_ACTIVE_ARCH=NO')
          fi

          # The raw output (~30k lines, mostly per-task environment dumps) is
          # more than the Actions log API returns, so the console gets
          # xcbeautify's one line per task and the raw log is uploaded below.
          raw_log="${RUNNER_TEMP}/xcodebuild.log"
          formatter=(cat)
          if command -v xcbeautify >/dev/null; then
            formatter=(xcbeautify)
          fi

          # The step result follows xcodebuild alone, not the log formatter.
          set +e
          "${xcodebuild_args[@]}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "${raw_log}" | "${formatter[@]}"
          pipe_status=("${PIPESTATUS[@]}")
          set -e

          # Per-phase totals from -showBuildTimingSummary, so runs can be
          # compared without downloading the raw log.
          timing="$(sed -n '/^Build Timing Summary/,/\*\* BUILD/p' "${raw_log}")"
          if [[ -n "${timing}" ]]; then
            printf '%s\n' "${timing}"
            printf '### iOS build timing\n\n```\n%s\n```\n' "${timing}" >> "${GITHUB_STEP_SUMMARY}"
          fi

          # xcodebuild does not echo script-phase output, but Xcode's activity
          # log keeps it: show whether the cached ExpoModulesJSI slice was
          # reused or rebuilt (and how long the rebuild took).
          find ios/build/DerivedData/Logs/Build -name '*.xcactivitylog' -exec gzip -dc {} + 2>/dev/null \
            | LC_ALL=C grep -a -o -E '\[ExpoModulesJSI\] (Built xcframework successfully in [0-9]+s|xcframework slices up to date, skipping build)' \
            | sort -u || true

          exit "${pipe_status[0]}"

      - name: Save ExpoModulesJSI xcframework
        if: github.event_name != 'pull_request' && steps.jsi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: mobile/node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework
          key: ${{ steps.jsi-cache.outputs.cache-primary-key }}

      - name: Upload iOS simulator application
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-ios-simulator
          path: mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          path: mobile/ios/build/TaskFlowMobile.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload raw xcodebuild log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  # Mirror of `android-gate` for the required "iOS simulator build" context.
  # `ios` has no matrix, but a job skipped after an upstream failure still
  # reports success to branch protection, so the gate asserts the prerequisite
  # results rather than relying on the skipped check.
  ios-gate:
    name: iOS simulator build
    needs: [changes, javascript, ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert mobile job results
        uses: ./.github/actions/require-job-results
        with:
          required: ${{ needs.changes.result }}
          may-skip: ${{ needs.javascript.result }} ${{ needs.ios.result }}
