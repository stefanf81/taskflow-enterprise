name: TaskFlow Enterprise CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Nightly regression: build, test, e2e, and Docker build+scan.
    # Security-only scans (CodeQL, Trivy FS) moved to .github/workflows/security.yml.
    - cron: "0 2 * * *"

  workflow_dispatch:
    inputs:
      run_tests:
        description: Run all tests
        type: boolean
        default: true

# NOTE: Docker image pushing has been moved to the dedicated, manually-triggered
# workflow at `.github/workflows/pushdockerimage.yml`. This CI workflow only
# builds images locally (load: true) so they can be scanned by Trivy — it never
# pushes to GHCR. Run `pushdockerimage.yml` manually when you want to publish.

permissions:
  contents: read

concurrency:
  group: taskflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

  TRIVY_VERSION: v0.73.0

defaults:
  run:
    shell: bash

jobs:
  ###########################################################
  # Detect changed components
  ###########################################################

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # dorny/paths-filter enumerates PR changed files via the REST API, which
    # requires pull-requests: read. Job-scoped so the rest of the workflow
    # stays at the minimal contents: read default.
    permissions:
      contents: read
      pull-requests: read

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      dependency_submission: ${{ steps.filter.outputs.dependency_submission }}
      renovate: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'renovate/') }}

      docker: ${{ steps.filter.outputs.docker }}
      docker_backend: ${{ steps.filter.outputs.docker_backend }}
      docker_frontend: ${{ steps.filter.outputs.docker_frontend }}

      docker_components: ${{ steps.components.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - src/**
              - api/**
              - scripts/**
              - '*.gradle'
              - gradle.properties
              - gradlew
              - gradle/**

            frontend:
              - frontend/**
              - shared/**
              - api/**
              - scripts/**

            dependency_submission:
              - '*.gradle'
              - gradle.properties
              - gradle/**

            docker:
              - Dockerfile*
              - frontend/Dockerfile
              - docker-compose.yml
              - .env.example
              - .dockerignore
              - frontend/.dockerignore
              - .trivyignore
              - frontend/nginx-main.conf
              - frontend/nginx.conf
              - frontend/docker-entrypoint.sh

            docker_backend:
              - Dockerfile*
              - docker-compose.yml
              - .dockerignore
              - .trivyignore

            docker_frontend:
              - frontend/Dockerfile
              - docker-compose.yml
              - frontend/.dockerignore
              - .trivyignore
              - frontend/nginx-main.conf
              - frontend/nginx.conf
              - frontend/docker-entrypoint.sh

      - name: Select Docker components
        id: components
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          DOCKER_BACKEND_CHANGED: ${{ steps.filter.outputs.docker_backend }}
          DOCKER_FRONTEND_CHANGED: ${{ steps.filter.outputs.docker_frontend }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}

        run: |
          components=()

          if [[ "$BACKEND_CHANGED" == "true" || \
                "$DOCKER_BACKEND_CHANGED" == "true" || \
                "$IS_MANUAL" == "true" || \
                "$IS_SCHEDULE" == "true" ]]; then
            components+=(backend)
          fi

          if [[ "$FRONTEND_CHANGED" == "true" || \
                "$DOCKER_FRONTEND_CHANGED" == "true" || \
                "$IS_MANUAL" == "true" || \
                "$IS_SCHEDULE" == "true" ]]; then
            components+=(frontend)
          fi

          matrix="$(jq -cn '$ARGS.positional' --args "${components[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  ###########################################################
  # Dockerfile Lint
  ###########################################################

  lint:
    name: Dockerfile Lint
    needs: changes

    if: |
      needs.changes.outputs.docker == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.x64
          # DL3005 (apt-get upgrade) and DL3008 (apt pinning) are intentional:
          # the runtime stage refreshes Ubuntu security packages on every build
          # instead of pinning versions that would freeze out CVE fixes.
          ignore: DL3005,DL3008,DL3029

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3018,DL3029

  ###########################################################
  # Backend
  ###########################################################

  backend:
    name: Backend (${{ matrix.os }})
    needs: changes

    if: |
      needs.changes.outputs.renovate == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.docker_backend == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'

    # Trial matrix ahead of GitHub's `ubuntu-latest` migration to 26.04
    # (announced for Oct 19 - Nov 19, 2026). ubuntu-24.04 is the required leg;
    # ubuntu-26.04 runs alongside it non-blocking so OS-package/toolchain
    # regressions surface early. Once the 26.04 leg is green, drop the matrix
    # and pin `runs-on: ubuntu-26.04`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            experimental: false
          - os: ubuntu-26.04
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # Single source of truth for "do tests run on this event?" so the build,
    # test, and report steps cannot drift apart.
    env:
      RUN_TESTS: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_tests == true) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build and Test
        if: env.RUN_TESTS == 'true'
        env:
          GRADLE_CACHE_FLAG: ${{ github.event_name == 'schedule' && '--no-build-cache' || '--build-cache' }}
        run: |
          ./gradlew \
            --parallel \
            "$GRADLE_CACHE_FLAG" \
            assemble \
            test \
            testcontainersTest \
            jacocoTestReport \
            jacocoTestCoverageVerification \
            spotbugsMain \
            --stacktrace

      - name: Build (packaging only)
        if: env.RUN_TESTS != 'true'
        run: |
          ./gradlew \
            --parallel \
            --build-cache \
            assemble \
            --stacktrace

      - name: Start backend for contract verification
        id: contract_backend
        uses: ./.github/actions/start-backend
        with:
          log-file: openapi-contract.log

      - name: Verify OpenAPI Contract
        run: |
          set -euo pipefail
          node scripts/check-openapi-contract.js --auth http://localhost:8080/v3/api-docs
          node scripts/sync-api-types.js --check api/openapi.json

      - name: Stop contract-verification backend
        if: always()
        run: kill "${{ steps.contract_backend.outputs.pid }}" 2>/dev/null || true

      - name: Upload Test Reports
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ matrix.os }}
          path: |
            build/reports
            build/test-results
          if-no-files-found: ignore
          retention-days: 14

  ###########################################################
  # Backend Package
  ###########################################################

  package:
    name: Backend Package
    needs: changes

    if: |
      needs.changes.outputs.renovate == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.docker_backend == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build JAR
        run: |
          ./gradlew \
            --parallel \
            --build-cache \
            assemble \
            --stacktrace

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: build/libs/*.jar
          compression-level: 0
          retention-days: 14

  ###########################################################
  # Dependency Submission
  ###########################################################

  dependency-submission:
    name: Dependency Submission

    needs: changes

    if: |
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.dependency_submission == 'true' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v6

  ###########################################################
  # Frontend
  ###########################################################

  frontend:
    name: Frontend

    needs: changes

    if: |
      needs.changes.outputs.renovate == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.docker_frontend == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RUN_TESTS: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_tests == true) }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shared/schemas/package-lock.json

      - name: Install Dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: frontend

      - name: Check Formatting
        run: npx prettier --check .

      - name: Lint (ESLint + strict type check)
        run: npm run lint

      - name: Cache Angular Build
        uses: actions/cache@v6
        with:
          path: frontend/.angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'shared/schemas/package-lock.json') }}
          restore-keys: |
            angular-${{ runner.os }}-

      - name: Run Unit Tests
        if: env.RUN_TESTS == 'true'

        run: |
          npx ng test \
            --watch=false \
            --coverage

      - name: Build Production Bundle
        run: npx ng build

      # Nginx serves the bundle with `script-src 'self'` (frontend/nginx.conf).
      # Angular's inlineCritical optimization defers the full stylesheet via an
      # inline `onload="this.media='all'"` handler, which that CSP blocks —
      # leaving only a `media="print"` stylesheet and an unstyled production
      # page. Keep optimization.styles.inlineCritical=false (frontend/README.md §1.3).
      - name: Verify Built index.html is CSP-Safe
        run: |
          if grep -Eq 'media="print"[^>]*onload=' dist/frontend/browser/index.html; then
            echo "::error::index.html contains Angular's inlineCritical async-CSS inline onload handler, which the Nginx CSP blocks. Set optimization.styles.inlineCritical=false."
            exit 1
          fi

      - name: Upload Frontend Bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          retention-days: 14

      - name: Upload Coverage
        if: always() && env.RUN_TESTS == 'true'

        uses: actions/upload-artifact@v7

        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  ###########################################################
  # End-to-End Tests
  ###########################################################

  e2e:
    name: End-to-End Tests (${{ matrix.os }})

    needs:
      - changes
      - package
      - frontend

    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped') &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.run_tests == true
        )
      )

    # Trial matrix for the ubuntu-latest -> 26.04 migration (Oct 19 - Nov 19,
    # 2026). The 24.04 leg is required; 26.04 is non-blocking. Docker services,
    # the production Nginx image, and Playwright's apt deps are the surfaces
    # most likely to differ on 26.04. Once green, drop the matrix and pin.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            experimental: false
          - os: ubuntu-26.04
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18.6-alpine

        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

      redis:
        image: redis:8.10.1-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD: taskflow
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shared/schemas/package-lock.json

      ##########################################################
      # Download Backend
      ##########################################################

      - name: Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-jar-dir

      ##########################################################
      # Start Backend
      ##########################################################

      - name: Start Spring Boot
        uses: ./.github/actions/start-backend
        with:
          jar-path: backend-jar-dir/*.jar
          profile: prod

      ##########################################################
      # Production frontend ingress
      ##########################################################

      - name: Install Frontend
        uses: ./.github/actions/npm-ci
        with:
          package-path: frontend

      - name: Download Frontend Bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser

      - name: Set up Buildx
        uses: ./.github/actions/prepull-buildkit

      - name: Build production frontend image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=frontend-main \
            --cache-from type=gha,scope=frontend-pr \
            --cache-from type=gha,scope=frontend-e2e \
            --cache-to type=gha,mode=max,scope=frontend-e2e \
            --load \
            --tag taskflow-e2e-frontend \
            frontend

      - name: Start production frontend ingress
        run: |
          set -euo pipefail

          docker run --detach \
            --name taskflow-e2e-frontend \
            --add-host backend:host-gateway \
            --mount type=bind,src="$PWD/frontend/nginx-upstream-server-ci.conf",dst=/etc/nginx/upstream-server.conf,readonly \
            --publish 4200:8080 \
            --read-only \
            --tmpfs /tmp:uid=10001,gid=10001 \
            --tmpfs /var/cache/nginx:uid=10001,gid=10001 \
            --tmpfs /var/run:uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            taskflow-e2e-frontend

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4200/ > /dev/null && \
               curl --fail --silent http://localhost:4200/api/v1/catalog > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs taskflow-e2e-frontend
          exit 1

      ##########################################################
      # Playwright
      ##########################################################

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('./frontend/package-lock.json').packages['node_modules/playwright-core'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Key on matrix.os, not runner.os: the browser bundles are built
          # against the image's glibc/OS packages, so a 24.04 cache must not be
          # restored onto the 26.04 trial leg.
          key: playwright-${{ matrix.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ matrix.os }}-${{ steps.playwright-version.outputs.version }}

      # Browsers are restored from the cache above; --with-deps otherwise
      # re-runs apt-get on every build. Install only on a cache miss.
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: frontend
        env:
          E2E_DOCKER: "true"
        run: npm run e2e

      ##########################################################
      # Debug Logs
      ##########################################################

      - name: Print Spring Log on Failure
        if: failure()
        run: |
          echo "========== SPRING LOG =========="
          cat spring.log || true

      - name: Print frontend ingress log on Failure
        if: failure()
        run: docker logs taskflow-e2e-frontend || true

      ##########################################################
      # Upload Reports
      ##########################################################

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            spring.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  ###########################################################
  # Docker
  ###########################################################

  docker-build:
    name: Build Docker (${{ matrix.component }})

    # codeql-action/upload-sarif needs security-events: write; scoped to this
    # job instead of the whole workflow to keep least privilege.
    permissions:
      contents: read
      security-events: write

    needs:
      - changes
      - package
      - frontend

    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.docker_components != '[]'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # fail-fast is deliberately false: backend and frontend images are
      # built and scanned independently. A HIGH/CRITICAL CVE (and resulting
      # exit-code: 1) in one image's Trivy scan should not cancel the other
      # component's build — both scan results need to surface so both teams
      # get signal in the same run.
      fail-fast: false

      matrix:
        component: ${{ fromJSON(needs.changes.outputs.docker_components) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      ##########################################################
      # GHCR uses lowercase owner. Compute image refs once here so
      # mixed/uppercase repository owners don't break docker push
      # or the Trivy image-ref resolution below.
      ##########################################################
      - name: Compute Image Refs
        id: images
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${owner}/taskflow-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/taskflow-frontend" >> "$GITHUB_OUTPUT"

      ##########################################################
      # Download Artifacts
      ##########################################################

      - name: Download Backend JAR
        if: matrix.component == 'backend'
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: build/libs

      - name: Download Frontend Bundle
        if: matrix.component == 'frontend'
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser

      ##########################################################
      # Docker
      ##########################################################

      - name: Set up Buildx
        uses: ./.github/actions/prepull-buildkit

      ##########################################################
      # Build (load only — never push from CI; use
      # pushdockerimage.yml to publish images to GHCR)
      ##########################################################

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component == 'backend' && '.' || 'frontend' }}
          file: ${{ matrix.component == 'backend' && 'Dockerfile.x64' || 'frontend/Dockerfile' }}

          push: false
          load: true

          tags: |
            ${{ matrix.component == 'backend' && steps.images.outputs.backend_image || steps.images.outputs.frontend_image }}:${{ env.IMAGE_TAG }}
            ${{ matrix.component == 'backend' && steps.images.outputs.backend_image || steps.images.outputs.frontend_image }}:latest

          cache-from: |
            type=gha,scope=${{ matrix.component }}-main
            type=gha,scope=${{ matrix.component }}-pr

          cache-to: |
            type=gha,mode=max,scope=${{ matrix.component }}-${{ github.ref == 'refs/heads/main' && 'main' || 'pr' }}

          provenance: false
          sbom: false

          # Cache-busting: force the runtime package refresh to run on every
          # CI build so the image always ships the latest OS security patches
          # (apt on the backend, apk on the frontend). Each Dockerfile consumes
          # its own arg; the unused one is ignored. Without this, a cached
          # refresh layer carries stale OS packages with known CVEs.
          build-args: |
            APK_BUST=${{ github.run_id }}-${{ github.run_attempt }}
            APT_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      ##########################################################
      # Scan
      ##########################################################

      # NOTE ON SEVERITY GATING (intentional asymmetry):
      # This is the HARD GATE — exit-code: 1 with severity HIGH,CRITICAL
      # fails the build/push. This scan targets the actual image that gets
      # deployed, unlike the source/filesystem Trivy scan in
      # `.github/workflows/security.yml`, which is report-only (exit-code: 0)
      # by design. Do not align the two exit-codes without deliberately
      # reconsidering both.
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}

          image-ref: ${{ matrix.component == 'backend' && steps.images.outputs.backend_image || steps.images.outputs.frontend_image }}:${{ env.IMAGE_TAG }}

          scan-type: image

          format: sarif
          output: trivy-results.sarif

          severity: HIGH,CRITICAL
          ignore-unfixed: true

          exit-code: 1

      ##########################################################
      # Upload SARIF
      ##########################################################

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results.sarif
          category: docker-${{ matrix.component }}
