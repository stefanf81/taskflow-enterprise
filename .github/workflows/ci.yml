name: TaskFlow Enterprise CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Nightly regression: build, test, e2e, and Docker build+scan.
    # Security-only scans (CodeQL, Trivy FS) moved to .github/workflows/security.yml.
    #
    # Compensated for GitHub's scheduler lag: this repo's scheduled workflows
    # consistently execute ~5h after their cron time (observed 4:25-5:30h), so
    # the cron fires at 22:00 UTC to land execution in the intended 03:00 UTC
    # window. Revisit if the observed lag changes.
    - cron: "0 22 * * *"

  workflow_dispatch:
    inputs:
      run_tests:
        description: Run all tests
        type: boolean
        default: true

# NOTE: Docker image pushing has been moved to the dedicated, manually-triggered
# workflow at `.github/workflows/pushdockerimage.yml`. This CI workflow only
# builds images locally (load: true) so they can be scanned by Trivy — it never
# pushes to GHCR. Run `pushdockerimage.yml` manually when you want to publish.

permissions:
  contents: read

concurrency:
  group: taskflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

  TRIVY_VERSION: v0.75.0

defaults:
  run:
    shell: bash

jobs:
  ###########################################################
  # Detect changed components
  ###########################################################

  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    # dorny/paths-filter enumerates PR changed files via the REST API, which
    # requires pull-requests: read. Job-scoped so the rest of the workflow
    # stays at the minimal contents: read default.
    permissions:
      contents: read
      pull-requests: read

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      dependency_submission: ${{ steps.filter.outputs.dependency_submission }}
      workflows: ${{ steps.filter.outputs.workflows }}
      renovate: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'renovate/') }}

      docker: ${{ steps.filter.outputs.docker }}
      docker_backend: ${{ steps.filter.outputs.docker_backend }}
      docker_frontend: ${{ steps.filter.outputs.docker_frontend }}

      build_backend_image: ${{ steps.components.outputs.backend }}
      build_frontend_image: ${{ steps.components.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - src/**
              - api/**
              - scripts/**
              - '*.gradle'
              - gradle.properties
              - gradlew
              - gradle/**

            frontend:
              - frontend/**
              - shared/**
              - api/**
              - scripts/**

            dependency_submission:
              - '*.gradle'
              - gradle.properties
              - gradle/**

            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/actionlint.yaml'
              - 'scripts/prepare-nuclei-sarif.py'
              - 'scripts/test_nuclei_sarif.py'

            docker:
              - Dockerfile*
              - frontend/Dockerfile
              - docker-compose.yml
              - .env.example
              - .dockerignore
              - frontend/.dockerignore
              - .trivyignore
              - frontend/nginx-main.conf
              - frontend/nginx.conf
              - frontend/docker-entrypoint.sh

            docker_backend:
              - Dockerfile*
              - docker-compose.yml
              - .dockerignore
              - .trivyignore

            docker_frontend:
              - frontend/Dockerfile
              - docker-compose.yml
              - frontend/.dockerignore
              - .trivyignore
              - frontend/nginx-main.conf
              - frontend/nginx.conf
              - frontend/docker-entrypoint.sh

      - name: Select Docker components
        id: components
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          DOCKER_BACKEND_CHANGED: ${{ steps.filter.outputs.docker_backend }}
          DOCKER_FRONTEND_CHANGED: ${{ steps.filter.outputs.docker_frontend }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}

        run: |
          backend=false
          frontend=false

          if [[ "$BACKEND_CHANGED" == "true" || \
                "$DOCKER_BACKEND_CHANGED" == "true" || \
                "$IS_MANUAL" == "true" || \
                "$IS_SCHEDULE" == "true" ]]; then
            backend=true
          fi

          if [[ "$FRONTEND_CHANGED" == "true" || \
                "$DOCKER_FRONTEND_CHANGED" == "true" || \
                "$IS_MANUAL" == "true" || \
                "$IS_SCHEDULE" == "true" ]]; then
            frontend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  ###########################################################
  # Dockerfile Lint
  ###########################################################

  lint:
    name: Dockerfile Lint
    needs: changes

    if: |
      needs.changes.outputs.docker == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.x64
          # DL3005 (apt-get upgrade) and DL3008 (apt pinning) are intentional:
          # the runtime stage refreshes Ubuntu security packages on every build
          # instead of pinning versions that would freeze out CVE fixes.
          ignore: DL3005,DL3008,DL3029

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3018,DL3029

  ###########################################################
  # Workflow Lint
  ###########################################################

  workflow-lint:
    name: Workflow Lint
    needs: changes

    # Without this, a PR that only edits `.github/workflows/**` matches no other
    # path filter and runs no CI at all — a broken workflow would merge
    # unvalidated. actionlint is pinned to a specific image tag; the
    # ubuntu-26.04 runner label is declared in .github/actionlint.yaml.
    if: needs.changes.outputs.workflows == 'true'

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test Nuclei SARIF preparation
        run: python3 -m unittest discover -s scripts -p 'test_nuclei_sarif.py' -v

      - name: Lint workflows
        run: |
          set -euo pipefail
          # `-shellcheck=` disables actionlint's optional shellcheck pass on
          # inline `run:` scripts; this job validates workflow structure
          # (YAML, expressions, contexts, runner labels, action I/O). Inline
          # shell linting is tracked separately so pre-existing SC2xxx style
          # findings do not block unrelated workflow edits.
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.12 \
            -color \
            -shellcheck=

  ###########################################################
  # Backend
  ###########################################################

  backend:
    name: Backend build
    needs: changes

    # A frontend-only change pulls the backend in only on pull requests, where
    # E2E exercises the API and the `backend-gate` must report the required
    # `Backend` context. On `main` pushes E2E is skipped and the backend image
    # only builds when backend/Docker files change, so a frontend-only push
    # need not run the ~3-minute Java suite.
    if: |
      needs.changes.outputs.renovate == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.docker_backend == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        needs.changes.outputs.frontend == 'true' &&
        github.event_name == 'pull_request'
      )

    # Pinned to ubuntu-26.04 ahead of GitHub's `ubuntu-latest` migration
    # (Oct 19 - Nov 19, 2026). The former 24.04/26.04 trial matrix is collapsed
    # to a single blocking image.
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    # Single source of truth for "do tests run on this event?" so the build,
    # test, and report steps cannot drift apart.
    env:
      RUN_TESTS: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_tests == true) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # setup-gradle only stores configuration-cache data when given an
      # encryption key (task-graph calculation is ~10s per run). As of
      # BENCHMARKS.md §53 no configuration-cache entry has been observed being
      # restored yet, so treat any saving as unverified until a `main` run
      # logs "Reusing configuration cache".
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # `testcontainersTest` and `spotbugsMain` run in `backend-integration`:
      # on one 4-vCPU runner they competed with the 3 unit-test forks for CPU,
      # and the unit suite is this job's long pole.
      - name: Build and Test
        if: env.RUN_TESTS == 'true'
        env:
          # `--no-build-cache` whenever executing tests is the explicit point of
          # the run — the nightly schedule, or a manual dispatch with
          # run_tests=true. Otherwise setup-gradle's restored build cache serves
          # `test` FROM-CACHE and no test actually runs (verified: manual
          # dispatch completed in ~18s with every test task FROM-CACHE). PR/push
          # runs keep the cache for speed; the nightly remains the authoritative
          # full execution.
          GRADLE_CACHE_FLAG: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_tests == true)) && '--no-build-cache' || '--build-cache' }}
        run: |
          ./gradlew \
            --parallel \
            "$GRADLE_CACHE_FLAG" \
            assemble \
            test \
            jacocoTestReport \
            jacocoTestCoverageVerification \
            --stacktrace

      - name: Build (packaging only)
        if: env.RUN_TESTS != 'true'
        run: |
          ./gradlew \
            --parallel \
            --build-cache \
            assemble \
            --stacktrace

      - name: Upload Test Reports
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            build/reports
            build/test-results
          if-no-files-found: ignore
          retention-days: 14

  # PostgreSQL parity suite and static analysis, split from `backend` so they
  # run on their own runner in parallel with the unit suite. Gated like
  # `backend`, and skipped whenever `backend` would not run tests.
  backend-integration:
    name: Backend integration
    needs: changes

    if: |
      (
        needs.changes.outputs.renovate == 'true' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.docker_backend == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (
          needs.changes.outputs.frontend == 'true' &&
          github.event_name == 'pull_request'
        )
      ) &&
      !(github.event_name == 'workflow_dispatch' && inputs.run_tests != true)

    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # `backend` owns Gradle cache writes in this workflow.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Testcontainers and SpotBugs
        env:
          # Same policy as `backend`: full execution on the nightly schedule
          # and on test dispatches, build cache otherwise.
          GRADLE_CACHE_FLAG: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--no-build-cache' || '--build-cache' }}
        run: |
          ./gradlew \
            --parallel \
            "$GRADLE_CACHE_FLAG" \
            testcontainersTest \
            spotbugsMain \
            --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-results
          path: |
            build/reports
            build/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Owns the required "Backend" context. A skipped job reports success to
  # branch protection, so this gate fails when change detection or the build
  # failed instead of letting a skipped `backend` job read as a pass. `package`
  # and `contract` are asserted too: the contract job runs the OpenAPI
  # contract verification against the packaged JAR.
  backend-gate:
    name: Backend
    needs: [changes, backend, backend-integration, package, contract]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert job results
        uses: ./.github/actions/require-job-results
        with:
          required: ${{ needs.changes.result }}
          may-skip: ${{ needs.backend.result }} ${{ needs.backend-integration.result }} ${{ needs.package.result }} ${{ needs.contract.result }}

  ###########################################################
  # Backend Package
  ###########################################################

  # Publishes the production JAR early so `e2e`/`docker-backend` can start as
  # soon as it exists, rather than waiting ~3 minutes for the full test suite in
  # the `backend` job. The second `assemble` is served from the Gradle build cache
  # (~35-65s) and buys ~100s of wall-clock on the PR/dispatch critical path
  # (measured: consumers start at ~65s vs ~185s, run wall 308s -> ~210s).
  package:
    name: Backend Package
    needs: changes

    # Mirrors the `backend` job's gating: the JAR is only consumed by E2E
    # (PR/schedule/dispatch) and the backend Docker image (backend/Docker
    # changes), so a frontend-only push does not need to build it.
    if: |
      needs.changes.outputs.renovate == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.docker_backend == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        needs.changes.outputs.frontend == 'true' &&
        github.event_name == 'pull_request'
      )

    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Within this workflow, `backend` owns Gradle cache writes. The Android
      # and dependency-audit workflows retain their own writable caching.
      # Read-only packaging avoids competing saves of shared cache entries.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build JAR
        run: |
          ./gradlew \
            --parallel \
            --build-cache \
            assemble \
            --stacktrace

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: build/libs/*.jar
          compression-level: 0
          retention-days: 14

  ###########################################################
  # OpenAPI Contract
  ###########################################################

  # Boots the packaged JAR and diffs its live /v3/api-docs against the reviewed
  # baseline. A job of its own (needs only `package`) so it runs alongside the
  # backend image build and E2E instead of in front of them: inside `package`
  # it delayed both by ~25s (run 37222275489), and on `main` pushes the
  # package -> docker-backend chain is the critical path. The scripts use only
  # Node built-ins, so no npm install is needed.
  contract:
    name: OpenAPI Contract
    needs: [changes, package]

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-jar-dir

      - name: Start backend for contract verification
        id: contract_backend
        uses: ./.github/actions/start-backend
        with:
          jar-path: backend-jar-dir/*.jar
          log-file: openapi-contract.log

      - name: Verify OpenAPI Contract
        run: |
          set -euo pipefail
          node scripts/check-openapi-contract.js --auth http://localhost:8080/v3/api-docs
          node scripts/sync-api-types.js --check api/openapi.json

      - name: Stop contract-verification backend
        if: always()
        run: kill "${{ steps.contract_backend.outputs.pid }}" 2>/dev/null || true

  ###########################################################
  # Dependency Submission
  ###########################################################

  dependency-submission:
    name: Dependency Submission

    needs: changes

    if: |
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.dependency_submission == 'true' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'
      )

    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # This action already manages Gradle caching; configure it directly
      # rather than adding setup-gradle. `backend` owns writes in this workflow.
      - name: Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v6
        with:
          cache-read-only: true

  ###########################################################
  # Frontend
  ###########################################################

  frontend:
    name: Frontend build

    needs: changes

    # A backend change pulls the frontend in only on pull requests, where E2E
    # consumes the production bundle and the `frontend-gate` reports the
    # required `Frontend` context. On `main` pushes E2E is skipped and the
    # frontend image only builds when frontend files changed, so building the
    # bundle for a backend-only push is wasted work (~48s per merge).
    if: |
      needs.changes.outputs.renovate == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.docker_frontend == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        needs.changes.outputs.backend == 'true' &&
        github.event_name == 'pull_request'
      )

    runs-on: ubuntu-26.04
    timeout-minutes: 20

    env:
      RUN_TESTS: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_tests == true) }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shared/schemas/package-lock.json

      - name: Install Dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: frontend

      - name: Check Formatting
        run: npx prettier --check .

      - name: Lint (ESLint + strict type check)
        run: npm run lint

      - name: Cache Angular Build
        uses: actions/cache@v6
        with:
          path: frontend/.angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'shared/schemas/package-lock.json') }}
          restore-keys: |
            angular-${{ runner.os }}-

      - name: Run Unit Tests
        if: env.RUN_TESTS == 'true'

        run: |
          npx ng test \
            --watch=false \
            --coverage

      - name: Build Production Bundle
        run: npx ng build

      # Nginx serves the bundle with `script-src 'self'` (frontend/nginx.conf).
      # Angular's inlineCritical optimization defers the full stylesheet via an
      # inline `onload="this.media='all'"` handler, which that CSP blocks —
      # leaving only a `media="print"` stylesheet and an unstyled production
      # page. Keep optimization.styles.inlineCritical=false (frontend/README.md §1.3).
      - name: Verify Built index.html is CSP-Safe
        run: |
          if grep -Eq 'media="print"[^>]*onload=' dist/frontend/browser/index.html; then
            echo "::error::index.html contains Angular's inlineCritical async-CSS inline onload handler, which the Nginx CSP blocks. Set optimization.styles.inlineCritical=false."
            exit 1
          fi

      - name: Upload Frontend Bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          retention-days: 14

      - name: Upload Coverage
        if: always() && env.RUN_TESTS == 'true'

        uses: actions/upload-artifact@v7

        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  # Owns the required "Frontend" context; see `backend-gate`.
  frontend-gate:
    name: Frontend
    needs: [changes, frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert job results
        uses: ./.github/actions/require-job-results
        with:
          required: ${{ needs.changes.result }}
          may-skip: ${{ needs.frontend.result }}

  ###########################################################
  # End-to-End Tests
  ###########################################################

  e2e:
    name: End-to-End Playwright

    needs:
      - changes
      - package
      - frontend

    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped') &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.run_tests == true
        )
      )

    # Pinned to ubuntu-26.04 ahead of GitHub's `ubuntu-latest` migration
    # (Oct 19 - Nov 19, 2026). The former 24.04/26.04 trial matrix is collapsed
    # to a single blocking image.
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18.6-alpine

        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

      redis:
        image: redis:8.10.2-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD: taskflow
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shared/schemas/package-lock.json

      ##########################################################
      # Download Backend
      ##########################################################

      - name: Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-jar-dir

      ##########################################################
      # Start Backend
      ##########################################################

      # Launch only: JVM startup (~11-18s) overlaps the frontend install, image
      # build, and Playwright browser restore below; `Wait for Spring Boot`
      # gates the ingress on it.
      - name: Start Spring Boot
        id: backend
        uses: ./.github/actions/start-backend
        with:
          jar-path: backend-jar-dir/*.jar
          profile: prod
          wait: "false"

      ##########################################################
      # Frontend image
      ##########################################################

      - name: Install Frontend
        uses: ./.github/actions/npm-ci
        with:
          package-path: frontend

      - name: Download Frontend Bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser

      - name: Set up Buildx
        uses: ./.github/actions/prepull-buildkit

      - name: Build production frontend image
        run: |
          # ignore-error: a transient GHA cache-export blip (the historical
          # "error writing layer blob: not_found") must not fail the build.
          docker buildx build \
            --cache-from type=gha,scope=frontend-main \
            --cache-from type=gha,scope=frontend-pr \
            --cache-from type=gha,scope=frontend-e2e \
            --cache-to type=gha,mode=max,scope=frontend-e2e,ignore-error=true \
            --load \
            --tag taskflow-e2e-frontend \
            frontend

      ##########################################################
      # Playwright
      ##########################################################

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('./frontend/package-lock.json').packages['node_modules/playwright-core'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Key on the pinned image, not runner.os: the browser bundles are
          # built against the image's glibc/OS packages, so caches must not be
          # shared across Ubuntu releases.
          key: playwright-ubuntu-26.04-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-ubuntu-26.04-${{ steps.playwright-version.outputs.version }}

      # Browsers are restored from the cache above; --with-deps otherwise
      # re-runs apt-get on every build. Install only on a cache miss.
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium

      ##########################################################
      # Production frontend ingress
      ##########################################################

      - name: Wait for Spring Boot
        uses: ./.github/actions/wait-backend
        with:
          pid: ${{ steps.backend.outputs.pid }}

      - name: Start production frontend ingress
        run: |
          set -euo pipefail

          docker run --detach \
            --name taskflow-e2e-frontend \
            --add-host backend:host-gateway \
            --mount type=bind,src="$PWD/frontend/nginx-upstream-server-ci.conf",dst=/etc/nginx/upstream-server.conf,readonly \
            --publish 4200:8080 \
            --read-only \
            --tmpfs /tmp:uid=10001,gid=10001 \
            --tmpfs /var/cache/nginx:uid=10001,gid=10001 \
            --tmpfs /var/run:uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            taskflow-e2e-frontend

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4200/ > /dev/null && \
               curl --fail --silent http://localhost:4200/api/v1/catalog > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs taskflow-e2e-frontend
          exit 1

      ##########################################################
      # Run Playwright
      ##########################################################

      - name: Run Playwright Tests
        working-directory: frontend
        env:
          E2E_DOCKER: "true"
        run: npm run e2e

      ##########################################################
      # Debug Logs
      ##########################################################

      - name: Print Spring Log on Failure
        if: failure()
        run: |
          echo "========== SPRING LOG =========="
          cat spring.log || true

      - name: Print frontend ingress log on Failure
        if: failure()
        run: docker logs taskflow-e2e-frontend || true

      ##########################################################
      # Upload Reports
      ##########################################################

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            spring.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Owns the required "End-to-End Tests" context. `e2e` is skipped whenever any
  # of its needs failed, which branch protection would otherwise read as a pass,
  # so assert `package`/`frontend`/`e2e` did not fail as well as `changes`.
  e2e-gate:
    name: End-to-End Tests
    needs: [changes, package, frontend, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert job results
        uses: ./.github/actions/require-job-results
        with:
          required: ${{ needs.changes.result }}
          may-skip: ${{ needs.package.result }} ${{ needs.frontend.result }} ${{ needs.e2e.result }}

  ###########################################################
  # Docker
  #
  # One job per image (formerly a matrix) so each starts as soon as its own
  # input exists: the backend image needs only the JAR, the frontend image only
  # the bundle. Job names keep the former matrix check contexts. The jobs are
  # independent, so a HIGH/CRITICAL CVE (exit-code: 1) in one image's Trivy
  # scan never cancels the other — both scan results surface in the same run.
  #
  # Both build locally (load only) — never push from CI; use
  # pushdockerimage.yml to publish images to GHCR.
  ###########################################################

  docker-backend:
    name: Build Docker (backend)

    # codeql-action/upload-sarif needs security-events: write; scoped to this
    # job instead of the whole workflow to keep least privilege.
    permissions:
      contents: read
      security-events: write

    needs:
      - changes
      - package

    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.build_backend_image == 'true'

    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      ##########################################################
      # GHCR uses lowercase owner. Compute the image ref once here
      # so mixed/uppercase repository owners don't break the
      # Trivy image-ref resolution below.
      ##########################################################
      - name: Compute Image Refs
        id: images
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/taskflow-backend" >> "$GITHUB_OUTPUT"
          # Trivy DB cache keys. `trivy_db_date` mirrors trivy-action's own
          # vulnerability-DB key (`cache-trivy-<date>`); the Java index DB is
          # refreshed on a 3-day window (trivy-java-db `updateInterval`), so
          # bucket its key the same way.
          echo "trivy_db_date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "trivy_java_db_bucket=$(( $(date -u +%s) / 259200 ))" >> "$GITHUB_OUTPUT"

      - name: Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: build/libs

      ##########################################################
      # Build with the runner's default `docker` builder: no Buildx
      # container, no GHA layer cache, and the image lands directly
      # in the daemon for Trivy (no OCI tarball round-trip).
      #
      # A GHA layer cache does not pay off for this image. Every
      # commit produces a new JAR, which invalidates the extractor
      # and CDS-training layers, and APT_BUST invalidates the apt
      # layer. Exporting the cache cost ~40s per build (run
      # 36242878644) for almost no hits, plus ~7s of BuildKit
      # pre-pull/setup and ~5-9s of tarball load. pushdockerimage.yml
      # keeps its own `backend-main` cache.
      ##########################################################

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.x64

          push: false
          load: true

          tags: |
            ${{ steps.images.outputs.image }}:${{ env.IMAGE_TAG }}
            ${{ steps.images.outputs.image }}:latest

          provenance: false
          sbom: false

          # Cache-busting: force the runtime apt refresh to run on every CI
          # build so the image always ships the latest OS security patches.
          # Without this, a cached refresh layer carries stale OS packages with
          # known CVEs.
          build-args: |
            APT_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      ##########################################################
      # Trivy DB caches (restored here; the action's own cache is disabled)
      #
      # trivy-action caches the whole `.cache/trivy` tree under
      # `cache-trivy-<date>`. That archive can carry a stale `java-db/`, and
      # because the action restores it *after* any restore we do, it would
      # overwrite a fresh Java DB and force a ~930 MiB re-download. So the
      # action runs with `cache: false` and we restore in a controlled order:
      #
      #   1. the vulnerability DB from trivy-action's key (shared with the FS
      #      scans in security.yml), then
      #   2. the Java index DB on top of it.
      #
      # The Java DB carries its own metadata (`NextUpdate`, 3 days), so Trivy
      # skips the download while it is fresh. The vulnerability DB is not
      # written back from this job — the FS scans own that cache key.
      ##########################################################

      - name: Restore Trivy vulnerability DB cache
        id: trivy-vuln-db-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.images.outputs.trivy_db_date }}
          restore-keys: |
            cache-trivy-

      - name: Restore Trivy Java DB cache
        id: trivy-java-db-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy/java-db
          key: trivy-java-db-${{ env.TRIVY_VERSION }}-${{ steps.images.outputs.trivy_java_db_bucket }}
          restore-keys: |
            trivy-java-db-${{ env.TRIVY_VERSION }}-

      # NOTE ON SEVERITY GATING (intentional asymmetry):
      # This is the HARD GATE — exit-code: 1 with severity HIGH,CRITICAL
      # fails the build. This scan targets the actual image that gets
      # deployed, unlike the source/filesystem Trivy scan in
      # `.github/workflows/security.yml`, which is report-only (exit-code: 0)
      # by design. Do not align the two exit-codes without deliberately
      # reconsidering both.
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}

          image-ref: ${{ steps.images.outputs.image }}:${{ env.IMAGE_TAG }}

          scan-type: image

          # DB caches are restored above; the action's own cache would clobber
          # the fresh Java DB — see the cache section note.
          cache: false

          format: sarif
          output: trivy-results.sarif

          severity: HIGH,CRITICAL
          ignore-unfixed: true

          exit-code: 1

      - name: Save Trivy Java DB cache
        # Best effort: a concurrent job may have seeded the same bucket.
        continue-on-error: true
        if: always() && steps.trivy-java-db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy/java-db
          key: trivy-java-db-${{ env.TRIVY_VERSION }}-${{ steps.images.outputs.trivy_java_db_bucket }}

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results.sarif
          category: docker-backend

  docker-frontend:
    name: Build Docker (frontend)

    # codeql-action/upload-sarif needs security-events: write; scoped to this
    # job instead of the whole workflow to keep least privilege.
    permissions:
      contents: read
      security-events: write

    needs:
      - changes
      - frontend

    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.build_frontend_image == 'true'

    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR uses lowercase owner; see `docker-backend`.
      - name: Compute Image Refs
        id: images
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/taskflow-frontend" >> "$GITHUB_OUTPUT"
          echo "trivy_db_date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Download Frontend Bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser

      # Unlike the backend image, the frontend image keeps Buildx and the GHA
      # layer cache: its brotli/gzip compression stage only depends on the
      # bundle and is expensive to rebuild.
      - name: Set up Buildx
        uses: ./.github/actions/prepull-buildkit

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile

          push: false
          load: true

          tags: |
            ${{ steps.images.outputs.image }}:${{ env.IMAGE_TAG }}
            ${{ steps.images.outputs.image }}:latest

          cache-from: |
            type=gha,scope=frontend-main
            type=gha,scope=frontend-pr

          # ignore-error: GHA cache-export blips (e.g. "error writing layer
          # blob: not_found", observed in run 36245702011) must not fail the
          # build; the image itself built fine.
          cache-to: |
            type=gha,mode=max,scope=frontend-${{ github.ref == 'refs/heads/main' && 'main' || 'pr' }},ignore-error=true

          provenance: false
          sbom: false

          # Cache-busting: force the runtime apk refresh to run on every CI
          # build so the image always ships the latest OS security patches.
          build-args: |
            APK_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      # Vulnerability DB only (no Java DB for the nginx image); see the cache
      # section note in `docker-backend`.
      - name: Restore Trivy vulnerability DB cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.images.outputs.trivy_db_date }}
          restore-keys: |
            cache-trivy-

      # HARD GATE — see the severity-gating note in `docker-backend`.
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}

          image-ref: ${{ steps.images.outputs.image }}:${{ env.IMAGE_TAG }}

          scan-type: image

          cache: false

          format: sarif
          output: trivy-results.sarif

          severity: HIGH,CRITICAL
          ignore-unfixed: true

          exit-code: 1

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results.sarif
          category: docker-frontend
