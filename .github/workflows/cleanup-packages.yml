name: Cleanup Old Packages

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: Delete the reported package versions (defaults to dry run)
        required: false
        type: boolean
        default: false

env:
  # Container packages published by pushdockerimage.yml. ci.yml only builds and
  # scans images locally (load: true) and never pushes, so it creates no
  # package versions.
  PACKAGE_NAMES: "taskflow-backend taskflow-frontend"
  PACKAGE_TYPE: "container" # Can be container, npm, maven, rubygems, docker, nuget
  RETENTION_DAYS: "3"
  # Upper bound on deletions per run so a bad filter cannot wipe a package.
  MAX_DELETE: "50"

# Serialize manual runs so two overlapping deletions cannot race on the same
# package versions.
concurrency:
  group: cleanup-packages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune stale package versions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      packages: write

    steps:
      # No checkout: this workflow only calls the GitHub API. Avoiding a
      # checkout also avoids persisting credentials on a package-write token.
      - name: Delete old packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        run: |
          set -euo pipefail

          echo "Determining account type for $OWNER..."
          ACCOUNT_TYPE=$(gh api "/users/$OWNER" -q '.type')

          if [ "$ACCOUNT_TYPE" = "Organization" ]; then
            BASE_URL="/orgs/$OWNER"
          else
            BASE_URL="/users/$OWNER"
          fi

          cutoff_date=$(date -d "${RETENTION_DAYS} days ago" -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Cutoff date for deletion: $cutoff_date"

          for PACKAGE_NAME in $PACKAGE_NAMES; do
            echo ""
            echo "========================================================"
            echo "Fetching package versions for $OWNER/$PACKAGE_NAME..."
            echo "========================================================"

            # --paginate emits each page as its own JSON array; jq -s 'add'
            # flattens them. The `if !` guard maps "package not found" (404)
            # and any API failure to an empty list so the run continues.
            if ! versions_json="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --paginate \
                "$BASE_URL/packages/$PACKAGE_TYPE/$PACKAGE_NAME/versions" \
                2>/dev/null | jq -s 'add // []'
            )"; then
              versions_json="[]"
            fi

            if [ "$versions_json" = "[]" ] || [ -z "$versions_json" ]; then
              echo "Package $PACKAGE_NAME not found or has no versions, skipping."
              continue
            fi

            # Deletion criteria — deliberately conservative:
            #
            #  1. The version MUST carry at least one tag. Untagged versions are
            #     the child platform / SBOM / provenance manifests of an OCI
            #     index (tags == []). Deleting a child while its parent index is
            #     retained leaves the retained tag pointing at a broken graph,
            #     so untagged manifests are never candidates here. Deleting the
            #     tagged parent index is safe; its children simply become
            #     unreferenced.
            #  2. created_at is older than the cutoff.
            #  3. No tag is `latest` or a semantic version (`v1.2.3`, `1.2.3`).
            #     These are the release tags we must retain.
            version_ids_to_delete=$(jq -r --arg cutoff "$cutoff_date" '
              .[] |
              select(((.metadata.container.tags // []) | length) > 0) |
              select(.created_at < $cutoff) |
              select(
                (.metadata.container.tags // []) |
                (index("latest") | not) and
                (map(test("^v?[0-9]+(\\.[0-9]+)*$")) | any | not)
              ) |
              .id
            ' <<<"$versions_json")

            if [ -z "$version_ids_to_delete" ]; then
              echo "No versions of $PACKAGE_NAME matched the deletion criteria."
              continue
            fi

            total_candidates=$(printf '%s\n' "$version_ids_to_delete" | wc -l | tr -d ' ')
            version_ids_to_delete=$(head -n "$MAX_DELETE" <<<"$version_ids_to_delete")
            selected_count=$(printf '%s\n' "$version_ids_to_delete" | wc -l | tr -d ' ')

            echo "Found $total_candidates deletable $PACKAGE_NAME version(s); acting on $selected_count (MAX_DELETE=$MAX_DELETE)."

            if [ "$CONFIRM_DELETE" != "true" ]; then
              echo "Dry run only. Re-run with confirm_delete=true to delete these versions:"
              echo "$version_ids_to_delete"
              continue
            fi

            failures=0
            while IFS= read -r version_id; do
              [ -n "$version_id" ] || continue

              echo "Deleting $PACKAGE_NAME version ID: $version_id..."
              if gh api \
                --silent \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$BASE_URL/packages/$PACKAGE_TYPE/$PACKAGE_NAME/versions/$version_id"; then
                echo "Successfully deleted $PACKAGE_NAME version ID: $version_id"
              else
                echo "::warning::Failed to delete $PACKAGE_NAME version ID: $version_id"
                failures=$((failures + 1))
              fi
            done <<<"$version_ids_to_delete"

            if (( failures > 0 )); then
              echo "::error::$failures deletion(s) failed for $PACKAGE_NAME."
              exit 1
            fi
          done

          echo ""
          echo "Package cleanup complete."
