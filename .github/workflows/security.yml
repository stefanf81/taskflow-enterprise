name: Nightly Security Scans

on:
  schedule:
    # Fires 22:08 UTC to land execution ~03:08 UTC (GitHub scheduler lag ~5h).
    - cron: '8 22 * * *'

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Prevent a manual workflow_dispatch run from colliding with the nightly
# schedule (and vice-versa). cancel-in-progress: false keeps both runs
# serialized rather than racing for the same runner/scanner resources,
# since SARIF uploads to the same Code Scanning category can otherwise
# interleave and clobber each other.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  TRIVY_VERSION: v0.75.0

defaults:
  run:
    shell: bash

jobs:
  ###########################################################
  # CodeQL
  ###########################################################

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    # `security-events: write` is the only permission CodeQL advanced setup
    # requires (contents: read applies to private repositories); the action
    # uses the runner runtime token for artifact/cache uploads, so
    # `actions: write` is not needed here. The prune job below scopes
    # `actions: write` for cache deletion instead.
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - language: java-kotlin
            build-mode: manual

          - language: javascript-typescript
            build-mode: none

          # Scans scripts/*.py (the SARIF translators used by dast.yml and
          # nightly-external-server-scan.yml) and the GitHub Actions workflow
          # YAML itself (script-injection / untrusted-input sinks). All matrix
          # legs run in parallel, so this adds no wall-clock time to the run.
          - language: python
            build-mode: none

          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Read-only: CI's `backend` job owns the Gradle cache writes. CodeQL's
      # autobuild only needs the restored dependency state.
      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

          # Test code does not ship; extracting it only adds scan time and
          # non-shipping findings. Patterns are JS/TS-specific, so the
          # java-kotlin/python/actions legs are unaffected. Secrets in test
          # fixtures remain covered by the gitleaks workflow.
          config: |
            paths-ignore:
              - '**/__tests__/**'
              - '**/*.spec.ts'
              - '**/*.test.ts'
              - '**/*.test.tsx'

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      # Manual build for java-kotlin: the same compile tasks autobuild runs
      # (`testClasses`), but in a single Gradle invocation. Autobuild spends a
      # full extra `--no-daemon` JVM + configuration phase (~13 s) on a
      # separate `clean` that is a no-op on a fresh runner. Same javac
      # invocations -> same CodeQL traps -> same analysis results.
      - name: Build (manual)
        if: matrix.build-mode == 'manual'
        run: ./gradlew --no-daemon testClasses

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # The results (SARIF) are uploaded either way; this only skips
          # bundling/uploading the CodeQL database as a debug artifact.
          upload-database: false

  ###########################################################
  # Trivy Filesystem Scan
  ###########################################################

  trivy:
    name: Trivy FS

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      #####################################################
      # Filesystem Scans
      #
      # All components are scanned sequentially in this one job (no matrix).
      # The first scan seeds trivy-action's binary
      # (`trivy-binary-<version>-<os>-<arch>`) and vulnerability-DB
      # (`cache-trivy-<date>`) caches; the remaining scans hit them and skip
      # their save attempts. The former 4-leg matrix raced to save those same
      # keys every night, so three legs logged "Cache save failed". One job
      # also means one checkout and one Trivy/DB download. Wall clock is
      # unchanged: the nightly run is bounded by the CodeQL java-kotlin leg.
      #
      # Each scan uploads under its own category and output file — GitHub
      # Code Scanning rejects multiple SARIF uploads from the same tool with
      # the same category in one workflow run. Distinct output files keep a
      # failed scan from uploading a stale SARIF under the next category.
      #
      # The uploads skip `wait-for-processing`: the scans are report-only, so
      # waiting for Code Scanning to process each SARIF (7-8 s per upload vs
      # ~2 s without, ~25 s per run) gated nothing.
      #
      # NOTE ON SEVERITY GATING (intentional asymmetry):
      # This filesystem/source scan is REPORT-ONLY (exit-code: 0) — it never
      # fails the build. It's meant to surface vulnerable dependencies early
      # (via the SARIF upload -> Code Scanning tab) without blocking PRs on
      # every transitive CVE in source manifests, many of which never ship.
      #
      # The Docker image scan in the CI `docker-build` job is the hard
      # gate (exit-code: 1, severity: HIGH,CRITICAL) — it blocks the build
      # because that's the artifact that actually gets deployed.
      #
      # If you "fix" one of these to match the other, you will either start
      # blocking every PR on unshipped source CVEs, or stop blocking on
      # vulnerable images entirely. Keep them different on purpose.
      #
      # Cache ownership: this job owns `cache-trivy-<date>` — image scans
      # restore it with `cache: false` so they cannot write a stale `java-db/`
      # back into it. The Java index DB is cached separately
      # (`trivy-java-db-*`, see ci.yml). `trivy-cache-retention` below keeps
      # the newest default-branch entry per cache family and version.
      #####################################################

      - name: Trivy FS (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: vuln
          scan-ref: .
          # `.cache`: trivy-action keeps its DB under $GITHUB_WORKSPACE/.cache/trivy.
          skip-dirs: frontend,mobile,shared,.git,.gradle,build,.cache
          # The root package-lock.json (workspace tooling: knip) is scanned
          # as its own component below so findings are not misattributed to
          # the Backend component.
          skip-files: package-lock.json
          trivyignores: .trivyignore
          ignore-unfixed: true
          format: sarif
          output: trivy-results-backend.sarif

          # Non-blocking scan — see note above. Do not change without
          # also reconsidering the image scan's exit-code.
          exit-code: 0

      - name: Upload Backend SARIF
        if: always() && hashFiles('trivy-results-backend.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results-backend.sarif
          category: trivy-fs-Backend
          wait-for-processing: "false"

      - name: Trivy FS (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: vuln
          scan-ref: frontend
          skip-dirs: node_modules,dist
          trivyignores: .trivyignore
          ignore-unfixed: true
          format: sarif
          output: trivy-results-frontend.sarif
          exit-code: 0

      - name: Upload Frontend SARIF
        if: always() && hashFiles('trivy-results-frontend.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results-frontend.sarif
          category: trivy-fs-Frontend
          wait-for-processing: "false"

      - name: Trivy FS (Mobile)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: vuln
          scan-ref: mobile
          skip-dirs: node_modules,android,ios
          trivyignores: .trivyignore
          ignore-unfixed: true
          format: sarif
          output: trivy-results-mobile.sarif
          exit-code: 0

      - name: Upload Mobile SARIF
        if: always() && hashFiles('trivy-results-mobile.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results-mobile.sarif
          category: trivy-fs-Mobile
          wait-for-processing: "false"

      - name: Trivy FS (Shared)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: vuln
          scan-ref: shared/schemas
          skip-dirs: node_modules
          trivyignores: .trivyignore
          ignore-unfixed: true
          format: sarif
          output: trivy-results-shared.sarif
          exit-code: 0

      - name: Upload Shared SARIF
        if: always() && hashFiles('trivy-results-shared.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results-shared.sarif
          category: trivy-fs-Shared
          wait-for-processing: "false"

      # Workspace tooling lockfile (root package.json: knip). Kept as its own
      # component so findings are attributable to the lockfile's owner.
      - name: Trivy FS (Root)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: vuln
          scan-ref: package-lock.json
          trivyignores: .trivyignore
          ignore-unfixed: true
          format: sarif
          output: trivy-results-root.sarif
          exit-code: 0

      - name: Upload Root SARIF
        if: always() && hashFiles('trivy-results-root.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results-root.sarif
          category: trivy-fs-Root
          wait-for-processing: "false"

  ###########################################################
  # Trivy DB cache retention
  ###########################################################

  # Two Trivy DB caches rotate on a schedule: trivy-action's vulnerability DB
  # (`cache-trivy-<date>`, daily) and the Java index DB the backend image scan
  # caches separately (`trivy-java-db-<version>-<3-day bucket>`, ci.yml). Keep
  # the newest existing default-branch entry per family and cache version.
  # Selecting from the API snapshot preserves a fallback when scans fail to
  # save or a run crosses midnight. Trivy still checks database freshness on
  # each scan. Wait for the Trivy scans to finish before taking the snapshot;
  # branch/PR caches and entries created after the snapshot are not deletion
  # candidates.
  trivy-cache-retention:
    name: Prune stale Trivy DB caches
    needs: trivy
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      contents: read
      actions: write

    steps:
      - name: Prune older default-branch Trivy DB cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          snapshot="$(gh api --method GET --paginate --slurp \
            "/repos/$REPO/actions/caches" \
            -f per_page=100 -f ref="$DEFAULT_REF")"
          # Cache versions encode path/compression compatibility. Retain one
          # replacement within each family/version, never merely a matching
          # date key.
          stale_ids="$(jq -r --arg ref "$DEFAULT_REF" '
            def family:
              if (.key | test("^cache-trivy-[0-9]{4}-[0-9]{2}-[0-9]{2}$")) then "vuln-db"
              elif (.key | startswith("trivy-java-db-")) then "java-db"
              else null end;
            [.[].actions_caches[]
              | select(.ref == $ref)
              | {id, version, created_at, family: family}
              | select(.family != null)]
            | group_by([.family, .version])[]
            | sort_by([.created_at, .id])
            | .[0:-1][] | .id
          ' <<< "$snapshot")"

          if [[ -z "$stale_ids" ]]; then
            echo "No stale Trivy DB caches to delete."
            exit 0
          fi

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          failures=0
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            echo "Deleting stale Trivy DB cache $id"
            if gh api --silent --method DELETE "/repos/$REPO/actions/caches/$id" 2> "$error_file"; then
              continue
            fi
            error="$(<"$error_file")"
            if [[ "$error" == *"(HTTP 404)"* ]]; then
              echo "Cache $id was already removed."
            else
              echo "::error::Failed to delete cache $id: $error"
              failures=$((failures + 1))
            fi
          done <<< "$stale_ids"

          if (( failures > 0 )); then
            echo "::error::Trivy cache cleanup incomplete: $failures deletion(s) failed."
            exit 1
          fi
