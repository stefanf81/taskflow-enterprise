name: Nightly Security Scans

on:
  schedule:
    - cron: '15 2 * * *'

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Prevent a manual workflow_dispatch run from colliding with the nightly
# schedule (and vice-versa). cancel-in-progress: false keeps both runs
# serialized rather than racing for the same runner/scanner resources,
# since SARIF uploads to the same Code Scanning category can otherwise
# interleave and clobber each other.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  TRIVY_VERSION: v0.73.0

defaults:
  run:
    shell: bash

jobs:
  ###########################################################
  # CodeQL
  ###########################################################

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write
      actions: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - language: java-kotlin
            build-mode: autobuild

          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  ###########################################################
  # Trivy Filesystem Scan
  ###########################################################

  trivy:
    name: Trivy FS (${{ matrix.component.name }})

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false

      matrix:
        component:
          # Keep findings attributable to the component that owns the lockfile.
          - name: Backend
            path: .
            skip-dirs: frontend,mobile,shared,.git,.gradle,build

          - name: Frontend
            path: frontend
            skip-dirs: node_modules,dist

          - name: Mobile
            path: mobile
            skip-dirs: node_modules,android,ios

          - name: Shared
            path: shared/schemas
            skip-dirs: node_modules

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      #####################################################
      # Filesystem Scan
      #####################################################

      # NOTE ON SEVERITY GATING (intentional asymmetry):
      # This filesystem/source scan is REPORT-ONLY (exit-code: 0) — it never
      # fails the build. It's meant to surface vulnerable dependencies early
      # (via the SARIF upload -> Code Scanning tab) without blocking PRs on
      # every transitive CVE in source manifests, many of which never ship.
      #
      # The Docker image scan in the CI `docker-build` job is the hard
      # gate (exit-code: 1, severity: HIGH,CRITICAL) — it blocks the build
      # because that's the artifact that actually gets deployed.
      #
      # If you "fix" one of these to match the other, you will either start
      # blocking every PR on unshipped source CVEs, or stop blocking on
      # vulnerable images entirely. Keep them different on purpose.
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: vuln
          scan-ref: ${{ matrix.component.path }}
          skip-dirs: ${{ matrix.component.skip-dirs }}
          trivyignores: .trivyignore
          format: sarif
          output: trivy-results.sarif

          # Non-blocking scan — see note above. Do not change without
          # also reconsidering the image scan's exit-code.
          exit-code: 0

      #####################################################
      # Upload Results
      #####################################################

      # Distinct category per matrix component is required: GitHub Code
      # Scanning rejects (or overwrites) multiple SARIF uploads from the
      # same tool with the same category in one workflow run.
      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results.sarif
          category: trivy-fs-${{ matrix.component.name }}
