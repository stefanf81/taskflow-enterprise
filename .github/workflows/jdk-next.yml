name: JDK next

# Early warning for the next Java upgrade: runs the backend tests on JDK 27 (the
# current non-LTS release) and the JDK 28 early-access build, and trains and
# verifies the AOT cache on a Temurin 27 image. Production stays on Java 25 LTS
# (ADR-020); nothing here changes what ships.
#
# Not a required check, and it never writes a cache: a red run is a signal to
# read, not a merge blocker. Classes are compiled by the Java 25 toolchain as
# usual; only the test JVM changes (`-PtestJavaVersion`, build.gradle).
#
# Compact object headers are ON by default from JDK 27 (they were opt-in on 25).
# Decision (ADR-020, decision 6): accept the JVM default on every version and
# never set the flag, so the AOT cache's training run and the image CMD always
# agree. These jobs therefore run with the JDK 27/28 default (headers on); the
# `aot-cache` job proves the cache still trains and loads with them.
on:
  schedule:
    # Weekly, Saturday 20:17 UTC: this repo's scheduled runs start ~5 h late
    # (see ci.yml), which lands it early Sunday, away from the nightly CI.
    - cron: "17 20 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jdk-next-${{ github.ref }}
  cancel-in-progress: true

env:
  # The compile toolchain (build.gradle). Gradle itself also runs on it.
  JAVA_VERSION: "25"

jobs:
  test:
    name: Tests on JDK ${{ matrix.java }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # setup-java version spec, toolchain major for Gradle.
        include:
          - java: "27"
            major: "27"
          - java: "28-ea"
            major: "28"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installed first so the second setup-java (Java 25) is the one on PATH
      # and in JAVA_HOME for Gradle; this JDK is only handed to the test JVM.
      - name: Set up JDK ${{ matrix.java }} (test JVM)
        id: test-jdk
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Java ${{ env.JAVA_VERSION }} (Gradle and compiler)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Record the test JVM
        env:
          TEST_JDK: ${{ steps.test-jdk.outputs.path }}
        run: |
          "$TEST_JDK/bin/java" -version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          "$TEST_JDK/bin/java" -XX:+PrintFlagsFinal -version 2>/dev/null \
            | grep -E 'UseCompactObjectHeaders|Use(G1|Serial|Parallel|Z)GC ' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # --no-build-cache: test results from another JVM must never be served
      # from, or written to, the cache that the blocking CI jobs use.
      # The installation path pins Gradle to the JDK set up above, and
      # auto-download stays off so an EA major is never fetched from elsewhere.
      - name: Test and testcontainersTest on JDK ${{ matrix.java }}
        env:
          TEST_JDK: ${{ steps.test-jdk.outputs.path }}
          TEST_MAJOR: ${{ matrix.major }}
        run: |
          ./gradlew \
            --no-build-cache \
            -PtestJavaVersion="$TEST_MAJOR" \
            -Porg.gradle.java.installations.paths="$TEST_JDK" \
            -Porg.gradle.java.installations.auto-download=false \
            test \
            testcontainersTest \
            --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jdk-${{ matrix.java }}-test-results
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: ignore
          retention-days: 14

  aot-cache:
    name: AOT cache on a Temurin 27 image
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Build the boot JAR
        run: ./gradlew bootJar --stacktrace

      # The Dockerfile trains the cache on the full application and then boots
      # it with -XX:AOTMode=on, which fails the build if the cache cannot be
      # used. A floating tag on purpose: this job tracks whatever Temurin 27
      # publishes; the production image keeps its digest-pinned Java 25 base.
      - name: Build the prod target on eclipse-temurin:27-jre-resolute
        run: |
          docker build \
            --target prod \
            --build-arg JAVA_IMAGE=eclipse-temurin:27-jre-resolute \
            --tag taskflow-backend:jdk27 \
            .

      - name: Record the image JVM
        run: |
          docker run --rm --entrypoint java taskflow-backend:jdk27 -version 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint java taskflow-backend:jdk27 -XX:+PrintFlagsFinal -version 2>/dev/null \
            | grep -E 'UseCompactObjectHeaders' \
            | tee -a "$GITHUB_STEP_SUMMARY"
