name: k6 Browser Test

on:
  workflow_dispatch:

# Least-privilege: this workflow only checks out the repo and runs a k6
# browser test and rate-limit-safe API probe against an external BASE_URL. It must NOT inherit the
# repository-wide "Read and write" default (required by pushdockerimage.yml
# for GHCR pushes) — that would silently grant packages:write, contents:write,
# etc. to a job that needs none of them.
permissions:
  contents: read

# Serialize manual runs so two k6 browser sessions do not load the shared
# external BASE_URL at the same time.
concurrency:
  group: k6-${{ github.repository }}
  cancel-in-progress: false

jobs:
  browser-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    env:
      BASE_URL: ${{ vars.BASE_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Verify BASE_URL is set
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::vars.BASE_URL is not set on this environment"
            exit 1
          fi

      - name: Run k6 browser test
        run: |
          # Remote smoke test: the GitHub runner measures cross-region latency,
          # so web.dev "good" CWV budgets (FCP<1800/LCP<2500) are not a valid
          # gate here — disable them and keep the functional/availability
          # checks. Same-region runs keep the CWV gate (ENFORCE_CWV defaults true).
          docker run --rm \
            -e BASE_URL="$BASE_URL" \
            -e ENFORCE_CWV=false \
            -v ${{ github.workspace }}:/work \
            -w /work \
            grafana/k6:2.2.0-with-browser \
            run k6/browser.js

      - name: Run k6 production API probe
        if: always()
        run: |
          docker run --rm \
            -e BASE_URL="$BASE_URL" \
            -v ${{ github.workspace }}:/work \
            -w /work \
            grafana/k6:2.2.0-with-browser \
            run k6/probe.js
