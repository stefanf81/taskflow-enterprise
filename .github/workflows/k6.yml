name: k6 Browser Test

on:
  workflow_dispatch:

# Least-privilege: this workflow only checks out the repo and runs a k6
# browser test against an external BASE_URL. It must NOT inherit the
# repository-wide "Read and write" default (required by pushdockerimage.yml
# for GHCR pushes) — that would silently grant packages:write, contents:write,
# etc. to a job that needs none of them.
permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BASE_URL: ${{ vars.BASE_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Verify BASE_URL is set
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::vars.BASE_URL is not set on this environment"
            exit 1
          fi

      - name: Run k6 browser test
        run: |
          docker run --rm \
            -e BASE_URL="$BASE_URL" \
            -v ${{ github.workspace }}:/work \
            -w /work \
            grafana/k6:latest-with-browser \
            run k6/browser.js

      - name: Run k6 load profile
        if: always()
        run: |
          docker run --rm \
            -e BASE_URL="$BASE_URL" \
            -v ${{ github.workspace }}:/work \
            -w /work \
            grafana/k6:latest-with-browser \
            run k6/load.js
