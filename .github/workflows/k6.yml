name: k6 Browser Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target URL (empty: the BASE_URL repository variable, production)"
        type: string
        default: ""
      check_early_click:
        description: "Also click a lookbook card while the page is still loading (BENCHMARKS §70)"
        type: boolean
        default: true
      enforce_cwv:
        description: "Gate on Core Web Vitals budgets (only meaningful from a runner close to the origin)"
        type: boolean
        default: false

# Least-privilege: this workflow only checks out the repo and runs a k6
# browser test and rate-limit-safe API probe against an external BASE_URL. It must NOT inherit the
# repository-wide "Read and write" default (required by pushdockerimage.yml
# for GHCR pushes) — that would silently grant packages:write, contents:write,
# etc. to a job that needs none of them.
permissions:
  contents: read

# Serialize manual runs so two k6 browser sessions do not load the shared
# external BASE_URL at the same time.
concurrency:
  group: k6-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  browser-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    env:
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL }}
      CHECK_EARLY_CLICK: ${{ inputs.check_early_click }}
      ENFORCE_CWV: ${{ inputs.enforce_cwv }}
      # renovate: datasource=docker depName=grafana/k6 versioning=docker
      K6_VERSION: "2.3.0-with-browser"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify BASE_URL is set
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::Neither the base_url input nor vars.BASE_URL is set"
            exit 1
          fi

      # Once for both runs below, with retries: a Docker Hub reset inside
      # `docker run` would read as a failed smoke test.
      - name: Pull k6 image
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if docker pull --quiet "grafana/k6:${K6_VERSION}"; then
              exit 0
            fi
            if (( attempt == 5 )); then
              break
            fi
            echo "docker pull failed (attempt ${attempt}/5); retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to pull grafana/k6:${K6_VERSION} after 5 attempts"
          exit 1

      - name: Run k6 browser test
        run: |
          set -euo pipefail

          # The image runs as an unprivileged user: the scripts are mounted
          # read-only, and it writes only its failure screenshot into k6-results.
          mkdir -p k6-results
          chmod a+w k6-results

          # Remote smoke test: the GitHub runner measures cross-region latency,
          # so web.dev "good" CWV budgets (FCP<1800/LCP<2500) are not a valid
          # gate here by default (enforce_cwv input). The web vitals are still
          # reported in the summary.
          docker run --rm \
            -e BASE_URL \
            -e ENFORCE_CWV \
            -e CHECK_EARLY_CLICK \
            -e RESULTS_DIR=k6-results \
            -v "$GITHUB_WORKSPACE/k6:/work/k6:ro" \
            -v "$GITHUB_WORKSPACE/k6-results:/work/k6-results" \
            -w /work \
            "grafana/k6:${K6_VERSION}" \
            run --quiet k6/browser.js 2>&1 | tee k6-results/browser.log

      # Also after a failed browser test: the two answer different questions
      # (does the booking flow work / do the public endpoints answer in time).
      - name: Run k6 production API probe
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          mkdir -p k6-results
          docker run --rm \
            -e BASE_URL \
            -v "$GITHUB_WORKSPACE/k6:/work/k6:ro" \
            -w /work \
            "grafana/k6:${K6_VERSION}" \
            run --quiet k6/probe.js 2>&1 | tee k6-results/probe.log

      - name: Write summary
        if: ${{ !cancelled() }}
        run: |
          # k6's own end-of-test report (thresholds, checks, web vitals), or the
          # tail of the log when the run ended before it was printed.
          report() {
            local title="$1" log="$2"
            echo "## ${title}"
            echo ""
            if [[ ! -s "$log" ]]; then
              echo "Did not run."
              echo ""
              return
            fi
            echo '```text'
            if grep -q 'THRESHOLDS' "$log"; then
              sed -n '/THRESHOLDS/,$p' "$log"
            else
              tail -n 40 "$log"
            fi
            echo '```'
            echo ""
          }
          {
            echo "Target: \`${BASE_URL}\` · early click checked: \`${CHECK_EARLY_CLICK}\` · CWV enforced: \`${ENFORCE_CWV}\`"
            echo ""
            report "k6 browser test (booking flow)" k6-results/browser.log
            report "k6 API probe" k6-results/probe.log
          } >> "$GITHUB_STEP_SUMMARY"

      # The logs, and a screenshot of the page if a browser scenario failed.
      - name: Upload k6 results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: k6-results
          path: k6-results/
          if-no-files-found: ignore
          retention-days: 14
