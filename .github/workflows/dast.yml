name: DAST (OWASP ZAP Full Scan)

on:
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  security-events: write

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

defaults:
  run:
    shell: bash

jobs:
  ###########################################################
  # DAST (OWASP ZAP)
  ###########################################################

  dast:
    name: OWASP ZAP Full Scan

    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18.4-alpine

        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.10.1-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD: taskflow
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_PASSWORD: admin-password

    steps:
      ##########################################################
      # Checkout
      ##########################################################

      - name: Checkout
        uses: actions/checkout@v7

      ##########################################################
      # Java
      ##########################################################

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shared/schemas/package-lock.json

      ##########################################################
      # Build
      ##########################################################

      - name: Build Backend
        run: |
          ./gradlew \
            --parallel \
            --build-cache \
            bootJar

      ##########################################################
      # Start Backend
      ##########################################################

      - name: Start Spring Boot
        run: |
          # SPRING_PROFILES_ACTIVE is set in the job env block above;
          # no -D override needed here — keep the java command minimal.
          nohup java \
            -jar build/libs/*.jar \
            > spring.log 2>&1 < /dev/null &

      ##########################################################
      # Wait for Backend
      ##########################################################

      - name: Wait for Backend
        run: |
          echo "Waiting for Spring Boot..."

          timeout=180

          while (( timeout > 0 )); do

            if curl -fs http://localhost:8080/actuator/health/liveness; then
              echo "Backend ready"
              exit 0
            fi

            sleep 2
            timeout=$((timeout-2))

          done

          echo "Backend failed to start"
          cat spring.log
          exit 1

      - name: Create DAST bearer token
        id: auth
        run: |
          set -euo pipefail

          response="$({
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"username":"admin","password":"admin-password"}' \
              http://localhost:8080/api/v1/auth/mobile/login
          })"
          token="$(jq --raw-output --exit-status '.accessToken' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Build production frontend image
        run: |
          set -euo pipefail

          npm ci --prefix shared/schemas --prefer-offline --no-audit --no-fund
          npm ci --prefix frontend --prefer-offline --no-audit --no-fund
          npm --prefix frontend exec -- ng build
          docker build --tag taskflow-dast-frontend frontend

      - name: Start production frontend ingress
        run: |
          set -euo pipefail

          docker run --detach \
            --name taskflow-dast-frontend \
            --add-host backend:host-gateway \
            --mount type=bind,src="$PWD/frontend/nginx-upstream-server-ci.conf",dst=/etc/nginx/upstream-server.conf,readonly \
            --publish 4200:8080 \
            --read-only \
            --tmpfs /tmp:uid=10001,gid=10001 \
            --tmpfs /var/cache/nginx:uid=10001,gid=10001 \
            --tmpfs /var/run:uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            taskflow-dast-frontend

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4200/ > /dev/null && \
               curl --fail --silent http://localhost:4200/api/v1/catalog > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs taskflow-dast-frontend
          exit 1

      ##########################################################
      # OWASP ZAP API Scan
      ##########################################################

      - name: Run authenticated OWASP ZAP API Scan
        id: zap_api
        continue-on-error: true
        uses: zaproxy/action-api-scan@v0.10.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.auth.outputs.token }}
          ZAP_AUTH_HEADER_SITE: http://localhost:8080
        with:
          target: api/openapi.json
          format: openapi
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api-report
          rules_file_name: .zap/api-rules.tsv
          cmd_options: >-
            -O http://localhost:8080
            -T 10

      # The ZAP actions' built-in artifact upload expects these default names.
      # Preserve them under scan-specific names before the frontend scan overwrites them.
      - name: Preserve ZAP API reports
        if: always()
        run: |
          for extension in json html md; do
            source="report_${extension}.${extension}"
            if [[ -f "$source" ]]; then
              cp "$source" "zap-api-report.${extension}"
            fi
          done

      - name: Run authenticated OWASP ZAP frontend scan
        id: zap_web
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.13.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.auth.outputs.token }}
          ZAP_AUTH_HEADER_SITE: http://localhost:4200
        with:
          target: http://localhost:4200
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-web-report
          rules_file_name: .zap/web-rules.tsv
          cmd_options: >-
            -T 10

      - name: Preserve ZAP frontend reports
        if: always()
        run: |
          for extension in json html md; do
            source="report_${extension}.${extension}"
            if [[ -f "$source" ]]; then
              cp "$source" "zap-web-report.${extension}"
            fi
          done

      - name: Generate Job Summary from ZAP Report
        if: always()
        run: |
          for report in zap-api-report.md zap-web-report.md; do
            if [[ -f "$report" ]]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      ##########################################################
      # Python
      ##########################################################

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      ##########################################################
      # Convert SARIF
      ##########################################################

      - name: Convert ZAP API JSON to SARIF
        if: always() && hashFiles('zap-api-report.json') != ''
        run: |
          python scripts/zap2sarif.py \
            zap-api-report.json \
            zap-api-results.sarif \
            --rules-file .zap/api-rules.tsv

      - name: Convert ZAP web JSON to SARIF
        if: always() && hashFiles('zap-web-report.json') != ''
        run: |
          python scripts/zap2sarif.py \
            zap-web-report.json \
            zap-web-results.sarif \
            --rules-file .zap/web-rules.tsv

      ##########################################################
      # Upload SARIF
      ##########################################################

      - name: Upload API SARIF
        if: always() && hashFiles('zap-api-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zap-api-results.sarif
          category: dast-zap-api

      - name: Upload web SARIF
        if: always() && hashFiles('zap-web-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zap-web-results.sarif
          category: dast-zap-web

      ##########################################################
      # Upload Reports
      ##########################################################

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-full-scan
          path: |
            spring.log
            zap-api-report.html
            zap-api-report.json
            zap-api-report.md
            zap-api-results.sarif
            zap-web-report.html
            zap-web-report.json
            zap-web-report.md
            zap-web-results.sarif
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Enforce ZAP scan results
        if: ${{ always() && !cancelled() }}
        env:
          API_OUTCOME: ${{ steps.zap_api.outcome }}
          WEB_OUTCOME: ${{ steps.zap_web.outcome }}
        run: |
          if [[ "$API_OUTCOME" != "success" || "$WEB_OUTCOME" != "success" ]]; then
            echo "OWASP ZAP scan failed: api=$API_OUTCOME web=$WEB_OUTCOME" >&2
            exit 1
          fi
