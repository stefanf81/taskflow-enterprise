name: DAST (OWASP ZAP Full Scan)

on:
  workflow_dispatch:
    inputs:
      scan_scope:
        description: "Scan scope to execute"
        type: choice
        options:
          - all
          - api_only
          - web_only
        default: all
      fail_on_findings:
        description: "Fail workflow on scan findings (set false for audit/triage)"
        type: boolean
        default: true
      enable_ajax_spider:
        description: "Enable modern AJAX spidering for Angular SPA in web scan"
        type: boolean
        default: true

  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

defaults:
  run:
    shell: bash

jobs:
  ###########################################################
  # DAST (OWASP ZAP)
  ###########################################################

  dast:
    name: OWASP ZAP Full Scan

    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write

    services:
      postgres:
        image: postgres:18.6-alpine

        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.10.1-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD: taskflow
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_PASSWORD: admin-password
      SCAN_SCOPE: ${{ inputs.scan_scope || 'all' }}
      FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings != false }}
      ENABLE_AJAX_SPIDER: ${{ inputs.enable_ajax_spider != false }}

    steps:
      ##########################################################
      # Checkout
      ##########################################################

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      ##########################################################
      # Java & Gradle
      ##########################################################

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      ##########################################################
      # Node.js
      ##########################################################

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shared/schemas/package-lock.json

      ##########################################################
      # Build Backend
      ##########################################################

      - name: Build Backend
        run: |
          ./gradlew \
            --parallel \
            --build-cache \
            bootJar

      ##########################################################
      # Start Backend
      ##########################################################

      - name: Start Spring Boot
        uses: ./.github/actions/start-backend
        with:
          profile: prod
          pid-file: spring.pid
          java-options: -Xmx1g -XX:+ExitOnOutOfMemoryError

      - name: Create DAST bearer token
        id: auth
        run: |
          set -euo pipefail

          payload="$(jq -cn --arg u "admin" --arg p "$SPRING_SECURITY_PASSWORD" '{username: $u, password: $p}')"

          response="$({
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              http://localhost:8080/api/v1/auth/mobile/login
          })"
          token="$(jq --raw-output --exit-status '.accessToken' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      ##########################################################
      # Frontend Ingress (Only needed when scanning web frontend)
      ##########################################################

      - name: Cache Angular Build
        if: env.SCAN_SCOPE != 'api_only'
        uses: actions/cache@v6
        with:
          path: frontend/.angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'shared/schemas/package-lock.json') }}
          restore-keys: |
            angular-${{ runner.os }}-

      - name: Install frontend dependencies
        if: env.SCAN_SCOPE != 'api_only'
        uses: ./.github/actions/npm-ci
        with:
          package-path: frontend

      - name: Build production frontend image
        if: env.SCAN_SCOPE != 'api_only'
        run: |
          set -euo pipefail

          npm --prefix frontend exec -- ng build
          docker build --tag taskflow-dast-frontend frontend

      - name: Start production frontend ingress
        if: env.SCAN_SCOPE != 'api_only'
        run: |
          set -euo pipefail

          docker run --detach \
            --name taskflow-dast-frontend \
            --add-host backend:host-gateway \
            --mount type=bind,src="$PWD/frontend/nginx-upstream-server-ci.conf",dst=/etc/nginx/upstream-server.conf,readonly \
            --publish 4200:8080 \
            --read-only \
            --tmpfs /tmp:uid=10001,gid=10001 \
            --tmpfs /var/cache/nginx:uid=10001,gid=10001 \
            --tmpfs /var/run:uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            taskflow-dast-frontend

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4200/ > /dev/null && \
               curl --fail --silent http://localhost:4200/api/v1/catalog > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs taskflow-dast-frontend
          exit 1

      ##########################################################
      # OWASP ZAP API Scan
      ##########################################################

      - name: Run authenticated OWASP ZAP API Scan
        id: zap_api
        if: env.SCAN_SCOPE != 'web_only'
        continue-on-error: true
        uses: zaproxy/action-api-scan@v0.10.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.auth.outputs.token }}
          ZAP_AUTH_HEADER_SITE: http://localhost:8080
        with:
          target: api/openapi.json
          format: openapi
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api-report
          rules_file_name: .zap/api-rules.tsv
          cmd_options: >-
            -O http://localhost:8080
            -T 10

      # The ZAP actions' built-in artifact upload expects these default names.
      # Preserve them under scan-specific names before the frontend scan overwrites them.
      - name: Preserve ZAP API reports
        if: always() && steps.zap_api.outcome != 'skipped'
        run: |
          for extension in json html md; do
            source="report_${extension}.${extension}"
            if [[ -f "$source" ]]; then
              cp "$source" "zap-api-report.${extension}"
            fi
          done

      ##########################################################
      # OWASP ZAP Frontend Scan
      ##########################################################

      - name: Run authenticated OWASP ZAP frontend scan
        id: zap_web
        if: ${{ !cancelled() && env.SCAN_SCOPE != 'api_only' }}
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.13.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.auth.outputs.token }}
          ZAP_AUTH_HEADER_SITE: http://localhost:4200
        with:
          target: http://localhost:4200
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-web-report
          rules_file_name: .zap/web-rules.tsv
          cmd_options: >-
            ${{ env.ENABLE_AJAX_SPIDER == 'true' && '-j -m 5 -T 15' || '-T 10' }}

      - name: Preserve ZAP frontend reports
        if: always() && steps.zap_web.outcome != 'skipped'
        run: |
          for extension in json html md; do
            source="report_${extension}.${extension}"
            if [[ -f "$source" ]]; then
              cp "$source" "zap-web-report.${extension}"
            fi
          done

      ##########################################################
      # Job Summary Generation
      ##########################################################

      - name: Generate Job Summary from ZAP Report
        if: always()
        run: |
          echo "## 🛡️ OWASP ZAP DAST Security Scan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | Scope | Outcome | Report Available |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"

          api_outcome="${{ steps.zap_api.outcome || 'skipped' }}"
          web_outcome="${{ steps.zap_web.outcome || 'skipped' }}"

          echo "| API (\`api/openapi.json\`) | \`${SCAN_SCOPE}\` | \`${api_outcome}\` | $( [[ -f zap-api-report.md ]] && echo 'Yes' || echo 'No' ) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web SPA (\`http://localhost:4200\`) | \`${SCAN_SCOPE}\` | \`${web_outcome}\` | $( [[ -f zap-web-report.md ]] && echo 'Yes' || echo 'No' ) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f zap-api-report.md ]]; then
            echo "<details><summary><strong>📋 OWASP ZAP API Scan Report</strong></summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat zap-api-report.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f zap-web-report.md ]]; then
            echo "<details><summary><strong>🌐 OWASP ZAP Frontend Web Scan Report</strong></summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat zap-web-report.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

      ##########################################################
      # Python & SARIF Conversion
      ##########################################################

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Convert ZAP API JSON to SARIF
        if: always() && hashFiles('zap-api-report.json') != ''
        run: |
          python scripts/zap2sarif.py \
            zap-api-report.json \
            zap-api-results.sarif \
            --rules-file .zap/api-rules.tsv \
            --target http://localhost:8080

      - name: Convert ZAP web JSON to SARIF
        if: always() && hashFiles('zap-web-report.json') != ''
        run: |
          python scripts/zap2sarif.py \
            zap-web-report.json \
            zap-web-results.sarif \
            --rules-file .zap/web-rules.tsv \
            --target http://localhost:4200

      ##########################################################
      # Upload SARIF
      ##########################################################

      - name: Upload API SARIF
        if: always() && hashFiles('zap-api-results.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: zap-api-results.sarif
          category: dast-zap-api

      - name: Upload web SARIF
        if: always() && hashFiles('zap-web-results.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: zap-web-results.sarif
          category: dast-zap-web

      ##########################################################
      # Upload Consolidated Reports
      ##########################################################

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-full-scan
          path: |
            spring.log
            zap-api-report.html
            zap-api-report.json
            zap-api-report.md
            zap-api-results.sarif
            zap-web-report.html
            zap-web-report.json
            zap-web-report.md
            zap-web-results.sarif
          if-no-files-found: ignore
          retention-days: 14

      ##########################################################
      # Quality Gate Enforcement
      ##########################################################

      - name: Enforce ZAP scan results
        if: ${{ always() && !cancelled() }}
        env:
          API_OUTCOME: ${{ steps.zap_api.outcome || 'skipped' }}
          WEB_OUTCOME: ${{ steps.zap_web.outcome || 'skipped' }}
        run: |
          set -euo pipefail

          echo "Scan evaluation: api=$API_OUTCOME, web=$WEB_OUTCOME, fail_on_findings=$FAIL_ON_FINDINGS"

          failed=0
          if [[ "$API_OUTCOME" != "success" && "$API_OUTCOME" != "skipped" ]]; then
            echo "::error::OWASP ZAP API scan reported failures or alerts (outcome: $API_OUTCOME)"
            failed=1
          fi

          if [[ "$WEB_OUTCOME" != "success" && "$WEB_OUTCOME" != "skipped" ]]; then
            echo "::error::OWASP ZAP Web scan reported failures or alerts (outcome: $WEB_OUTCOME)"
            failed=1
          fi

          if (( failed == 1 )); then
            if [[ "$FAIL_ON_FINDINGS" == "true" ]]; then
              echo "OWASP ZAP scan quality gate failed." >&2
              exit 1
            else
              echo "::warning::OWASP ZAP scan reported findings, but fail_on_findings is disabled."
            fi
          else
            echo "OWASP ZAP scans passed successfully."
          fi

      ##########################################################
      # Teardown & Runtime Resource Cleanup
      ##########################################################

      - name: Teardown DAST runtime resources
        if: always()
        run: |
          echo "Cleaning up DAST runtime resources..."
          docker rm -f taskflow-dast-frontend 2>/dev/null || true
          if [[ -f spring.pid ]]; then
            backend_pid="$(<spring.pid)"
            if kill -0 "$backend_pid" 2>/dev/null; then
              kill -SIGTERM "$backend_pid" 2>/dev/null || true
            fi
          fi
