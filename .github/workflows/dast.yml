name: DAST (OWASP ZAP Full Scan)

on:
  workflow_dispatch:
    inputs:
      scan_scope:
        description: "Scan scope to execute"
        type: choice
        options:
          - all
          - api_only
          - web_only
        default: all
      fail_on_findings:
        description: "Fail workflow on scan findings (set false for audit/triage)"
        type: boolean
        default: true
      enable_ajax_spider:
        description: "Enable modern AJAX spidering for Angular SPA in web scan"
        type: boolean
        default: true

  schedule:
    # Fires 22:16 UTC to land execution ~03:16 UTC (GitHub scheduler lag ~5h).
    - cron: "16 22 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "24"
  # The ZAP image is run directly instead of through zaproxy/action-api-scan /
  # action-full-scan: those wrappers default to the mutable `:stable` tag.
  # zap-image: tracked by the dedicated regex manager in .github/renovate.json
  ZAP_VERSION: "2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238"

defaults:
  run:
    shell: bash

jobs:
  ###########################################################
  # Build the backend JAR once; both scan jobs consume it.
  ###########################################################

  build-backend:
    name: Build Backend JAR

    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Read-only: CI's `backend` job owns the Gradle cache writes. DAST runs
      # close to the nightly CI window, so a concurrent write here would race
      # the same keys. GRADLE_BUILD_ACTION_CACHE_KEY_JOB restores that job's
      # newest entry instead of a never-refreshed one of this job id (see the
      # `package` job in ci.yml).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: backend
        with:
          cache-read-only: true

      - name: Build Backend
        run: |
          ./gradlew \
            --parallel \
            --build-cache \
            bootJar

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: dast-backend-jar
          path: build/libs/*.jar
          compression-level: 0
          retention-days: 1

  ###########################################################
  # DAST (OWASP ZAP) — API scan
  #
  # API and web scans run as independent jobs so the two ZAP runs overlap
  # instead of executing serially (~160s + ~196s) in one job. Each job runs
  # its own backend against its own Postgres/Redis services.
  ###########################################################

  dast-api:
    name: OWASP ZAP API Scan

    needs: build-backend

    # Empty inputs.scan_scope (schedule) evaluates to !== 'web_only'.
    if: ${{ inputs.scan_scope != 'web_only' }}

    runs-on: ubuntu-26.04
    timeout-minutes: 45

    permissions:
      contents: read
      security-events: write

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5

        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

      redis:
        image: redis:8.10.3-alpine@sha256:896f241f438ab6a210cfb24f573b84bea721a4cbe67f1b4fd07eb638b3b02a7b

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD: taskflow
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_PASSWORD: admin-password
      FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings != false }}
      SCAN_SCOPE: ${{ inputs.scan_scope || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: dast-backend-jar
          path: backend-jar-dir

      - name: Start Spring Boot
        uses: ./.github/actions/start-backend
        with:
          jar-path: backend-jar-dir/*.jar
          profile: prod
          pid-file: spring-api.pid
          java-options: -Xmx1g -XX:+ExitOnOutOfMemoryError

      - name: Create DAST bearer token
        id: auth
        run: |
          set -euo pipefail

          payload="$(jq -cn --arg u "admin" --arg p "$SPRING_SECURITY_PASSWORD" '{username: $u, password: $p}')"

          response="$({
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              http://localhost:8080/api/v1/auth/mobile/login
          })"
          token="$(jq --raw-output --exit-status '.accessToken' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      ##########################################################
      # OWASP ZAP API Scan
      ##########################################################

      - name: Run authenticated OWASP ZAP API Scan
        id: zap_api
        continue-on-error: true
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.auth.outputs.token }}
          ZAP_AUTH_HEADER_SITE: http://localhost:8080
        run: |
          set -euo pipefail

          # The image runs as `zap` (uid 1000), not the runner user, and writes
          # its reports into the mounted workspace.
          chmod a+w "$GITHUB_WORKSPACE"

          zap_exit=0
          docker run --rm \
            --network host \
            --volume "$GITHUB_WORKSPACE:/zap/wrk:rw" \
            --env ZAP_AUTH_HEADER \
            --env ZAP_AUTH_HEADER_VALUE \
            --env ZAP_AUTH_HEADER_SITE \
            "ghcr.io/zaproxy/zaproxy:${ZAP_VERSION}" \
            zap-api-scan.py \
              -t api/openapi.json \
              -f openapi \
              -O http://localhost:8080 \
              -c .zap/api-rules.tsv \
              -J zap-api-report.json \
              -w zap-api-report.md \
              -r zap-api-report.html \
              -T 10 \
            || zap_exit=$?

          # 1 = FAIL alerts, 2 = WARN alerts only, 3 = scan error. Every non-zero
          # code fails this step, as the action did with `fail_action: true`.
          case "$zap_exit" in
            0) ;;
            1 | 2) echo "::warning::OWASP ZAP reported alerts (exit code $zap_exit)" ;;
            *) echo "::error::OWASP ZAP could not complete the scan (exit code $zap_exit)" ;;
          esac
          exit "$zap_exit"

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Convert ZAP API JSON to SARIF
        if: always() && hashFiles('zap-api-report.json') != ''
        run: |
          python scripts/zap2sarif.py \
            zap-api-report.json \
            zap-api-results.sarif \
            --rules-file .zap/api-rules.tsv \
            --target http://localhost:8080

      - name: Upload API SARIF
        if: always() && hashFiles('zap-api-results.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: zap-api-results.sarif
          category: dast-zap-api

      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-api-scan
          path: |
            spring.log
            zap-api-report.html
            zap-api-report.json
            zap-api-report.md
            zap-api-results.sarif
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate API scan summary
        if: always()
        env:
          API_OUTCOME: ${{ steps.zap_api.outcome || 'skipped' }}
        run: |
          {
            echo "## 🛡️ OWASP ZAP API Scan Summary"
            echo ""
            echo "| Target | Scope | Outcome | Report Available |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| API (\`api/openapi.json\`) | \`${SCAN_SCOPE}\` | \`${API_OUTCOME}\` | $( [[ -f zap-api-report.md ]] && echo 'Yes' || echo 'No' ) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f zap-api-report.md ]]; then
            {
              echo ""
              echo "<details><summary><strong>📋 OWASP ZAP API Scan Report</strong></summary>"
              echo ""
              cat zap-api-report.md
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce ZAP API scan results
        if: ${{ always() && !cancelled() }}
        env:
          API_OUTCOME: ${{ steps.zap_api.outcome || 'skipped' }}
        run: |
          set -euo pipefail

          echo "Scan evaluation: api=$API_OUTCOME, fail_on_findings=$FAIL_ON_FINDINGS"

          if [[ "$API_OUTCOME" == "success" || "$API_OUTCOME" == "skipped" ]]; then
            echo "OWASP ZAP API scan passed successfully."
            exit 0
          fi

          if [[ "$FAIL_ON_FINDINGS" == "true" ]]; then
            echo "::error::OWASP ZAP API scan reported failures or alerts (outcome: $API_OUTCOME)"
            echo "OWASP ZAP API scan quality gate failed." >&2
            exit 1
          fi

          echo "::warning::OWASP ZAP API scan reported findings, but fail_on_findings is disabled."

      - name: Teardown DAST runtime resources
        if: always()
        run: |
          echo "Cleaning up DAST runtime resources..."
          if [[ -f spring-api.pid ]]; then
            backend_pid="$(<spring-api.pid)"
            if kill -0 "$backend_pid" 2>/dev/null; then
              kill -SIGTERM "$backend_pid" 2>/dev/null || true
            fi
          fi

  ###########################################################
  # DAST (OWASP ZAP) — frontend/web scan
  ###########################################################

  dast-web:
    name: OWASP ZAP Frontend Scan

    needs: build-backend

    # Empty inputs.scan_scope (schedule) evaluates to !== 'api_only'.
    if: ${{ inputs.scan_scope != 'api_only' }}

    runs-on: ubuntu-26.04
    timeout-minutes: 45

    permissions:
      contents: read
      security-events: write

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5

        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

      redis:
        image: redis:8.10.3-alpine@sha256:896f241f438ab6a210cfb24f573b84bea721a4cbe67f1b4fd07eb638b3b02a7b

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD: taskflow
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_PASSWORD: admin-password
      FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings != false }}
      ENABLE_AJAX_SPIDER: ${{ inputs.enable_ajax_spider != false }}
      SCAN_SCOPE: ${{ inputs.scan_scope || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: dast-backend-jar
          path: backend-jar-dir

      - name: Start Spring Boot
        uses: ./.github/actions/start-backend
        with:
          jar-path: backend-jar-dir/*.jar
          profile: prod
          pid-file: spring-web.pid
          java-options: -Xmx1g -XX:+ExitOnOutOfMemoryError

      - name: Create DAST bearer token
        id: auth
        run: |
          set -euo pipefail

          payload="$(jq -cn --arg u "admin" --arg p "$SPRING_SECURITY_PASSWORD" '{username: $u, password: $p}')"

          response="$({
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              http://localhost:8080/api/v1/auth/mobile/login
          })"
          token="$(jq --raw-output --exit-status '.accessToken' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      ##########################################################
      # Frontend Ingress
      ##########################################################

      - name: Cache Angular Build
        uses: actions/cache@v6
        with:
          path: frontend/.angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            angular-${{ runner.os }}-

      - name: Install frontend dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: frontend

      - name: Build production frontend image
        run: |
          set -euo pipefail

          npm --prefix frontend exec -- ng build
          docker build --tag taskflow-dast-frontend frontend

      - name: Start production frontend ingress
        run: |
          set -euo pipefail

          docker run --detach \
            --name taskflow-dast-frontend \
            --add-host backend:host-gateway \
            --mount type=bind,src="$PWD/frontend/nginx-upstream-server-ci.conf",dst=/etc/nginx/upstream-server.conf,readonly \
            --publish 4200:8080 \
            --read-only \
            --tmpfs /tmp:uid=10001,gid=10001 \
            --tmpfs /var/cache/nginx:uid=10001,gid=10001 \
            --tmpfs /var/run:uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            taskflow-dast-frontend

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4200/ > /dev/null && \
               curl --fail --silent http://localhost:4200/api/v1/catalog > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs taskflow-dast-frontend
          exit 1

      ##########################################################
      # OWASP ZAP Frontend Scan
      ##########################################################

      - name: Run authenticated OWASP ZAP frontend scan
        id: zap_web
        continue-on-error: true
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.auth.outputs.token }}
          ZAP_AUTH_HEADER_SITE: http://localhost:4200
        run: |
          set -euo pipefail

          if [[ "$ENABLE_AJAX_SPIDER" == "true" ]]; then
            spider_options=(-j -m 5 -T 15)
          else
            spider_options=(-T 10)
          fi

          # The image runs as `zap` (uid 1000), not the runner user, and writes
          # its reports into the mounted workspace.
          chmod a+w "$GITHUB_WORKSPACE"

          zap_exit=0
          docker run --rm \
            --network host \
            --volume "$GITHUB_WORKSPACE:/zap/wrk:rw" \
            --env ZAP_AUTH_HEADER \
            --env ZAP_AUTH_HEADER_VALUE \
            --env ZAP_AUTH_HEADER_SITE \
            "ghcr.io/zaproxy/zaproxy:${ZAP_VERSION}" \
            zap-full-scan.py \
              -t http://localhost:4200 \
              -c .zap/web-rules.tsv \
              -J zap-web-report.json \
              -w zap-web-report.md \
              -r zap-web-report.html \
              "${spider_options[@]}" \
            || zap_exit=$?

          # 1 = FAIL alerts, 2 = WARN alerts only, 3 = scan error. Every non-zero
          # code fails this step, as the action did with `fail_action: true`.
          case "$zap_exit" in
            0) ;;
            1 | 2) echo "::warning::OWASP ZAP reported alerts (exit code $zap_exit)" ;;
            *) echo "::error::OWASP ZAP could not complete the scan (exit code $zap_exit)" ;;
          esac
          exit "$zap_exit"

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Convert ZAP web JSON to SARIF
        if: always() && hashFiles('zap-web-report.json') != ''
        run: |
          python scripts/zap2sarif.py \
            zap-web-report.json \
            zap-web-results.sarif \
            --rules-file .zap/web-rules.tsv \
            --target http://localhost:4200

      - name: Upload web SARIF
        if: always() && hashFiles('zap-web-results.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: zap-web-results.sarif
          category: dast-zap-web

      - name: Upload web reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-web-scan
          path: |
            spring.log
            zap-web-report.html
            zap-web-report.json
            zap-web-report.md
            zap-web-results.sarif
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate web scan summary
        if: always()
        env:
          WEB_OUTCOME: ${{ steps.zap_web.outcome || 'skipped' }}
        run: |
          {
            echo "## 🌐 OWASP ZAP Frontend Scan Summary"
            echo ""
            echo "| Target | Scope | Outcome | Report Available |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| Web SPA (\`http://localhost:4200\`) | \`${SCAN_SCOPE}\` | \`${WEB_OUTCOME}\` | $( [[ -f zap-web-report.md ]] && echo 'Yes' || echo 'No' ) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f zap-web-report.md ]]; then
            {
              echo ""
              echo "<details><summary><strong>🌐 OWASP ZAP Frontend Web Scan Report</strong></summary>"
              echo ""
              cat zap-web-report.md
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce ZAP web scan results
        if: ${{ always() && !cancelled() }}
        env:
          WEB_OUTCOME: ${{ steps.zap_web.outcome || 'skipped' }}
        run: |
          set -euo pipefail

          echo "Scan evaluation: web=$WEB_OUTCOME, fail_on_findings=$FAIL_ON_FINDINGS"

          if [[ "$WEB_OUTCOME" == "success" || "$WEB_OUTCOME" == "skipped" ]]; then
            echo "OWASP ZAP web scan passed successfully."
            exit 0
          fi

          if [[ "$FAIL_ON_FINDINGS" == "true" ]]; then
            echo "::error::OWASP ZAP web scan reported failures or alerts (outcome: $WEB_OUTCOME)"
            echo "OWASP ZAP web scan quality gate failed." >&2
            exit 1
          fi

          echo "::warning::OWASP ZAP web scan reported findings, but fail_on_findings is disabled."

      - name: Teardown DAST runtime resources
        if: always()
        run: |
          echo "Cleaning up DAST runtime resources..."
          docker rm -f taskflow-dast-frontend 2>/dev/null || true
          if [[ -f spring-web.pid ]]; then
            backend_pid="$(<spring-web.pid)"
            if kill -0 "$backend_pid" 2>/dev/null; then
              kill -SIGTERM "$backend_pid" 2>/dev/null || true
            fi
          fi
