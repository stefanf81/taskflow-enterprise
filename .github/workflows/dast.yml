name: DAST (OWASP ZAP Full Scan)

on:
  workflow_dispatch:
    inputs:
      scan_scope:
        description: "Scan scope to execute"
        type: choice
        options:
          - all
          - api_only
          - web_only
        default: all
      fail_on_findings:
        description: "Fail workflow on scan findings (set false for audit/triage)"
        type: boolean
        default: true
      enable_ajax_spider:
        description: "Enable modern AJAX spidering for Angular SPA in web scan"
        type: boolean
        default: true

  schedule:
    # Fires 22:16 UTC to land execution ~03:16 UTC (GitHub scheduler lag ~5h).
    - cron: "16 22 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "26"
  # The ZAP image is run directly instead of through zaproxy/action-api-scan /
  # action-full-scan: those wrappers default to the mutable `:stable` tag.
  # zap-image: tracked by the dedicated regex manager in .github/renovate.json
  ZAP_VERSION: "2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af"

defaults:
  run:
    shell: bash

jobs:
  ###########################################################
  # Build the backend JAR once; both scan jobs consume it.
  ###########################################################

  build-backend:
    name: Build Backend JAR

    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Read-only Gradle cache: CI's `backend` job owns the writes, and DAST
      # runs close to the nightly CI window, so a write here would race them.
      - name: Build backend JAR
        uses: ./.github/actions/build-backend-jar
        with:
          java-version: ${{ env.JAVA_VERSION }}
          gradle-task: bootJar
          artifact-name: dast-backend-jar
          retention-days: 1

  ###########################################################
  # DAST (OWASP ZAP) — API scan, as an administrator
  #
  # API and web scans run as independent jobs so the two ZAP runs overlap
  # instead of executing serially in one job. Each job runs its own backend
  # against its own Postgres/Redis services.
  ###########################################################

  dast-api:
    name: OWASP ZAP API Scan

    needs: build-backend

    # Empty inputs.scan_scope (schedule) evaluates to !== 'web_only'.
    if: ${{ inputs.scan_scope != 'web_only' }}

    runs-on: ubuntu-26.04
    timeout-minutes: 45

    permissions:
      contents: read
      security-events: write

    services: &dast-services
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395

        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

      redis:
        image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD: taskflow
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      # Unauthenticated service container (no command arguments possible): empty on purpose,
      # see the same variable in ci.yml's e2e job.
      REDIS_PASSWORD: ""
      SPRING_SECURITY_PASSWORD: admin-password
      # The prod profile's per-IP limiter (100 requests/min, 20/min on /auth) stays on, but
      # out of ZAP's reach: the whole scan comes from one address, and at production limits
      # the limiter answered 99% of it with 429 before any handler ran (BENCHMARKS §69).
      # The per-account login throttle is not raised; it is part of what gets scanned.
      APP_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE: "1000000"
      APP_RATE_LIMIT_AUTH_MAX_REQUESTS_PER_MINUTE: "1000000"
      FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings != false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: dast-backend-jar
          path: backend-jar-dir

      # Not awaited here: the JVM starts while the scanner image is pulled.
      - name: Start Spring Boot
        id: backend
        uses: ./.github/actions/start-backend
        with:
          jar-path: backend-jar-dir/*.jar
          profile: prod
          pid-file: spring-api.pid
          java-options: -Xmx1g -XX:+ExitOnOutOfMemoryError
          wait: "false"

      # Its own step, with retries: the implicit pull of `docker run` turned a
      # ghcr.io reset into "ZAP could not complete the scan".
      - &pull-zap-image
        name: Pull ZAP image
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if docker pull --quiet "ghcr.io/zaproxy/zaproxy:${ZAP_VERSION}"; then
              exit 0
            fi
            if (( attempt == 5 )); then
              break
            fi
            echo "docker pull failed (attempt ${attempt}/5); retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to pull ghcr.io/zaproxy/zaproxy:${ZAP_VERSION} after 5 attempts"
          exit 1

      - name: Wait for Spring Boot
        uses: ./.github/actions/wait-backend
        with:
          pid: ${{ steps.backend.outputs.pid }}

      - name: Create DAST bearer token
        id: auth
        run: |
          set -euo pipefail

          payload="$(jq -cn --arg u "admin" --arg p "$SPRING_SECURITY_PASSWORD" '{username: $u, password: $p}')"

          response="$({
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              http://localhost:8080/api/v1/auth/mobile/login
          })"
          token="$(jq --raw-output --exit-status '.accessToken' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      ##########################################################
      # OWASP ZAP API Scan
      ##########################################################

      - name: Run authenticated OWASP ZAP API Scan
        id: zap
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.auth.outputs.token }}
          # ZAP adds the header when the request's host NAME contains this value. A URL
          # ("http://localhost:8080") never matches, and the scan then runs unauthenticated
          # without any error; the report step below checks that it did not.
          ZAP_AUTH_HEADER_SITE: localhost
        run: |
          set -euo pipefail

          # The image runs as `zap` (uid 1000), not the runner user, and writes
          # its reports into the mounted workspace.
          chmod a+w "$GITHUB_WORKSPACE"

          zap_exit=0
          docker run --rm \
            --network host \
            --volume "$GITHUB_WORKSPACE:/zap/wrk:rw" \
            --env ZAP_AUTH_HEADER \
            --env ZAP_AUTH_HEADER_VALUE \
            --env ZAP_AUTH_HEADER_SITE \
            "ghcr.io/zaproxy/zaproxy:${ZAP_VERSION}" \
            zap-api-scan.py \
              -t api/openapi.json \
              -f openapi \
              -O http://localhost:8080 \
              -c .zap/api-rules.tsv \
              -J zap-api-report.json \
              -w zap-api-report.md \
              -r zap-api-report.html \
              -T 10 \
            || zap_exit=$?

          # 0 = clean, 1 = FAIL alerts, 2 = WARN alerts only, 3 = scan error.
          # The report step decides what fails the job.
          echo "exit-code=$zap_exit" >> "$GITHUB_OUTPUT"

      - name: Report and gate the API scan
        if: ${{ !cancelled() }}
        uses: ./.github/actions/zap-report
        with:
          scan: api
          title: OWASP ZAP API scan (administrator)
          target: http://localhost:8080
          rules-file: .zap/api-rules.tsv
          zap-exit-code: ${{ steps.zap.outputs.exit-code }}
          fail-on-findings: ${{ env.FAIL_ON_FINDINGS }}
          # An effective scan serves ~19,000 requests (BENCHMARKS §69); at production
          # rate limits at most 120 a minute get through.
          min-served: "2000"
          # Admin-only: 2xx proves ZAP sent the token.
          require-success: /api/v1/barbers/admin
          token: ${{ steps.auth.outputs.token }}

      - name: Teardown DAST runtime resources
        if: always()
        run: |
          echo "Cleaning up DAST runtime resources..."
          if [[ -f spring-api.pid ]]; then
            backend_pid="$(<spring-api.pid)"
            if kill -0 "$backend_pid" 2>/dev/null; then
              kill -SIGTERM "$backend_pid" 2>/dev/null || true
            fi
          fi

  ###########################################################
  # DAST (OWASP ZAP) — frontend/web scan, as a guest
  #
  # Through the production ingress, without credentials: the SPA restores a
  # session only from its own cookies, so the browser ZAP drives sees what an
  # anonymous visitor sees, with the cookie and CSRF handling of real clients.
  # The API scan above covers the authenticated surface.
  ###########################################################

  dast-web:
    name: OWASP ZAP Frontend Scan

    needs: build-backend

    # Empty inputs.scan_scope (schedule) evaluates to !== 'api_only'.
    if: ${{ inputs.scan_scope != 'api_only' }}

    runs-on: ubuntu-26.04
    timeout-minutes: 45

    permissions:
      contents: read
      security-events: write

    services: *dast-services

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD: taskflow
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      # Unauthenticated service container (no command arguments possible): empty on purpose,
      # see the same variable in ci.yml's e2e job.
      REDIS_PASSWORD: ""
      SPRING_SECURITY_PASSWORD: admin-password
      # See dast-api: every proxied request reaches the backend from the ingress
      # container's one address, so the per-IP limiter would throttle the scan.
      APP_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE: "1000000"
      APP_RATE_LIMIT_AUTH_MAX_REQUESTS_PER_MINUTE: "1000000"
      FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings != false }}
      ENABLE_AJAX_SPIDER: ${{ inputs.enable_ajax_spider != false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # No setup-node cache: the npm-ci action below restores ~/.npm itself,
      # and only when its node_modules cache misses (a hit downloads nothing).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: dast-backend-jar
          path: backend-jar-dir

      # Not awaited here: the JVM starts while the frontend image is built and
      # the scanner image is pulled.
      - name: Start Spring Boot
        id: backend
        uses: ./.github/actions/start-backend
        with:
          jar-path: backend-jar-dir/*.jar
          profile: prod
          pid-file: spring-web.pid
          java-options: -Xmx1g -XX:+ExitOnOutOfMemoryError
          wait: "false"

      ##########################################################
      # Frontend Ingress
      ##########################################################

      - name: Cache Angular Build
        uses: actions/cache@v6
        with:
          path: frontend/.angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            angular-${{ runner.os }}-

      # Same inputs as ci.yml's frontend jobs, so this restores the
      # node_modules entry `main` CI saved.
      - name: Install frontend dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: frontend
          cache-node-modules: "true"

      - name: Build production frontend image
        run: |
          set -euo pipefail

          npm --workspace frontend exec -- ng build
          docker build --tag taskflow-dast-frontend frontend

      - *pull-zap-image

      - name: Wait for Spring Boot
        uses: ./.github/actions/wait-backend
        with:
          pid: ${{ steps.backend.outputs.pid }}

      - name: Start production frontend ingress
        run: |
          set -euo pipefail

          docker run --detach \
            --name taskflow-dast-frontend \
            --add-host backend:host-gateway \
            --mount type=bind,src="$PWD/frontend/nginx-upstream-server-ci.conf",dst=/etc/nginx/upstream-server.conf,readonly \
            --publish 4200:8080 \
            --read-only \
            --tmpfs /tmp:uid=10001,gid=10001 \
            --tmpfs /var/cache/nginx:uid=10001,gid=10001 \
            --tmpfs /var/run:uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            taskflow-dast-frontend

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4200/ > /dev/null && \
               curl --fail --silent http://localhost:4200/api/v1/catalog > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs taskflow-dast-frontend
          exit 1

      ##########################################################
      # OWASP ZAP Frontend Scan
      ##########################################################

      - name: Run OWASP ZAP frontend scan as a guest
        id: zap
        run: |
          set -euo pipefail

          if [[ "$ENABLE_AJAX_SPIDER" == "true" ]]; then
            spider_options=(-j -m 5 -T 15)
          else
            spider_options=(-T 10)
          fi

          # The image runs as `zap` (uid 1000), not the runner user, and writes
          # its reports into the mounted workspace.
          chmod a+w "$GITHUB_WORKSPACE"

          zap_exit=0
          docker run --rm \
            --network host \
            --volume "$GITHUB_WORKSPACE:/zap/wrk:rw" \
            "ghcr.io/zaproxy/zaproxy:${ZAP_VERSION}" \
            zap-full-scan.py \
              -t http://localhost:4200 \
              -c .zap/web-rules.tsv \
              -J zap-web-report.json \
              -w zap-web-report.md \
              -r zap-web-report.html \
              "${spider_options[@]}" \
            || zap_exit=$?

          # 0 = clean, 1 = FAIL alerts, 2 = WARN alerts only, 3 = scan error.
          # The report step decides what fails the job.
          echo "exit-code=$zap_exit" >> "$GITHUB_OUTPUT"

      - name: Report and gate the frontend scan
        if: ${{ !cancelled() }}
        uses: ./.github/actions/zap-report
        with:
          scan: web
          title: OWASP ZAP frontend scan (guest)
          target: http://localhost:4200
          rules-file: .zap/web-rules.tsv
          zap-exit-code: ${{ steps.zap.outputs.exit-code }}
          fail-on-findings: ${{ env.FAIL_ON_FINDINGS }}
          # Only API calls reach the backend, nginx serves the rest: 2,520 requests with the
          # AJAX spider, 646 without (BENCHMARKS §69).
          min-served: "200"

      - name: Teardown DAST runtime resources
        if: always()
        run: |
          echo "Cleaning up DAST runtime resources..."
          docker rm -f taskflow-dast-frontend 2>/dev/null || true
          if [[ -f spring-web.pid ]]; then
            backend_pid="$(<spring-web.pid)"
            if kill -0 "$backend_pid" 2>/dev/null; then
              kill -SIGTERM "$backend_pid" 2>/dev/null || true
            fi
          fi
