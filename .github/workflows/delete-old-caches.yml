name: Delete Old GitHub Actions Caches

on:
  schedule:
    # Fires Saturday 22:04 UTC to land execution ~Sunday 03:04 UTC (GitHub
    # scheduler lag ~5h; the day-of-week is shifted back one to preserve the
    # Sunday execution day).
    # Caches keyed on lockfiles are long-lived; a daily sweep bought nothing
    # over the 3-day retention cutoff.
    - cron: "4 22 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      actions: write

    # No checkout: this job only calls the GitHub API.
    steps:
      - name: Delete caches older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Using last_accessed_at instead of created_at ensures we don't delete actively used caches
          CUTOFF=$(date -u -d "3 days ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "Searching for caches last accessed before: $CUTOFF"

          # Offload filtering to jq for better performance
          ids="$(gh api --paginate "/repos/$REPO/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.last_accessed_at < \"$CUTOFF\") | .id")"

          if [[ -z "$ids" ]]; then
            echo "No caches found older than $CUTOFF"
            exit 0
          fi

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          deleted=0
          failures=0
          while IFS= read -r id; do
            if gh api --silent --method DELETE "/repos/$REPO/actions/caches/$id" 2> "$error_file"; then
              deleted=$((deleted + 1))
              continue
            fi
            error="$(<"$error_file")"
            # 404: GitHub's own eviction (or a PR cleanup) got there first.
            if [[ "$error" != *"(HTTP 404)"* ]]; then
              echo "::error::Failed to delete cache $id: $error"
              failures=$((failures + 1))
            fi
          done <<< "$ids"

          echo "Deleted $deleted cache(s) last accessed before $CUTOFF." | tee -a "$GITHUB_STEP_SUMMARY"
          if (( failures > 0 )); then
            echo "::error::$failures cache deletion(s) failed."
            exit 1
          fi
