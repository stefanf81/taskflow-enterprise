name: TaskFlow Push Docker Images

# =============================================================================
# Manually-triggered Docker image publication workflow.
#
# This workflow is deliberately separate from `.github/workflows/ci.yml` so
# that CI can build and scan images on every push/PR without ever publishing
# anything. Promoting an image to GHCR is an explicit operator action.
#
# What it does:
#   1. Builds the backend JAR and frontend production bundle (the same
#      artifacts the Dockerfiles expect in their build context).
#   2. Builds and pushes Docker images to a temporary scan tag on GHCR
#      (:<tag>-scan) with provenance and SBOM attestations enabled, release
#      labels (version, revision, created) and an index-level description.
#   3. In a job with read-only package access, scans the exact pushed digest
#      with Trivy (hard gate, exit-code: 1; see the scan step for which
#      findings fail it) and keeps the report in Trivy's cosign-vuln format.
#   4. In a separate job that holds the signing token and runs no build or
#      scan step: takes the digest from the build job, requires the scan job
#      to report that same digest, signs it with cosign (keyless: the
#      certificate names this workflow and the ref it was dispatched from) and
#      attaches a signed SLSA build provenance attestation and the scan report
#      as a signed vulnerability attestation, only if the scan passes (or
#      skip_scan is set, which publishes no scan attestation). The signature
#      carries a signed `scan=passed` or `scan=skipped` annotation.
#   5. Verifies the signature and the attestations, then promotes the digest
#      to :<tag> (and to :latest when dispatched from main) with the buildx
#      imagetools command and checks that the tags resolve to the scanned
#      digest (bit-for-bit identity).
#
# Caches: none. A release build restores nothing another workflow wrote (a
# poisoned Gradle, npm, Angular, BuildKit or Trivy cache would otherwise flow
# into a signed image or its scan) and saves nothing: `cache-mode: none` below
# makes the Actions cache service refuse both, and no step asks for a cache.
#
# Trigger:
#   workflow_dispatch only — this workflow is never started automatically.
#   Choose which component(s) to publish and an optional image tag (defaults
#   to the triggering git SHA).
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      components:
        description: Components to publish
        type: choice
        options:
          - backend
          - frontend
          - backend,frontend
        default: backend,frontend

      image_tag:
        description: Image tag (defaults to the git commit SHA)
        type: string
        default: ""

      skip_scan:
        description: Skip the Trivy gate (the cluster then refuses the image)
        type: boolean
        default: false

# Least privilege: the resolve/artifact jobs run Gradle and npm (lifecycle
# scripts, third-party plugins) and need no more than read access. The `push`
# job gets the package write token, the `scan` job (Trivy) read-only package
# access and the SARIF upload token; the signing (OIDC) and attestation tokens
# go to the `promote` job only, which runs no build, scan or third-party step
# besides the cosign installer.
permissions:
  contents: read

# No Actions cache reads or writes in any job (see "Caches" above). Enforced by
# the cache service, so it also covers actions that cache on their own.
cache-mode: none

# Repository-wide, not per ref: every run from main promotes `latest`,
# so they are serialized instead of racing on it. Never cancel a publication.
concurrency:
  group: taskflow-push-${{ github.workflow }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "26"
  REGISTRY: ghcr.io
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.2

defaults:
  run:
    shell: bash

jobs:
  ###########################################################
  # Resolve inputs into a matrix of components to publish
  ###########################################################

  resolve:
    name: Resolve Components
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      # No checkout: this job only reads workflow inputs.
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$COMMIT_SHA}"

          # The input is operator-supplied free text: validate it against Docker
          # tag syntax before it reaches any later step or registry call.
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag must match [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}"
            exit 1
          fi
          # `<tag>-scan` is the temporary staging tag; a final tag with that
          # suffix would collide with another run's staging tag.
          if [[ "$tag" == *-scan ]]; then
            echo "::error::image_tag must not end in '-scan' (reserved for staging)"
            exit 1
          fi
          # `latest` is moved by the promote job, and only for a run from main
          # (a run from any other ref is signed with that ref's identity, which
          # a verifier pinned to main rejects). Typing it here would bypass that.
          if [[ "$tag" == "latest" ]]; then
            echo "::error::image_tag must not be 'latest': runs from main move it on their own"
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build component matrix
        id: build_matrix
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          # Split the comma-separated input into a JSON array of objects
          # suitable for a matrix strategy.
          matrix=$(printf '%s\n' "$COMPONENTS" \
            | tr ',' '\n' \
            | grep -v '^$' \
            | jq -R '({"component": .})' \
            | jq -s -c '{include: .}')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $matrix"

  ###########################################################
  # Build artifacts (backend JAR + frontend dist)
  ###########################################################

  backend-artifact:
    name: Backend Artifact
    needs: resolve
    if: contains(needs.resolve.outputs.matrix, '"backend"')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cold build: no Gradle cache (see "Caches" above).
      - name: Build backend JAR
        uses: ./.github/actions/build-backend-jar
        with:
          java-version: ${{ env.JAVA_VERSION }}
          gradle-cache: disabled
          artifact-name: backend-jar
          retention-days: 7

  frontend-artifact:
    name: Frontend Artifact
    needs: resolve
    if: contains(needs.resolve.outputs.matrix, '"frontend"')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cold build: no npm, node_modules or Angular cache (see "Caches" above).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: frontend
          cache-node-modules: "false"

      - name: Build Production Bundle
        run: npx ng build

      - name: Upload Frontend Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          retention-days: 7

  ###########################################################
  # Build and push images to the staging tag
  ###########################################################

  push:
    name: Push Docker (${{ matrix.component }})
    needs:
      - resolve
      - backend-artifact
      - frontend-artifact

    # Run regardless of which artifact job was skipped (we only `need` them
    # to gate ordering — downloads are individually conditionally skipped).
    # `cancelled` too: a cancelled artifact job leaves no artifact to download.
    # `!cancelled()`, not `always()`: a cancelled run must not keep pushing.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

    runs-on: ubuntu-26.04
    timeout-minutes: 30

    # The GHCR write token, and nothing else: this job runs the image build and
    # Docker's actions. No signing token (see `promote`) and no scanner: Trivy
    # runs in `scan`, which can pull but not push.
    permissions:
      contents: read
      packages: write

    # One output per component: a matrix leg sets only its own.
    outputs:
      backend_digest: ${{ steps.pushed.outputs.backend_digest }}
      frontend_digest: ${{ steps.pushed.outputs.frontend_digest }}

    strategy:
      # fail-fast is deliberately false: backend and frontend images are
      # independent. A failure in one component should not cancel the other
      # component's push.
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      ##########################################################
      # GHCR uses lowercase owner. Compute image refs once here so
      # mixed/uppercase repository owners don't break docker push
      # or the Trivy image-ref resolution below.
      ##########################################################
      - name: Compute Image Refs
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.resolve.outputs.image_tag }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          # GHCR shows the description of an image index (attestations make
          # every pushed image an index) from the index annotation, not from
          # image labels.
          case "$COMPONENT" in
            backend) description="TaskFlow Spring Boot backend" ;;
            frontend) description="TaskFlow Angular frontend served by Nginx" ;;
            *) echo "::error::unknown component '$COMPONENT'"; exit 1 ;;
          esac
          {
            echo "owner=$owner"
            echo "tag=$TAG"
            echo "image=ghcr.io/${owner}/taskflow-${COMPONENT}"
            echo "description=$description"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      ##########################################################
      # Download build artifacts (only for the matching component)
      ##########################################################

      - name: Download Backend JAR
        if: matrix.component == 'backend'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-jar
          path: build/libs

      - name: Download Frontend Bundle
        if: matrix.component == 'frontend'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser

      ##########################################################
      # Docker setup
      ##########################################################

      - name: Set up Buildx
        uses: ./.github/actions/prepull-buildkit

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ##########################################################
      # Build and Push to temporary scan tag (:tag-scan) with
      # provenance and SBOM enabled. Single build pass avoids rebuilding.
      ##########################################################

      - name: Build Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component == 'backend' && '.' || 'frontend' }}
          file: ${{ matrix.component == 'backend' && 'Dockerfile' || 'frontend/Dockerfile' }}
          # Backend: the prod target of the single Dockerfile, built for the
          # amd64 cluster. The frontend Dockerfile has one final stage and no
          # platform requirement, so both inputs stay empty for it.
          target: ${{ matrix.component == 'backend' && 'prod' || '' }}
          platforms: ${{ matrix.component == 'backend' && 'linux/amd64' || '' }}

          push: true

          # The staging tag only gives the push a name; scanning and promotion
          # use the digest this step outputs, so a concurrent push to the same
          # tag cannot change what is scanned or promoted.
          tags: |
            ${{ steps.images.outputs.image }}:${{ steps.images.outputs.tag }}-scan

          # Release metadata. These override labels of the same key from the
          # Dockerfile and its base image (the backend base carries Ubuntu's
          # version and build date).
          labels: |
            org.opencontainers.image.version=${{ steps.images.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.images.outputs.created }}

          annotations: |
            index:org.opencontainers.image.description=${{ steps.images.outputs.description }}

          provenance: mode=max
          sbom: true

          # Cache-busting: force the runtime package refresh to run on every
          # build so the image always ships the latest OS security patches
          # (apt on the backend, apk on the frontend). Each Dockerfile consumes
          # its own arg; the unused one is ignored.
          build-args: |
            APK_BUST=${{ github.run_id }}-${{ github.run_attempt }}
            APT_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record Pushed Digest
        id: pushed
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build step returned no image digest ('$DIGEST')"
            exit 1
          fi
          echo "${COMPONENT}_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  ###########################################################
  # Scan the pushed digest (read-only package access)
  ###########################################################

  scan:
    name: Scan Docker (${{ matrix.component }})
    needs:
      - resolve
      - push

    # `failure` too: the components are independent, so one component's failed
    # build must not keep the other from being scanned. A leg whose build did
    # not finish finds no digest below and fails.
    # `!cancelled()`, not `always()`: a cancelled run must not keep scanning.
    if: ${{ !cancelled() && (needs.push.result == 'success' || needs.push.result == 'failure') }}

    runs-on: ubuntu-26.04
    timeout-minutes: 20

    # Trivy is a downloaded binary driven by a third-party action that fetches
    # its databases from a registry, so it runs away from the GHCR write token
    # (`push`) and the signing token (`promote`): it can pull the image and
    # write Code Scanning results, nothing else.
    permissions:
      contents: read
      packages: read
      security-events: write

    # One output per component: a matrix leg sets only its own, and only after
    # its scan gate, so `promote` never sees a digest that failed the scan.
    outputs:
      backend_digest: ${{ steps.scanned.outputs.backend_digest }}
      frontend_digest: ${{ steps.scanned.outputs.frontend_digest }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      # For the local install-trivy and upload-sarif actions.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Pushed Digest
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
          # Both, and picked below: an `a && x || y` expression would fall
          # through to the other component's digest when this one is empty.
          BACKEND_DIGEST: ${{ needs.push.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.push.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            backend) DIGEST="$BACKEND_DIGEST" ;;
            frontend) DIGEST="$FRONTEND_DIGEST" ;;
            *) echo "::error::unknown component '$COMPONENT'"; exit 1 ;;
          esac
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no pushed digest for ${COMPONENT}: its build did not succeed"
            exit 1
          fi
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=ghcr.io/${owner}/taskflow-${COMPONENT}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      # Read-only (`packages: read`); Trivy pulls the image with it. A plain
      # login rather than docker/login-action keeps one more action out of the
      # job that runs the scanner. With the CR_PAT fallback (docs/ci/
      # overview.md) this one can keep GITHUB_TOKEN.
      - name: Login to GHCR
        if: ${{ !inputs.skip_scan }}
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      ##########################################################
      # Hard-gate scan (exit-code: 1)
      #
      # Scans the pushed digest BEFORE promoting. If the scan fails,
      # `Record Scanned Digest` is skipped, so this component's `promote`
      # leg gets no digest and fails without signing or tagging anything.
      # Set `skip_scan: true` on workflow_dispatch only in exceptional
      # circumstances: such an image has no scan attestation, and the
      # cluster's admission policy refuses it.
      #
      # Which findings fail it: a HIGH or CRITICAL vulnerability that has a fix
      # (`ignore-unfixed`), or a HIGH/CRITICAL secret, as in ci.yml.
      # trivy-action drops `severity` for SARIF output unless
      # `limit-severities-for-sarif: true`, so both are set; the report step
      # below uses the same severities.
      #
      # No Trivy cache (`cache: false`): both databases are downloaded here,
      # into the workspace, and the report step below reuses them.
      ##########################################################

      - name: Install Trivy
        if: ${{ !inputs.skip_scan }}
        uses: ./.github/actions/install-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan Docker Image
        if: ${{ !inputs.skip_scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          # Installed by the step above (get.trivy.dev, setup-trivy's
          # download host, no longer resolves).
          skip-setup-trivy: true
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
          scan-type: image
          cache: false

          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: 1

      # The report `promote` attests: the same scan with the same filters, from
      # the databases the gate just downloaded, in Trivy's cosign-vuln format
      # (https://cosign.sigstore.dev/attestation/vuln/v1). Only after a pass.
      - name: Write Scan Report
        if: ${{ !inputs.skip_scan }}
        env:
          IMAGE_REF: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          trivy image \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --skip-db-update \
            --skip-java-db-update \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --pkg-types os,library \
            --exit-code 1 \
            --format cosign-vuln \
            --output "$RUNNER_TEMP/scan-report.json" \
            "$IMAGE_REF"

      - name: Upload Scan Report
        if: ${{ !inputs.skip_scan }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report-${{ matrix.component }}
          path: ${{ runner.temp }}/scan-report.json
          if-no-files-found: error
          retention-days: 7

      ##########################################################
      # Hand the digest to the `promote` job (only runs if all previous
      # steps succeeded — meaning the scan passed or was explicitly
      # skipped). Signing and promotion happen there, not here.
      ##########################################################

      - name: Record Scanned Digest
        id: scanned
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "${COMPONENT}_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results.sarif
          category: docker-${{ matrix.component }}

  ###########################################################
  # Sign, attest, verify and promote the scanned digest
  ###########################################################

  promote:
    name: Sign and Promote (${{ matrix.component }})
    # `push` for the digest that was built, `scan` for the digest that passed:
    # the first step below signs nothing unless the two are the same.
    needs:
      - resolve
      - push
      - scan

    # `failure` too: the components are independent, so one component's failed
    # build or scan must not keep the other from being published. A leg whose
    # own build or scan did not finish finds no digest below and fails.
    # `!cancelled()`, not `always()`: a cancelled run must not keep promoting.
    if: >-
      ${{ !cancelled()
      && (needs.push.result == 'success' || needs.push.result == 'failure')
      && (needs.scan.result == 'success' || needs.scan.result == 'failure') }}

    runs-on: ubuntu-26.04
    # Above the worst case of the retries below (cosign sign: 3 x 2 min + 1 min
    # of back-off; cosign verify: 3 x 1 min + 30 s; plus the two attestations
    # and their four checks), so a hanging Sigstore service ends in the step's
    # own error, not a timeout.
    timeout-minutes: 25

    # The only job that can sign. `id-token` lets it request the OIDC token
    # Sigstore exchanges for a short-lived signing certificate; `attestations`
    # stores the attestations on GitHub. It checks out no code and runs
    # nothing but `actions/download-artifact` (the scan report), the cosign
    # installer, cosign, `actions/attest`, `gh`, `jq` and `docker`
    # (workflow-policy.test.cjs keeps it that way).
    permissions:
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    env:
      # The identity in the signing certificate: this workflow file at the
      # dispatched ref. Verifiers pin `...@refs/heads/main`.
      IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      # Signed into the signature, so a verifier can require `scan=passed`.
      SCAN: ${{ inputs.skip_scan && 'skipped' || 'passed' }}
      # Predicate type of the scan attestation (Trivy's `cosign-vuln` format).
      SCAN_PREDICATE: https://cosign.sigstore.dev/attestation/vuln/v1

    steps:
      # No checkout: this job only acts on the digest the `push` job built,
      # and only once the `scan` job has reported that same digest.
      - name: Resolve Scanned Digest
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
          # Both, and picked below: an `a && x || y` expression would fall
          # through to the other component's digest when this one is empty.
          BACKEND_DIGEST: ${{ needs.push.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.push.outputs.frontend_digest }}
          BACKEND_SCANNED: ${{ needs.scan.outputs.backend_digest }}
          FRONTEND_SCANNED: ${{ needs.scan.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            backend) DIGEST="$BACKEND_DIGEST"; SCANNED="$BACKEND_SCANNED" ;;
            frontend) DIGEST="$FRONTEND_DIGEST"; SCANNED="$FRONTEND_SCANNED" ;;
            *) echo "::error::unknown component '$COMPONENT'"; exit 1 ;;
          esac
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no built digest for ${COMPONENT}: its build did not succeed"
            exit 1
          fi
          # The digest to sign comes from the build job. The scan job runs the
          # third-party scanner, so its outputs only confirm: were they the
          # source, a compromised scanner could name another digest in the
          # package (an older release, a staged image that failed its scan)
          # with a clean report for it, and this job would sign it, attest
          # provenance saying this run built it, and tag it, all with the
          # identity the cluster's admission policy trusts. With skip_scan the scan job still reports the
          # digest it was handed, so this holds for both values of SCAN.
          if [[ "$SCANNED" != "$DIGEST" ]]; then
            echo "::error::the scan job reported '${SCANNED:-nothing}' for ${COMPONENT}, not the built digest ${DIGEST}: its scan did not pass, or did not scan this build"
            exit 1
          fi
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=ghcr.io/${owner}/taskflow-${COMPONENT}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Download Scan Report
        if: ${{ !inputs.skip_scan }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scan-report-${{ matrix.component }}
          path: ${{ runner.temp }}/scan

      # Before anything is signed: the report must be Trivy's, name exactly
      # this digest, and list no finding (the gate's verdict, re-read from the
      # report rather than trusted from the job result).
      - name: Check Scan Report
        if: ${{ !inputs.skip_scan }}
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REPORT: ${{ runner.temp }}/scan/scan-report.json
        run: |
          set -euo pipefail
          if ! jq -e --arg ref "${IMAGE}@${DIGEST}" '
              (.scanner.uri | startswith("pkg:github/aquasecurity/trivy@"))
              and .scanner.result.ArtifactName == $ref
              and ([.scanner.result.Results[]? | (.Vulnerabilities // [])[], (.Secrets // [])[]] | length == 0)
            ' "$REPORT" > /dev/null; then
            echo "::error::the scan report is not a clean Trivy report for ${IMAGE}@${DIGEST}"
            exit 1
          fi
          echo "Scan report checked: $(jq -r '.scanner.uri' "$REPORT"), no findings"

      # cosign, `actions/attest` (push-to-registry) and `imagetools` read this
      # login. Not docker/login-action: this job runs no third-party action
      # besides the cosign installer. With the CR_PAT fallback (docs/ci/
      # overview.md), swap the token here as well as in the `push` job.
      - name: Login to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      ##########################################################
      # Sign and attest, before promotion, so a final tag never points
      # at an unsigned digest. Both act on the index digest: the
      # signature therefore covers the BuildKit provenance and SBOM
      # inside that index and every tag that later points at it.
      # Keyless: no key is stored. Signature and attestation are stored
      # in the same GHCR package, next to the image.
      #
      # Fail closed: there is no input to publish unsigned. Signing
      # depends on the public Sigstore services, so it is retried; if
      # they stay down, nothing is promoted and the run is re-dispatched
      # later.
      ##########################################################

      - name: Sign Image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cosign sign --yes --timeout 2m -a "scan=${SCAN}" "${IMAGE}@${DIGEST}"; then
              exit 0
            fi
            echo "::warning::cosign sign failed (attempt ${attempt} of 3)"
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 20))
            fi
          done
          echo "::error::could not sign ${IMAGE}@${DIGEST}; nothing was promoted"
          exit 1

      # Signed SLSA build provenance, stored on GitHub and pushed to GHCR
      # (`gh attestation verify`, admission controllers). No storage record:
      # those exist for organization-owned repositories only.
      - name: Attest Build Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # The Trivy report as a signed in-toto attestation, stored on GitHub and
      # pushed to GHCR like the provenance. The cluster's admission policy
      # requires it, so an image published with skip_scan (none) is refused.
      - name: Attest Scan Report
        if: ${{ !inputs.skip_scan }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: ${{ env.SCAN_PREDICATE }}
          predicate-path: ${{ runner.temp }}/scan/scan-report.json
          push-to-registry: true
          create-storage-record: false

      # After both writes to the package. Same identity and annotation as the
      # summary below tells operators to use. `-a` is what makes `cosign
      # verify` check the cosign signature: in bundle mode it accepts any
      # Sigstore bundle on the digest, and the attestations have the same
      # identity. Each attestation is checked twice: from the GitHub API (what
      # `gh attestation verify` reads by default) and from the registry (what
      # admission controllers read). `gh attestation verify` checks SLSA
      # provenance unless given another --predicate-type.
      - name: Verify Signature and Attestation
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The registry and the attestations API were written seconds ago.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep $((attempt * 10))
              fi
            done
            return 1
          }

          retry cosign verify "${IMAGE}@${DIGEST}" \
            --timeout 1m \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            -a "scan=${SCAN}" \
            > /dev/null

          # gh prints nothing on success when not attached to a terminal (its
          # status output is TTY-only; errors still print), so say it here.
          retry gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$REPOSITORY" \
            --cert-identity "$IDENTITY"
          echo "Attestation verified (GitHub API copy) for ${IMAGE}@${DIGEST}"

          retry gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$REPOSITORY" \
            --cert-identity "$IDENTITY" \
            --bundle-from-oci
          echo "Attestation verified (GHCR copy) for ${IMAGE}@${DIGEST}"

          if [[ "$SCAN" == "passed" ]]; then
            retry gh attestation verify "oci://${IMAGE}@${DIGEST}" \
              --repo "$REPOSITORY" \
              --cert-identity "$IDENTITY" \
              --predicate-type "$SCAN_PREDICATE"
            echo "Scan attestation verified (GitHub API copy) for ${IMAGE}@${DIGEST}"

            retry gh attestation verify "oci://${IMAGE}@${DIGEST}" \
              --repo "$REPOSITORY" \
              --cert-identity "$IDENTITY" \
              --predicate-type "$SCAN_PREDICATE" \
              --bundle-from-oci
            echo "Scan attestation verified (GHCR copy) for ${IMAGE}@${DIGEST}"
          fi

      ##########################################################
      # Promote (only runs if all previous steps succeeded — meaning
      # the digest is scanned or explicitly unscanned, signed, attested
      # and verified)
      # Tags the scanned digest on GHCR without rebuilding. With a
      # single index source the index is reused unchanged, so the final
      # tags carry the scanned digest; the check below fails the run
      # otherwise. `latest` moves only for a run dispatched from main:
      # the signature of any other run names its own ref, and a verifier
      # pinned to main would reject what `latest` points at.
      ##########################################################

      - name: Promote Image to Final Tags
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ needs.resolve.outputs.image_tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          published=("${IMAGE}:${TAG}")
          if [[ "$REF" == "refs/heads/main" ]]; then
            published+=("${IMAGE}:latest")
          else
            echo "::warning::dispatched from ${REF}, not main: 'latest' is not moved, and verifiers pinned to main reject this image"
          fi

          tag_args=()
          for ref in "${published[@]}"; do
            tag_args+=(--tag "$ref")
          done
          docker buildx imagetools create "${tag_args[@]}" "${IMAGE}@${DIGEST}"

          for ref in "${published[@]}"; do
            resolved="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [[ "$resolved" != "$DIGEST" ]]; then
              echo "::error::$ref resolves to $resolved, expected the scanned digest $DIGEST"
              exit 1
            fi
          done

          {
            echo "### Published ${IMAGE}"
            echo
            echo "- Digest: \`${DIGEST}\`"
            tags="$(printf ', `%s`' "${published[@]##*:}")"
            echo "- Tags: ${tags:2}"
            echo "- Deploy by digest: \`${IMAGE}@${DIGEST}\`"
            echo "- Signed by: \`${IDENTITY}\`"
            echo "- Scan: ${SCAN}"
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo
              echo "> **Not built from main** (\`${REF}\`): \`latest\` was not moved, and a verifier pinned to \`@refs/heads/main\` rejects this image."
            fi
            echo
            echo '```bash'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity ${IDENTITY} \\"
            echo "  --certificate-oidc-issuer ${OIDC_ISSUER} \\"
            echo "  -a scan=${SCAN}"
            echo
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} \\"
            echo "  --repo ${REPOSITORY} \\"
            echo "  --cert-identity ${IDENTITY}"
            if [[ "$SCAN" == "passed" ]]; then
              echo
              echo "gh attestation verify oci://${IMAGE}@${DIGEST} \\"
              echo "  --repo ${REPOSITORY} \\"
              echo "  --cert-identity ${IDENTITY} \\"
              echo "  --predicate-type ${SCAN_PREDICATE}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
