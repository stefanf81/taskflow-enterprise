name: TaskFlow Push Docker Images

# =============================================================================
# Manually-triggered Docker image publication workflow.
#
# This workflow is deliberately separate from `.github/workflows/ci.yml` so
# that CI can build and scan images on every push/PR without ever publishing
# anything. Promoting an image to GHCR is an explicit operator action.
#
# What it does:
#   1. Builds the backend JAR and frontend production bundle (the same
#      artifacts the Dockerfiles expect in their build context).
#   2. Builds and pushes Docker images to a temporary scan tag on GHCR
#      (:<tag>-scan) with provenance and SBOM attestations enabled.
#   3. Scans each image with Trivy (HIGH,CRITICAL — hard gate, exit-code: 1).
#   4. Promotes images to :<tag> and :latest using `docker buildx imagetools create`
#      only if the scan passes (or skip_scan is set), ensuring bit-for-bit identity.
#
# Trigger:
#   workflow_dispatch only — this workflow is never started automatically.
#   Choose which component(s) to publish and an optional image tag (defaults
#   to the triggering git SHA).
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      components:
        description: Components to publish
        type: choice
        options:
          - backend
          - frontend
          - backend,frontend
        default: backend,frontend

      image_tag:
        description: Image tag (defaults to the git commit SHA)
        type: string
        default: ""

      skip_scan:
        description: Skip the Trivy HIGH/CRITICAL gate before pushing
        type: boolean
        default: false

# Least privilege: the resolve/artifact jobs run Gradle and npm (lifecycle
# scripts, third-party plugins) and need no more than read access. Package and
# SARIF write tokens are granted to the `push` job only.
permissions:
  contents: read

concurrency:
  group: taskflow-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  TRIVY_VERSION: v0.75.0

defaults:
  run:
    shell: bash

jobs:
  ###########################################################
  # Resolve inputs into a matrix of components to publish
  ###########################################################

  resolve:
    name: Resolve Components
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      # No checkout: this job only reads workflow inputs.
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$COMMIT_SHA}"

          # The input is operator-supplied free text: validate it against Docker
          # tag syntax before it reaches any later step or registry call.
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag must match [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}"
            exit 1
          fi
          # `<tag>-scan` is the temporary staging tag; a final tag with that
          # suffix would collide with another run's staging tag.
          if [[ "$tag" == *-scan ]]; then
            echo "::error::image_tag must not end in '-scan' (reserved for staging)"
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build component matrix
        id: build_matrix
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          # Split the comma-separated input into a JSON array of objects
          # suitable for a matrix strategy.
          matrix=$(printf '%s\n' "$COMPONENTS" \
            | tr ',' '\n' \
            | grep -v '^$' \
            | jq -R '({"component": .})' \
            | jq -s -c '{include: .}')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $matrix"

  ###########################################################
  # Build artifacts (backend JAR + frontend dist)
  ###########################################################

  backend-artifact:
    name: Backend Artifact
    needs: resolve
    if: contains(needs.resolve.outputs.matrix, '"backend"')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Read-only: CI's `backend` job owns the Gradle cache writes; this manual
      # workflow only needs to consume the restored state.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: true

      - name: Build
        run: |
          ./gradlew \
            --parallel \
            --build-cache \
            assemble \
            --stacktrace

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: build/libs/*.jar
          compression-level: 0
          retention-days: 7

  frontend-artifact:
    name: Frontend Artifact
    needs: resolve
    if: contains(needs.resolve.outputs.matrix, '"frontend"')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shared/schemas/package-lock.json

      - name: Install Dependencies
        uses: ./.github/actions/npm-ci
        with:
          package-path: frontend

      - name: Cache Angular Build
        uses: actions/cache@v6
        with:
          path: frontend/.angular/cache
          # Same prefix as ci.yml so a publish run reuses CI's warm cache.
          key: angular-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'shared/schemas/package-lock.json') }}
          restore-keys: |
            angular-${{ runner.os }}-

      - name: Build Production Bundle
        run: npx ng build

      - name: Upload Frontend Bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          retention-days: 7

  ###########################################################
  # Build, scan, and push images
  ###########################################################

  push:
    name: Push Docker (${{ matrix.component }})
    needs:
      - resolve
      - backend-artifact
      - frontend-artifact

    # Run regardless of which artifact job was skipped (we only `need` them
    # to gate ordering — downloads are individually conditionally skipped).
    # `cancelled` too: a cancelled artifact job leaves no artifact to download.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')

    runs-on: ubuntu-26.04
    timeout-minutes: 30

    # GHCR push (login + buildx) and Code Scanning upload happen only here.
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      # fail-fast is deliberately false: backend and frontend images are
      # independent. A failure (e.g. a Trivy HIGH/CRITICAL finding) in one
      # component should not cancel the other component's push.
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      ##########################################################
      # GHCR uses lowercase owner. Compute image refs once here so
      # mixed/uppercase repository owners don't break docker push
      # or the Trivy image-ref resolution below.
      ##########################################################
      - name: Compute Image Refs
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${owner}/taskflow-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/taskflow-frontend" >> "$GITHUB_OUTPUT"
          # Trivy DB cache keys. `trivy_db_date` mirrors trivy-action's own
          # vulnerability-DB key (`cache-trivy-<date>`); the Java index DB is
          # refreshed on a 3-day window (trivy-java-db `updateInterval`), so
          # bucket its key the same way.
          echo "trivy_db_date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "trivy_java_db_bucket=$(( $(date -u +%s) / 259200 ))" >> "$GITHUB_OUTPUT"

      ##########################################################
      # Download build artifacts (only for the matching component)
      ##########################################################

      - name: Download Backend JAR
        if: matrix.component == 'backend'
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: build/libs

      - name: Download Frontend Bundle
        if: matrix.component == 'frontend'
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser

      ##########################################################
      # Docker setup
      ##########################################################

      - name: Set up Buildx
        uses: ./.github/actions/prepull-buildkit

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ##########################################################
      # Build and Push to temporary scan tag (:tag-scan) with
      # provenance and SBOM enabled. Single build pass avoids rebuilding.
      ##########################################################

      - name: Build Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.component == 'backend' && '.' || 'frontend' }}
          file: ${{ matrix.component == 'backend' && 'Dockerfile.x64' || 'frontend/Dockerfile' }}

          push: true

          tags: |
            ${{ matrix.component == 'backend' && steps.images.outputs.backend_image || steps.images.outputs.frontend_image }}:${{ steps.images.outputs.tag }}-scan

          cache-from: |
            type=gha,scope=${{ matrix.component }}-main
            type=gha,scope=${{ matrix.component }}-pr

          # ignore-error: a transient GHA cache-export blip must not fail a
          # publication run; the scan + promotion steps below are the gate.
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.component }}-${{ github.ref == 'refs/heads/main' && 'main' || 'pr' }},ignore-error=true

          provenance: true
          sbom: true

          # Cache-busting: force the runtime package refresh to run on every
          # build so the image always ships the latest OS security patches
          # (apt on the backend, apk on the frontend). Each Dockerfile consumes
          # its own arg; the unused one is ignored.
          build-args: |
            APK_BUST=${{ github.run_id }}-${{ github.run_attempt }}
            APT_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      ##########################################################
      # Trivy DB caches (restored here; the action's own cache is disabled)
      #
      # trivy-action caches the whole `.cache/trivy` tree under
      # `cache-trivy-<date>`. That archive can carry a stale `java-db/`, and
      # because the action restores it *after* any restore we do, it would
      # overwrite a fresh Java DB and force a ~930 MiB re-download. So the
      # action runs with `cache: false` and we restore in a controlled order:
      # the vulnerability DB first, then the Java index DB (backend only) on
      # top of it. See ci.yml for the full explanation.
      ##########################################################

      - name: Restore Trivy vulnerability DB cache
        if: ${{ !inputs.skip_scan }}
        id: trivy-vuln-db-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.images.outputs.trivy_db_date }}
          restore-keys: |
            cache-trivy-

      - name: Restore Trivy Java DB cache
        if: matrix.component == 'backend' && !inputs.skip_scan
        id: trivy-java-db-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy/java-db
          key: trivy-java-db-${{ env.TRIVY_VERSION }}-${{ steps.images.outputs.trivy_java_db_bucket }}
          restore-keys: |
            trivy-java-db-${{ env.TRIVY_VERSION }}-

      ##########################################################
      # Hard-gate scan (HIGH/CRITICAL, exit-code: 1)
      #
      # Scans the published scan image BEFORE promoting. If the scan
      # fails with exit-code: 1, the Promote step below is automatically
      # skipped. Set `skip_scan: true` on workflow_dispatch only in
      # exceptional circumstances.
      ##########################################################

      - name: Scan Docker Image
        if: ${{ !inputs.skip_scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ matrix.component == 'backend' && steps.images.outputs.backend_image || steps.images.outputs.frontend_image }}:${{ steps.images.outputs.tag }}-scan
          scan-type: image

          # DB caches are restored above; the action's own cache would clobber
          # the fresh Java DB — see the cache section note.
          cache: false

          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Save Trivy Java DB cache
        # Best effort: a concurrent job may have seeded the same bucket.
        continue-on-error: true
        if: always() && matrix.component == 'backend' && !inputs.skip_scan && steps.trivy-java-db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy/java-db
          key: trivy-java-db-${{ env.TRIVY_VERSION }}-${{ steps.images.outputs.trivy_java_db_bucket }}

      ##########################################################
      # Promote (only runs if all previous steps succeeded — meaning
      # the scan passed or was explicitly skipped)
      # Uses `docker buildx imagetools create` to instantly tag the
      # scanned artifact on GHCR without rebuilding.
      ##########################################################

      - name: Promote Image to Final Tags
        env:
          IMAGE: ${{ matrix.component == 'backend' && steps.images.outputs.backend_image || steps.images.outputs.frontend_image }}
          TAG: ${{ steps.images.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-scan"

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: ./.github/actions/upload-sarif
        with:
          path: trivy-results.sarif
          category: docker-${{ matrix.component }}
