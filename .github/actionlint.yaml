# actionlint configuration.
#
# ubuntu-26.04 is a GitHub-hosted runner label that predates actionlint's
# bundled runner-label database. Every workflow is pinned to it, so registering
# it here keeps `actionlint` green without waiting for an actionlint release.
# Remove this entry once actionlint knows the label natively.
self-hosted-runner:
  labels:
    - ubuntu-26.04

# `cache-mode` (GitHub Actions workflow key, generally available since
# 2026-09-10) postdates actionlint 1.7.12's workflow schema, which reports it as
# an unknown key. Only the publish workflow sets it. Remove this entry once
# actionlint knows the key.
paths:
  .github/workflows/pushdockerimage.yml:
    ignore:
      - 'unexpected key "cache-mode" for "workflow" section'
