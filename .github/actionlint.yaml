# actionlint configuration.
#
# ubuntu-26.04 is a GitHub-hosted runner label that predates actionlint's
# bundled runner-label database. Every workflow is pinned to it, so registering
# it here keeps `actionlint` green without waiting for an actionlint release.
# Remove this entry once actionlint knows the label natively.
self-hosted-runner:
  labels:
    - ubuntu-26.04
