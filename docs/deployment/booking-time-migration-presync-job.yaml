# Copy this Job to homelab/TF/gitops/apps/taskflow/ and replace the namespace,
# database host, and Secret reference with the production deployment values.
apiVersion: batch/v1
kind: Job
metadata:
  name: taskflow-booking-time-preparation
  namespace: taskflow
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prepare-booking-time
          image: postgres:18.6-alpine
          command: ["/bin/bash", "/scripts/prepare-booking-time-migration.sh", "--apply"]
          env:
            - name: PGHOST
              value: REPLACE_WITH_POSTGRES_SERVICE
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: taskflow
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_DATABASE_SECRET
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_DATABASE_SECRET
                  key: password
          volumeMounts:
            - name: migration-script
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: migration-script
          configMap:
            name: taskflow-booking-time-migration-script
            defaultMode: 0555
