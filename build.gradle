import org.gradle.api.tasks.PathSensitivity

// Plugin (buildscript) classpath hardening.
//
// Dependabot scans the Gradle plugin classpath (attributed to settings.gradle,
// resolved from plugins.gradle.org) in addition to the application runtime and
// flagged the Jackson families bundled transitively by two build plugins:
//   - org.springframework.boot.gradle.plugin:4.1.1 -> tools.jackson 3.1.5 (< 3.1.6)
//   - org.owasp.dependencycheck.gradle.plugin:13.0.0 -> com.fasterxml.jackson 2.22.1 (< 2.22.2)
//   - org.owasp.dependencycheck.gradle.plugin:13.0.0 -> org.jsoup 1.23.1 (< 1.23.2)
// These ship inside build tooling, not the shipped JAR, but still surface as
// Dependabot alerts (GHSA-q4xh-88c3-wmh7, GHSA-gx83-3vf8-gh7j,
// GHSA-wjgm-6hv5-3cvf, GHSA-65r4-943x-97jj). Force the patched releases here
// without disturbing the runtime pins in the dependency block below.
// jackson-annotations is excluded: its 2.22 line has no patch releases, and
// jackson-bom keeps it aligned.
buildscript {
	configurations.classpath {
		resolutionStrategy.eachDependency { details ->
			if (details.requested.group == 'tools.jackson.core' || details.requested.group == 'tools.jackson') {
				details.useVersion '3.2.3'
			} else if (details.requested.group.startsWith('com.fasterxml.jackson')
					&& details.requested.name != 'jackson-annotations') {
				details.useVersion '2.22.4'
			} else if (details.requested.group == 'org.jsoup') {
				details.useVersion '1.23.2'
			}
		}
	}
}

plugins {
	id 'java'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.dependency.check)
	id 'jacoco'
	alias(libs.plugins.versions)
	alias(libs.plugins.spotbugs)
	alias(libs.plugins.dependency.analysis)
}

dependencyAnalysis {
	issues {
		all {
			// This audit is intentionally limited to unused declarations.
			onUnusedDependencies {
				severity("warn")
				// Framework aggregators, runtime-loaded integrations, and explicit
				// transitive version pins cannot be proven as used from bytecode alone.
				exclude(libs.error.prone.annotations)
				exclude(libs.micrometer.prometheus)
				exclude(libs.micrometer.tracing.otel)
				exclude(libs.netty.codec.dns)
				exclude(libs.opentelemetry.semconv)
				exclude(libs.opentelemetry.sender.jdk)
				exclude(libs.spring.boot.starter.actuator)
				exclude(libs.spring.boot.starter.cache)
				exclude(libs.spring.boot.starter.data.jpa)
				exclude(libs.spring.boot.starter.data.redis)
				exclude(libs.spring.boot.starter.flyway)
				exclude(libs.spring.boot.starter.oauth2.resource.server)
				exclude(libs.spring.boot.starter.security)
				exclude(libs.spring.boot.starter.validation)
				exclude(libs.spring.boot.starter.web)
				exclude(libs.spring.modulith.core)
				exclude(libs.springdoc.webmvc.ui)
				exclude(libs.archunit.junit5)
				exclude(libs.spring.boot.starter.test)
				exclude(libs.spring.boot.starter.webmvc.test)
				exclude(libs.spring.modulith.test)
			}
			onUsedTransitiveDependencies { severity("ignore") }
			onIncorrectConfiguration { severity("ignore") }
			onCompileOnly { severity("ignore") }
			onRuntimeOnly { severity("ignore") }
			onUnusedAnnotationProcessors { severity("ignore") }
			onRedundantPlugins { severity("ignore") }
			onModuleStructure { severity("ignore") }
			onDuplicateClassWarnings { severity("ignore") }
		}
	}
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'


java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Disable the plain jar artifact. Only the Spring Boot executable jar (build by
// the `bootJar` task) is produced in build/libs/, so the Dockerfiles' wildcard
// `COPY build/libs/*.jar` always matches exactly one file instead of failing
// when a `-plain.jar` is also present (e.g. after `./gradlew build`).
jar {
	enabled = false
}
// Public Maven Central only — deliberately portable across machines and CI runners.
//
// Note on developer machines: Maven itself may be routed through a corporate
// Nexus mirror configured globally in ~/.m2/settings.xml (mirror id
// "Nexus_Mirror" with a wildcard <mirrorOf>*</mirrorOf> and an active "nexus"
// profile). Gradle does NOT read Maven settings, so those machine-local
// overrides never leak into this build — keep it that way: do not add custom
// repository URLs here or in an init script, or CI (which cannot reach the
// internal mirror) will break. Same convention as /.npmrc and /frontend/.npmrc.
repositories {
	mavenCentral()
}
dependencies {
	implementation platform(libs.spring.boot.dependencies)
	annotationProcessor platform(libs.spring.boot.dependencies)
	testImplementation platform(libs.spring.boot.dependencies)
	// The companion BOMs replace Spring's dependency-management plugin property
	// overrides while keeping every pinned dependency family internally aligned.
	implementation platform(libs.opentelemetry.bom)
	implementation platform(libs.prometheus.metrics.bom)
	implementation platform(libs.jackson2.bom)
	implementation platform(libs.jackson3.bom)
	implementation platform(libs.netty.bom)
	implementation platform(libs.log4j2.bom)
	constraints {
		implementation(libs.commons.lang3)
		implementation(libs.logback.classic)
		implementation(libs.slf4j.api)
		implementation(libs.slf4j.jul.to.slf4j)
		implementation(libs.slf4j.jcl.over.slf4j)
		testImplementation(libs.byte.buddy)
		testImplementation(libs.byte.buddy.agent)
	}
	// Spring Boot
	implementation libs.spring.boot.starter.data.jpa
	implementation libs.spring.boot.starter.validation
	implementation libs.spring.boot.starter.web
	implementation libs.spring.boot.starter.security
	implementation libs.spring.boot.starter.oauth2.resource.server
	implementation libs.spring.boot.starter.actuator
	implementation libs.spring.boot.starter.cache
	implementation libs.spring.boot.starter.data.redis
	// Explicit pins ensure dependency tooling and container scanners resolve the patched
	// Log4j API used by Spring Boot's log4j-to-slf4j bridge.
	implementation libs.log4j2.api
	implementation libs.log4j2.to.slf4j
	// Netty — explicit pins so dependency tooling and container scanners resolve
	// the patched DNS codec version directly.
	// Originally pinned for GHSA-mfg7-5gfp-c4w3 (DNS Record Decoder memory leak);
	// bumped to 4.2.19.Final for the latest patch release.
	implementation libs.netty.codec.dns
	// Tomcat embed — explicit pins so dependency tooling and container scanners
	// resolve the patched version directly. Spring Boot 4.1.1 ships the vulnerable
	// 11.0.24; 11.0.25 fixed CVE-2026-68525, CVE-2026-65905, CVE-2026-65182
	// (all CRITICAL); 11.0.26 is the latest patch. Keep core/el/websocket aligned;
	// drop once Spring Boot BOM ships >= the pinned version.
	implementation libs.tomcat.embed.core
	implementation libs.tomcat.embed.el
	implementation libs.tomcat.embed.websocket
	// Jackson — explicit pins so dependency tooling sees the correct versions
	// (BOM property overrides are not resolved consistently by all tooling).
	//   - jackson-databind 2.x / jackson-core 2.x: fixes 8 CVEs (HIGH: async parser bypass,
	//     MEDIUM: @JsonIgnore/@JsonView bypasses, PTV bypass, SSRF, etc.)
	//   - jackson-annotations 2.x: MUST be >= 2.22 for JsonApplyView used by Jackson 3.x
	//     backward-compat module. 2.22 also includes 2.22.1 CVE fixes.
	//   - jackson-databind 3.x: fixes CVE-2026-59889 (@JsonView bypass for @JsonUnwrapped)
	implementation libs.jackson2.databind
	implementation libs.jackson2.core
	implementation libs.jackson.annotations
	implementation libs.jackson3.databind
	implementation libs.hibernate.core
	// Hibernate 2nd-level cache with the Caffeine JCache region factory: test classpath only. L2 is
	// off in every profile; HibernateL2CacheBenchmarkTest and HibernateCacheSettingsTest use them.
	testImplementation libs.hibernate.jcache
	testImplementation libs.caffeine.jcache
	// Cache (Redis-backed via spring-boot-starter-data-redis; Caffeine was unused)
	// Modular monolith — Spring Modulith verifies package-based module boundaries
	// (repositories live under <module>/internal/ and are inaccessible from other
	// modules; cross-module communication goes through each module's public
	// service API or domain events). Verified by ModularityTest.java and
	// documented via auto-generated PlantUML/C4 diagrams.
	implementation libs.spring.modulith.core
	// Observability
	implementation libs.spring.boot.micrometer.tracing.opentelemetry
	implementation libs.micrometer.prometheus
	implementation libs.micrometer.tracing.otel
	// OTLP over the JDK's HttpClient instead of the default OkHttp sender, which was the only
	// path to okhttp, okio, kotlin-stdlib and jetbrains annotations (3.2 MB of jars and their CVE
	// feed). Both plug into the exporter's HttpSenderProvider SPI; Spring Boot references neither.
	implementation(libs.opentelemetry.otlp) {
		exclude group: 'io.opentelemetry', module: 'opentelemetry-exporter-sender-okhttp'
	}
	runtimeOnly libs.opentelemetry.sender.jdk
	// OpenAPI
	implementation libs.springdoc.webmvc.ui
	// Database migration
	implementation libs.spring.boot.starter.flyway
	implementation libs.flyway.postgresql
	// Pin flyway-core to match flyway-database-postgresql (the earlier BOM shipped 12.4.0).
	implementation libs.flyway.core
	// Runtime
	runtimeOnly libs.postgresql
	runtimeOnly libs.h2
	// Transitive dependency pins — override versions brought in by the Spring Boot BOM or
	// other transitive paths. Explicit declarations keep dependency tooling accurate.
	//   - HikariCP:           BOM ships 7.0.2; bump to 7.1.0.
	//   - Lettuce:            BOM ships 7.5.2.RELEASE; bump to 7.7.0.RELEASE.
	//   - semconv:            transitive via opentelemetry-exporter-otlp (BOM ships 1.41.1).
	//   - nimbus-jose-jwt:    transitive via spring-security-oauth2-resource-server; 10.9.1
	//                         is a security patch (BOM ships 10.9).
	//   - error_prone_*:      transitive annotation lib (BOM ships 2.49.0).
	implementation libs.hikari
	implementation libs.lettuce
	implementation libs.opentelemetry.semconv
	implementation libs.nimbus.jose.jwt
	implementation libs.error.prone.annotations
	// Testing
	testImplementation libs.spring.boot.starter.test
	testImplementation libs.spring.boot.starter.webmvc.test
	testImplementation libs.spring.security.test
	testImplementation libs.testcontainers.core
	testImplementation libs.testcontainers.junit.jupiter
	testImplementation libs.testcontainers.postgresql
	testImplementation libs.archunit.junit5
	// Spring Modulith test support — ApplicationModules.of().verify() and
	// @ApplicationModuleTest for isolated module bootstrapping.
	testImplementation libs.spring.modulith.test
	testRuntimeOnly libs.junit.platform.launcher
	// Static analysis
	spotbugsPlugins libs.findsecbugs.plugin
	spotbugsSlf4j libs.slf4j.simple
}
spotbugs {
	toolVersion = libs.versions.spotbugs.tool.get()
	ignoreFailures = false
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
	excludeFilter = file("spotbugs-exclude.xml")
}
// Build-time and test-only parts of Spring Modulith stay out of the executable JAR: ArchUnit (module
// verification in ModularityTest) and the annotation processor are never loaded at runtime (0 classes
// in a full startup and load run). The test classpath still has them.
configurations.named("runtimeClasspath") {
	exclude group: "com.tngtech.archunit"
	exclude group: "org.springframework.modulith", module: "spring-modulith-apt"
}

tasks.named("test") {
	useJUnitPlatform {
		// container-config guards run in containerConfigTest below, so their
		// file inputs never invalidate this (Spring-context) suite's cache.
		excludeTags 'benchmark', 'testcontainers', 'container-config'
	}
	// Each fork boots its own Spring contexts from a cold JVM (~36s for the
	// first one on a 4-vCPU CI runner), so fewer forks with C1-only JIT beat
	// more forks: measured unit suite 92s (3 forks) -> 64s (2 forks + C1).
	maxParallelForks = Math.min(2, Runtime.runtime.availableProcessors())
	jvmArgs "-XX:TieredStopAtLevel=1"
	environment "SPRING_SECURITY_PASSWORD", "admin-password"
	systemProperty "spring.cache.type", "simple"
	// Live @Scheduled jobs (outbox relay, reminders, retention, SSE heartbeat) would race with
	// Spring context tests that seed and inspect the same tables. Tests call the job methods
	// directly; production leaves app.schedulers.enabled at its default (true).
	systemProperty "app.schedulers.enabled", "false"
	// A per-context H2 database: the shared `tododb` URL let rows written by
	// one Spring context leak into another context in the same fork, so a
	// change in fork assignment made AppointmentControllerIntegrationTest fail.
	systemProperty "spring.datasource.url", 'jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1'
	// Without includes the JaCoCo agent instruments every class the fork
	// loads, i.e. all of Spring, Hibernate, Tomcat, H2..., while the report
	// covers only this project's classes. One cold Spring context, 2 paired
	// samples each: start 23.3/24.0 s -> 12.0/13.3 s, fork CPU 36.1/37.4 s ->
	// 25.2/27.8 s. Coverage figures are unchanged (same classes, same probes).
	jacoco {
		includes = ['com.example.*', 'db.migration.*']
	}
	finalizedBy(tasks.jacocoTestReport)
}

// File-reading guards on the container configuration (tagged container-config):
// the Dockerfile's targets, compose, nginx and the image workflows. Kept out of
// `test` so a Dockerfile-, compose-, nginx-, workflow- or BENCHMARKS.md-only
// edit re-runs these millisecond checks without re-running the Spring suite.
// The guards read these files directly, so they are declared as inputs; with
// --build-cache (CI pull requests) an edit to any of them must not be served
// FROM-CACHE. Dockerfile.x64 is listed because its absence is asserted.
tasks.register("containerConfigTest", Test) {
	group = "verification"
	description = "Runs the container-config guards (Dockerfile, compose, nginx, image workflows)."
	useJUnitPlatform {
		includeTags 'container-config'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	// Coverage comes from `test` only; this task's execution data fed no report.
	jacoco {
		enabled = false
	}
	inputs.files("Dockerfile", "Dockerfile.x64", "docker-compose.yml", "frontend/nginx.conf",
			".github/workflows/ci.yml", ".github/workflows/pushdockerimage.yml", "BENCHMARKS.md",
			"scripts/benchmark-cds-startup.sh", "scripts/benchmark-glibc-tuning.sh")
			.withPropertyName("containerConfigFiles")
			.withPathSensitivity(PathSensitivity.RELATIVE)
	testLogging {
		showExceptions = true
		showCauses = true
		showStackTraces = true
		events "passed", "skipped", "failed"
	}
}

// PostgreSQL parity suite. The default test task intentionally stays Docker-
// independent, while this explicit task runs the tagged Testcontainers tests
// against the production database engine and migration dialect.
tasks.register("testcontainersTest", Test) {
	group = "verification"
	description = "Runs PostgreSQL Testcontainers integration tests."
	useJUnitPlatform {
		includeTags 'testcontainers'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	maxParallelForks = 1
	// jacocoTestReport/-Verification read `test` only, so the agent here only
	// slowed every Spring context start (see the `test` task).
	jacoco {
		enabled = false
	}
	environment "SPRING_SECURITY_PASSWORD", "admin-password"
	systemProperty "spring.cache.type", "simple"
	testLogging {
		showExceptions = true
		showCauses = true
		showStackTraces = true
		events "passed", "skipped", "failed"
	}
}

tasks.register("benchmarkTest", Test) {
	group = "benchmark"
	description = "Runs benchmark tests (tagged @Tag('benchmark'))."
	useJUnitPlatform {
		includeTags 'benchmark'
	}
	testClassesDirs = sourceSets.test.output
	classpath = sourceSets.test.runtimeClasspath
	maxParallelForks = 1
	// No coverage for benchmarks: the agent would distort their timings.
	jacoco {
		enabled = false
	}
	environment "SPRING_SECURITY_PASSWORD", "admin-password"
	systemProperty "spring.cache.type", "simple"
	testLogging {
		showStandardStreams = true
		showExceptions = true
		showCauses = true
		showStackTraces = true
		events "passed", "skipped", "failed"
	}
}

jacoco {
	toolVersion = libs.versions.jacoco.get()
}
jacocoTestReport {
	dependsOn(tasks.test)
	reports {
		xml.required = true
		html.required = true
		csv.required = true
	}
}
jacocoTestCoverageVerification {
	dependsOn(tasks.test)
	violationRules {
		rule {
			limit {
				minimum = 0.80
			}
		}
	}
}
tasks.named("check") {
	dependsOn(
			tasks.jacocoTestCoverageVerification,
			tasks.named("containerConfigTest")
	)
}
dependencyCheck {
	failBuildOnCVSS = 7.0f
	formats = ['HTML', 'JSON']
}
tasks.named("dependencyUpdates") {
	// Gradle 10 will enforce stricter configuration-cache rules that break the
	// ben-manes plugin's internal task wiring. This is a dev-only task (never
	// runs in CI), so excluding it from config cache is safe.
	notCompatibleWithConfigurationCache()
	rejectVersionIf {
		if (it.currentVersion != null) {
			def currentMajor = it.currentVersion.tokenize('.')[0]
			def candidateMajor = it.candidate.version.tokenize('.')[0]
			if (currentMajor != candidateMajor) {
				return true
			}
		}
		def version = it.candidate.version.toLowerCase()
		["alpha", "beta", "rc", "cr", "m", "ea"].any {
			version.contains(it)
		}
	}
}
tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.incremental = true
	options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}
tasks.matching { it.name in ["spotbugsMain", "spotbugsTest"] }.configureEach {
	enabled = true
}
