plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.owasp.dependencycheck' version '13.0.0'
	id 'jacoco'
	id 'io.github.ben-manes.versions' version '0.61.0'
	id 'com.github.spotbugs' version '6.5.10'
}
group = 'com.example'
version = '0.0.1-SNAPSHOT'
ext {
	set('opentelemetry.version', '1.65.0')
	set('commons-lang3.version', '3.20.0')
	// Pin Logback 1.6.3 above Spring Boot's vulnerable 1.5.34 release to fix CVE-2026-13006
	// (ACE via conditional config file processing); this 1.6.x pin includes the 1.5.36+
	// hardening for disallowed references.
	set('logback.version', '1.6.3')
	// Pin Jackson 2.x BOM to 2.22.2 to fix:
	//   - CVE-2026-59888 (@JsonIgnore on Record bypassed with PropertyNamingStrategy)
	//   - jackson-core: async parser maxNumberLength bypass (fixed in 2.21.4)
	//   - CVE-2026-54512/13/14/15/16/17/18 (PTV bypass, @JsonView, SSRF, etc.)
	// Spring Boot 4.1.0 BOM ships 2.21.4 by default.
	set('jackson-2-bom.version', '2.22.2')
	// Pin Jackson 3.x BOM to 3.2.2 (latest) to fix CVE-2026-59889 (@JsonView bypass for
	// @JsonUnwrapped container properties on deserialization). Spring Boot 4.1.0 BOM
	// ships 3.1.4 which is vulnerable.
	set('jackson-bom.version', '3.2.2')
	// Pin Netty to 4.2.17.Final. Originally pinned to fix GHSA-mfg7-5gfp-c4w3
	// (Memory Leak in DNS Record Decoder via Malformed Domain Names); 4.2.17.Final
	// is the latest patch release. Spring Boot 4.1.0 BOM ships 4.2.15.Final which is vulnerable.
	set('netty.version', '4.2.17.Final')
	// Pin Log4j API and its SLF4J bridge above 2.25.4 to fix CVE-2026-49844
	// (malformed JSON output for non-finite MapMessage values).
	set('log4j2.version', '2.25.5')
}


java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Disable the plain jar artifact. Only the Spring Boot executable jar (build by
// the `bootJar` task) is produced in build/libs/, so the Dockerfiles' wildcard
// `COPY build/libs/*.jar` always matches exactly one file instead of failing
// when a `-plain.jar` is also present (e.g. after `./gradlew build`).
jar {
	enabled = false
}
repositories {
	mavenCentral()
}
dependencies {
	implementation platform("org.springframework.boot:spring-boot-dependencies:4.1.1")
	annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:4.1.1")
	testImplementation platform("org.springframework.boot:spring-boot-dependencies:4.1.1")
	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// Explicit pins ensure Dependabot and container scanners resolve the patched
	// Log4j API used by Spring Boot's log4j-to-slf4j bridge.
	implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
	implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.26.1'
	// Netty — explicit pins so Dependabot's Gradle parser sees the correct versions
	// (Dependabot does not resolve BOM property overrides set via ext.set()).
	// Originally pinned for GHSA-mfg7-5gfp-c4w3 (DNS Record Decoder memory leak);
	// bumped to 4.2.17.Final for the latest patch release.
	implementation platform('io.netty:netty-bom:4.2.17.Final')
	implementation 'io.netty:netty-codec-dns:4.2.17.Final'
	// Jackson — explicit pins so Dependabot's Gradle parser sees the correct versions
	// (Dependabot does not resolve BOM property overrides set via ext.set()).
	//   - jackson-databind 2.x / jackson-core 2.x: fixes 8 CVEs (HIGH: async parser bypass,
	//     MEDIUM: @JsonIgnore/@JsonView bypasses, PTV bypass, SSRF, etc.)
	//   - jackson-annotations 2.x: MUST be >= 2.22 for JsonApplyView used by Jackson 3.x
	//     backward-compat module. 2.22 also includes 2.22.1 CVE fixes.
	//   - jackson-databind 3.x: fixes CVE-2026-59889 (@JsonView bypass for @JsonUnwrapped)
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.22.2'
	implementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'
	implementation 'tools.jackson.core:jackson-databind:3.2.2'
	// Hibernate 2nd-level cache with Caffeine JCache region factory
	implementation 'org.hibernate.orm:hibernate-jcache:7.4.6.Final'
	implementation 'org.hibernate.orm:hibernate-core:7.4.6.Final'
	implementation 'com.github.ben-manes.caffeine:jcache:3.2.4'
	// Cache (Redis-backed via spring-boot-starter-data-redis; Caffeine was unused)
	// Modular monolith — Spring Modulith verifies package-based module boundaries
	// (repositories live under <module>/internal/ and are inaccessible from other
	// modules; cross-module communication goes through each module's public
	// service API or domain events). Verified by ModularityTest.java and
	// documented via auto-generated PlantUML/C4 diagrams.
	implementation 'org.springframework.modulith:spring-modulith-starter-core:2.1.1'
	// Observability
	implementation 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	// OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	// Database migration
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql:13.3.0'
	// Pin flyway-core to match flyway-database-postgresql (Spring Boot 4.1.0 BOM ships 12.4.0)
	implementation 'org.flywaydb:flyway-core:13.3.0'
	// Runtime
	runtimeOnly 'org.postgresql:postgresql:42.7.13'
	runtimeOnly 'com.h2database:h2:2.4.240'
	// Transitive dependency pins — override versions brought in by the Spring Boot BOM or
	// other transitive paths. Explicit pins keep Dependabot's Gradle parser honest (it does
	// not resolve BOM property overrides set via ext.set()).
	//   - HikariCP:           BOM ships 7.0.2; bump to 7.1.0.
	//   - Lettuce:            BOM ships 7.5.2.RELEASE; bump to 7.7.0.RELEASE.
	//   - semconv:            transitive via opentelemetry-exporter-otlp (BOM ships 1.41.1).
	//   - nimbus-jose-jwt:    transitive via spring-security-oauth2-resource-server; 10.9.1
	//                         is a security patch (BOM ships 10.9).
	//   - error_prone_*:      transitive annotation lib (BOM ships 2.49.0).
	//   - okio:               transitive (BOM ships 3.17.0).
	implementation 'com.zaxxer:HikariCP:7.1.0'
	implementation 'io.lettuce:lettuce-core:7.7.0.RELEASE'
	implementation 'io.opentelemetry.semconv:opentelemetry-semconv:1.43.0'
	implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'
	implementation 'com.google.errorprone:error_prone_annotations:2.50.0'
	implementation 'com.squareup.okio:okio:3.18.1'
	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
	// Spring Modulith test support — ApplicationModules.of().verify() and
	// @ApplicationModuleTest for isolated module bootstrapping.
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test:2.1.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
	// Static analysis
	spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
	spotbugsSlf4j 'org.slf4j:slf4j-simple:2.0.18'
}
spotbugs {
	toolVersion = '4.10.4'
	ignoreFailures = false
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
	excludeFilter = file("spotbugs-exclude.xml")
}
tasks.register("writeMainClasspath") {
	doLast {
		file("build/main-cp.txt").text = sourceSets.main.runtimeClasspath.asPath
	}
}
tasks.named("test") {
	useJUnitPlatform {
		excludeTags 'benchmark', 'testcontainers'
	}
	maxParallelForks = Math.max(1, (int) (Runtime.runtime.availableProcessors() * 0.75))
	environment "SPRING_SECURITY_PASSWORD", "admin-password"
	systemProperty "spring.cache.type", "simple"
	finalizedBy(tasks.jacocoTestReport)
}

// PostgreSQL parity suite. The default test task intentionally stays Docker-
// independent, while this explicit task runs the tagged Testcontainers tests
// against the production database engine and migration dialect.
tasks.register("testcontainersTest", Test) {
	group = "verification"
	description = "Runs PostgreSQL Testcontainers integration tests."
	useJUnitPlatform {
		includeTags 'testcontainers'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	maxParallelForks = 1
	environment "SPRING_SECURITY_PASSWORD", "admin-password"
	systemProperty "spring.cache.type", "simple"
	testLogging {
		showExceptions = true
		showCauses = true
		showStackTraces = true
		events "passed", "skipped", "failed"
	}
}

tasks.register("benchmarkTest", Test) {
	group = "benchmark"
	description = "Runs benchmark tests (tagged @Tag('benchmark'))."
	useJUnitPlatform {
		includeTags 'benchmark'
	}
	testClassesDirs = sourceSets.test.output
	classpath = sourceSets.test.runtimeClasspath
	maxParallelForks = 1
	environment "SPRING_SECURITY_PASSWORD", "admin-password"
	systemProperty "spring.cache.type", "simple"
	testLogging {
		showStandardStreams = true
		showExceptions = true
		showCauses = true
		showStackTraces = true
		events "passed", "skipped", "failed"
	}
}

jacoco {
	toolVersion = "0.8.15"
}
jacocoTestReport {
	dependsOn(tasks.test)
	reports {
		xml.required = true
		html.required = true
		csv.required = true
	}
}
jacocoTestCoverageVerification {
	dependsOn(tasks.test)
	violationRules {
		rule {
			limit {
				minimum = 0.80
			}
		}
	}
}
tasks.named("check") {
	dependsOn(
			tasks.jacocoTestCoverageVerification
	)
}
dependencyCheck {
	failBuildOnCVSS = 7.0f
	formats = ['HTML', 'JSON']
}
tasks.named("dependencyUpdates") {
	// Gradle 10 will enforce stricter configuration-cache rules that break the
	// ben-manes plugin's internal task wiring. This is a dev-only task (never
	// runs in CI), so excluding it from config cache is safe.
	notCompatibleWithConfigurationCache()
	rejectVersionIf {
		if (it.currentVersion != null) {
			def currentMajor = it.currentVersion.tokenize('.')[0]
			def candidateMajor = it.candidate.version.tokenize('.')[0]
			if (currentMajor != candidateMajor) {
				return true
			}
		}
		def version = it.candidate.version.toLowerCase()
		["alpha", "beta", "rc", "cr", "m", "ea"].any {
			version.contains(it)
		}
	}
}
tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.incremental = true
	options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}
tasks.matching { it.name in ["spotbugsMain", "spotbugsTest"] }.configureEach {
	enabled = true
}
