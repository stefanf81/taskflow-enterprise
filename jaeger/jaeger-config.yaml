# Jaeger v2 all-in-one configuration
# Based on https://github.com/jaegertracing/jaeger/blob/v2.22.0/cmd/jaeger/internal/all-in-one.yaml
#
# JAEGER_LISTEN_HOST env var controls which interface to bind to.
# In Docker, set JAEGER_LISTEN_HOST=0.0.0.0 so the container listens on all interfaces.
# Defaults to localhost for security when running bare-metal.

service:
  extensions: [jaeger_storage, jaeger_query, remote_sampling, healthcheckv2, expvar, zpages]
  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "${env:JAEGER_LISTEN_HOST:-localhost}"
                port: 8888
    logs:
      level: ${env:LOG_LEVEL:-info}

extensions:
  jaeger_query:
    storage:
      traces: some_storage
    # Jaeger 2.22 replaced `enable_mcp: true` with a presence-enabled `mcp` block
    # (MCP tools at /api/ai/mcp/ on the query port); the old key fails config
    # validation ("'app.AIConfig' has invalid keys: enable_mcp") and Jaeger exits.
    ai:
      mcp: {}
    http:
      endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:16686"

  jaeger_storage:
    backends:
      some_storage:
        memory:
          # The store is a ring buffer of whole traces with no byte limit, and the
          # container has 256M (compose also sets GOMEMLIMIT=200MiB). 100000, the
          # upstream all-in-one value, assumes an unlimited container: at ~10 KB per
          # Spring request trace that is ~1 GB. 20000 keeps the oldest traces out
          # instead of getting Jaeger OOM-killed during a k6 run.
          max_traces: 20000

  remote_sampling:
    file:
      path:
      default_sampling_probability: 1
      reload_interval: 1s
    http:
      endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:5778"
    grpc:
      endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:5779"

  healthcheckv2:
    use_v2: true
    http:
      endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:13133"

  expvar:
    endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:27777"

  zpages:
    endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:27778"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:4317"
      http:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:4318"

  jaeger:
    protocols:
      grpc:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:14250"
      thrift_http:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:14268"
      thrift_binary:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:6832"
      thrift_compact:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:6831"

  zipkin:
    endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:9411"

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage
