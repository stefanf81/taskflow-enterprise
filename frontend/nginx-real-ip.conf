# Intentionally empty: by default the TCP peer is the client.
#
# Behind a trusted ingress / load balancer, mount a replacement for this file
# (at /etc/nginx/real-ip.conf) containing the real ingress range ONLY, e.g.:
#
#   set_real_ip_from 10.42.0.0/16;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
#
# Do not use a broad range such as 10.0.0.0/8 unless every host in it is trusted:
# any peer inside the range could forge X-Forwarded-For and dodge rate limiting.
