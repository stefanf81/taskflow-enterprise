# Included inside `upstream backend_upstream` (nginx.conf). A deployment mounts its own file
# here, so the backend's address and the resolver for it live together (upstream-level
# `resolver` needs nginx 1.27.3+). Kubernetes variants: docs/deployment/README.md.
#
# Docker Compose provides the backend through its embedded DNS server (127.0.0.11). Resolve it
# at runtime so nginx picks up a replaced backend container without a restart; `resolve` also
# defers the lookup, so `nginx -t` passes during the image build, where no DNS is reachable.
resolver 127.0.0.11 ipv6=off valid=30s;
server backend:8080 resolve;
