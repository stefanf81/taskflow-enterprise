<div class="w-full px-4 sm:px-8 lg:px-16 pt-12">
  <app-page-header
    [icon]="icons.circleCheck"
    title="TaskFlow Owner Panel"
    subtitle="Secure Appointment Approval and Financial Analytics System"
  >
    <button
      type="button"
      appButton="danger"
      class="btn-logout"
      (click)="onLogout()"
      title="Log out of owner panel"
    >
      Log Out
    </button>
  </app-page-header>

  @if (errorMessage(); as message) {
    <app-alert tone="error" class="mb-6" dismissible (dismissed)="errorMessage.set(null)">
      {{ message }}
    </app-alert>
  }

  @if (successMessage(); as message) {
    <app-alert tone="success" class="mb-6" dismissible (dismissed)="successMessage.set(null)">
      {{ message }}
    </app-alert>
  }

  <!-- Every section has its own URL (/admin/appointments, /admin/calendar, …), so a reload and the
       Back button keep the owner where they were. A row of links on a phone, a sidebar from lg. -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    <nav aria-label="Owner sections" class="lg:col-span-3 xl:col-span-2 lg:sticky lg:top-6">
      <ul class="flex gap-2 overflow-x-auto pb-1 lg:flex-col lg:overflow-visible lg:pb-0">
        @for (section of sections; track section.path) {
          <li class="shrink-0 lg:shrink">
            <a
              [routerLink]="section.path"
              [attr.aria-current]="isCurrent(section.path) ? 'page' : null"
              [class]="
                isCurrent(section.path)
                  ? 'bg-accent/10 text-accent border-accent/30'
                  : 'text-zinc-400 hover:text-zinc-100 border-transparent'
              "
              class="admin-nav-link flex items-center gap-2.5 whitespace-nowrap rounded-xl border px-3.5 py-2.5 text-sm font-bold transition-colors"
            >
              <app-icon [icon]="section.icon" class="size-4 shrink-0" />
              {{ section.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <main class="lg:col-span-9 xl:col-span-10 min-w-0">
      <div class="card p-6">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
