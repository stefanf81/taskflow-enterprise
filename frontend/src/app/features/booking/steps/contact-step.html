<div
  id="step-panel-4"
  role="tabpanel"
  aria-labelledby="step-tab-4"
  class="space-y-4 animate-fadeIn"
>
  <form
    method="post"
    [formRoot]="store.bookingForm"
    (submit)="$event.preventDefault(); submitted.emit()"
    class="appointment-form space-y-4"
  >
    <div class="form-group flex flex-col gap-1.5">
      <label for="customerName" class="text-xs font-bold text-zinc-500 uppercase tracking-wider"
        >Your Full Name <span class="required">*</span></label
      >
      <input
        type="text"
        id="customerName"
        autocomplete="name"
        placeholder="e.g., John Doe"
        class="form-control"
        [formField]="store.bookingForm.customerName"
        [attr.aria-invalid]="store.nameError() ? 'true' : null"
        [attr.aria-describedby]="store.nameError() ? 'customerName-error' : null"
      />
      @if (store.nameError(); as nameProblem) {
        <span id="customerName-error" role="alert" class="text-rose-400 text-sm mt-1 block">
          {{ nameProblem }}
        </span>
      }
    </div>

    <div class="form-row grid gap-4 sm:grid-cols-2">
      <div class="form-group flex flex-col gap-1.5">
        <label for="customerEmail" class="text-xs font-bold text-zinc-500 uppercase tracking-wider"
          >Email Address <span class="required">*</span></label
        >
        <input
          type="email"
          id="customerEmail"
          autocomplete="email"
          placeholder="e.g., john@example.com"
          class="form-control"
          [formField]="store.bookingForm.customerEmail"
          [attr.aria-invalid]="store.visibleEmailError() ? 'true' : null"
          [attr.aria-describedby]="store.visibleEmailError() ? 'customerEmail-error' : null"
        />
        @if (store.visibleEmailError(); as emailProblem) {
          <span id="customerEmail-error" role="alert" class="text-rose-400 text-sm mt-1 block">
            {{ emailProblem }}
          </span>
        }
      </div>

      <div class="form-group flex flex-col gap-1.5">
        <label for="customerPhone" class="text-xs font-bold text-zinc-500 uppercase tracking-wider"
          >Phone Number <span class="required">*</span></label
        >
        <input
          type="tel"
          id="customerPhone"
          autocomplete="tel"
          placeholder="e.g., 555-0199"
          class="form-control"
          [formField]="store.bookingForm.customerPhone"
          [attr.aria-invalid]="store.phoneError() ? 'true' : null"
          [attr.aria-describedby]="store.phoneError() ? 'customerPhone-error' : null"
        />
        @if (store.phoneError(); as phoneProblem) {
          <span id="customerPhone-error" role="alert" class="text-rose-400 text-sm mt-1 block">
            {{ phoneProblem }}
          </span>
        }
      </div>
    </div>

    <!-- On a desktop the summary sits beside the steps (the wizard's sticky aside); on a phone it
         is shown here, above the confirm button. -->
    <div class="lg:hidden mt-6"><app-booking-summary /></div>

    <button type="submit" appButton class="login-btn w-full mt-6" [disabled]="store.isSubmitting()">
      {{ store.isSubmitting() ? 'Securing Slot...' : 'Confirm & Request Booking' }}
    </button>
  </form>
</div>
