# Upstream persistent connection pool to the Spring Boot backend
# Reuses idle TCP connections; it is not an active-request/concurrency limit.
upstream backend_upstream {
    zone backend_upstream 64k;  # Required for runtime DNS resolution (resolve)
    include /etc/nginx/upstream-server.conf;
    keepalive 64; # Keep up to 64 idle connections open to the backend container
    # Close idle upstream connections before Tomcat does (server.tomcat.keep-alive-timeout=60s):
    # reusing a connection the backend is closing at the same moment fails the request with a 502.
    keepalive_timeout 50s;
    # Matches server.tomcat.max-keep-alive-requests, so nginx retires connections first.
    keepalive_requests 10000;
}

# X-Forwarded-Proto as sent by a trusted ingress, used only when real-ip.conf trusts the peer
# (see `$forwarded_proto` in the server block). Anything but http/https falls back to $scheme.
map $http_x_forwarded_proto $trusted_forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

# RFC 9457 title for the JSON error body of `@api_unavailable`; $status is the original error.
map $status $api_problem_title {
    413     "Content Too Large";
    502     "Bad Gateway";
    504     "Gateway Timeout";
    default "Service Unavailable";
}

server {
    listen 8080;
    server_name localhost;

    # Vary value for the HTML shells: empty (header not sent) except for `/`, see `location = /`.
    set $shell_vary "";

    # Client-IP recovery behind a trusted load balancer / ingress. The file is empty
    # by default (the peer address is the client). Behind an ingress or kube-proxy
    # SNAT, $remote_addr is the ingress/node IP, so the backend would see one address
    # for every user and they would all share a single rate-limit bucket; mount a
    # file here with, for that deployment's real ingress range only:
    #     set_real_ip_from <ingress CIDR>;
    #     real_ip_header X-Forwarded-For;
    #     real_ip_recursive on;
    # Never list a broad range: any peer inside it could then spoof its address.
    include /etc/nginx/real-ip.conf;

    # Scheme reported to the backend. The image listens on plain HTTP, so $scheme is always
    # `http`; behind a TLS-terminating ingress that would override the ingress's `https` and
    # Spring would build http:// redirects and treat the request as insecure. The ingress's
    # X-Forwarded-Proto is used only when real-ip.conf trusted the peer: the realip module
    # replaces $remote_addr only for a peer inside set_real_ip_from, so with the default empty
    # real-ip.conf, or a request from any other peer, the client cannot choose the scheme.
    set $forwarded_proto $scheme;
    if ($realip_remote_addr != $remote_addr) {
        set $forwarded_proto $trusted_forwarded_proto;
    }

    # sendfile, tcp_nopush/tcp_nodelay, client keepalive and the temp file paths are set
    # once, at http level, in nginx-main.conf. Do NOT duplicate them here.

    # HTTP Security Headers, sent on every response. `merge` (nginx 1.29.3+) appends them to
    # the add_header lines of a location (its Cache-Control) instead of the default, where any
    # add_header in a location silently dropped all of these and each caching location had to
    # repeat the whole block.
    add_header_inherit merge;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/csp.conf;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Last-Modified "" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;

    # add_header appends, so a header the backend also sends would reach the client twice.
    # Spring Security writes X-Frame-Options, X-Content-Type-Options, Cross-Origin-Resource-Policy
    # and, on HTTPS requests, Strict-Transport-Security. Two CORP fields combine into
    # "same-origin, same-origin", which the Fetch spec's CORP check treats as no policy at all.
    # Drop the upstream copy of every header nginx sets above, so each appears exactly once.
    # Both proxy locations inherit this list: a location with its own proxy_hide_header loses it.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Permissions-Policy;

    # ──────────────────────────────────────────────────
    # Brotli compression (primary — preferred by all modern browsers)
    # 20–30% better ratios than gzip for JS/HTML/CSS.
    # ──────────────────────────────────────────────────
    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # ──────────────────────────────────────────────────
    # Gzip compression (fallback — for clients that do not accept br)
    # gzip_static serves the `.gz` sidecars the frontend Dockerfile precompresses
    # at level 9 next to every text asset (like brotli_static above for `.br`);
    # `gzip on` only handles responses without a sidecar, such as API JSON.
    # ──────────────────────────────────────────────────
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Root directory for static assets
    root /usr/share/nginx/html;
    index index.html;

    # `/` is the prerendered guest landing (index.html). A browser with a session cookie gets the
    # client-rendered shell instead, as before prerendering: the landing would paint the guest page
    # until /auth/me answered and the app redirected to the dashboard. The cookie is HttpOnly but
    # still reaches nginx; a stale one only costs the guest the client-rendered first paint. The
    # readable taskflow_session hint counts too: its access cookie may have expired, and the app
    # then renews the session before it routes.
    # The body therefore depends on the Cookie header: `Vary: Cookie` (set below, only for `/`)
    # keeps a shared or back/forward cache from handing one shell to the other kind of visitor.
    location = / {
        set $shell_vary Cookie;
        if ($cookie_access_token) {
            rewrite ^ /index.csr.html last;
        }
        if ($cookie_taskflow_session) {
            rewrite ^ /index.csr.html last;
        }
        rewrite ^ /index.html last;
    }

    # Every other client route gets the client-rendered shell (index.csr.html): serving the landing
    # HTML for /admin or /customer would paint the guest page before the router replaced it.
    location / {
        try_files $uri $uri/ /index.csr.html;
    }

    # Both shells name the hashed bundles of the current release, so the browser must revalidate
    # them on every load (ETag makes that a 304). Without a Cache-Control header browsers may reuse
    # them heuristically and request bundles a deploy has removed. try_files and `index` end here.
    location ~ ^/index(?:\.csr)?\.html$ {
        add_header Cache-Control "no-cache" always;
        # Empty (not sent) unless the request came in as `/`.
        add_header Vary $shell_vary always;
    }

    # Proxy API requests to the backend service
    # SSE is intentionally separate from the buffered JSON API proxy below.
    location = /api/v1/appointments/events {
        proxy_pass http://backend_upstream/api/v1/appointments/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not forward client-supplied forwarding metadata. Spring only trusts
        # the identity normalized by this proxy for rate limiting and redirects.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        gzip off;
        brotli off;
    }

    # `^~`: a matching prefix skips the regex locations, so the static-asset blocks below can
    # never capture an API path that ends in .js, .png and so on.
    location ^~ /api/ {
        proxy_pass http://backend_upstream/api/;

        # HTTP/1.1 upstream with the Connection header cleared so nginx reuses
        # the `keepalive 64` pool above. Do NOT use proxy_http_version 2 here:
        # nginx's upstream HTTP/2 speaks h2c with PRIOR KNOWLEDGE (sends the
        # HTTP/2 connection preface directly), but Tomcat's cleartext h2c only
        # negotiates via the HTTP/1.1 "Upgrade: h2c" handshake. The two are
        # incompatible, so every proxied /api/ request fails with 502. HTTP/1.1
        # keepalive delivers the same low-latency connection reuse safely.
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Clear Connection header so keepalive connections are reused
        proxy_set_header Accept-Encoding ""; # Prevent double-compression: Nginx compresses once for clients, backend sends raw
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not forward client-supplied forwarding metadata. Spring only trusts
        # the identity normalized by this proxy for rate limiting and redirects.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Phase limits, not a total request deadline: read_timeout bounds silence between reads.
        # Pool/query settings likewise do not establish a 9 s whole-request upper bound.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Bound JSON request bodies at the edge (all API request DTOs are < 4 KiB). This is a
        # body limit, not a header/URL limit; the 413 keeps its status and comes back as JSON.
        client_max_body_size 32k;
        error_page 413 @api_unavailable;

        # Buffer Tuning for proxying high-throughput JSON payloads
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;

        # nginx's own 502/503/504 (backend down, refusing or timing out) as JSON, not nginx's
        # HTML page. No `=`: the client keeps the original status. Errors the backend itself
        # returns pass through unchanged (proxy_intercept_errors is off).
        error_page 502 503 504 @api_unavailable;
    }

    # RFC 9457 problem details. `types {}` stops mime.types from deriving the Content-Type from
    # the request URI's extension. The server-level security headers (all `always`) still apply.
    location @api_unavailable {
        types { }
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"$api_problem_title","status":$status}\n';
    }

    # Cache configurations for static files (improves speed)
    # Hashed Angular bundles (js/css) use content-hash filenames via outputHashing:all,
    # so they can be cached immutable for 6 months (15552000s) without revalidation.
    # No `always` on these Cache-Control lines: with it, a 404 for a chunk that a rolling
    # deploy or rollback removed would also be cached immutable for 6 months, and the browser
    # would keep failing that import after the file is back. Without `always`, add_header only
    # applies to 200, 201, 204, 206, 301, 302, 303, 304, 307 and 308.
    location ~* \.(?:js|css)$ {
        access_log off;

        add_header Cache-Control "public, immutable, max-age=15552000";
    }

    # Fonts and images the stylesheets reference relatively (the Inter font, the background) are
    # emitted content-hashed into media/, so they get the same immutable lifetime as the bundles.
    # `^~` keeps the regex locations below from matching them.
    location ^~ /media/ {
        access_log off;

        add_header Cache-Control "public, immutable, max-age=15552000";
    }

    location ~* \.(?:ico|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        access_log off;

        # Assets from Angular's public/ directory (favicon) are not content-hashed.
        # Keep their cache lifetime short enough that replacements become visible.
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # No server-wide error_page: the image ships no 50x.html, so `error_page 50x /50x.html`
    # turned every nginx-generated 502/504 into a 404. Only /api/ maps them (to JSON) above.
}
