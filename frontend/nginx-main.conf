# ================================================================================
# TaskFlow Frontend — Main NGINX Process-Level Configuration
# ================================================================================
# This file replaces Alpine's default /etc/nginx/nginx.conf. The server block
# (frontend routing, API proxy, compression) lives in nginx.conf which is copied
# to /etc/nginx/http.d/default.conf — included automatically at the bottom.
# ================================================================================

# No `user` directive: the Dockerfile's `USER 10001:10001` starts the master
# process as the dedicated unprivileged user and the workers inherit it. With a
# non-root master nginx ignores the directive and logs a warning on every start.
# If the container is nevertheless started as root, docker-entrypoint.sh passes
# `user nginx-runtime;` on the command line so the workers still drop to 10001.

# Fixed worker count: `auto` counts the host's cores, not the container's CPU limit, so a
# 1-CPU container on a 12-thread host started 12 workers competing for one CPU's quota.
# Each worker handles thousands of connections; two cover the container limit (cpus: 1.0).
worker_processes 2;

# Docker Engine 29 / containerd 2.1.5 start containers (and Kubernetes pods on that
# containerd) with a soft open-file limit of 1024, which worker_connections alone
# would exhaust: a proxied request holds two descriptors, cached files more. The
# workers raise their own soft limit up to the inherited hard limit (no capability
# needed); with a lower hard limit nginx logs an alert and keeps serving.
worker_rlimit_nofile 8192;

# PID file must live on a writable tmpfs mount — the root filesystem is
# read-only. /var/run is mounted as tmpfs in docker-compose.yml.
pid /var/run/nginx.pid;

# Log errors to stderr so Docker captures them.
error_log /dev/stderr warn;

# --- Dynamic Modules ---
# load_module is a top-level directive (must be OUTSIDE any block).
# Alpine's nginx-mod-http-brotli package installs:
#   /etc/nginx/modules/10_http_brotli.conf
# which contains the load_module lines for the brotli filter and static
# modules. Alpine's packaged paths are relative to /var/lib/nginx, which is not
# traversable by the dedicated UID, so the Dockerfile rewrites them to absolute
# paths before this include is evaluated.
include /etc/nginx/modules/*.conf;

events {
    # Maximum simultaneous connections per worker.
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not disclose the nginx version in response headers.
    server_tokens off;

    # --- Core TCP/Socket Performance ---
    sendfile on;         # Zero-copy file transfers
    tcp_nopush on;       # Send headers and file in one packet
    tcp_nodelay on;      # Disable Nagle's algorithm — deliver small payloads instantly

    # Cache open descriptors, stat results and misses for the static files. try_files,
    # index and brotli_static/gzip_static otherwise stat or open several paths per
    # request (an SPA route: $uri, $uri/, then index.html.br). The assets are baked into
    # a read-only image, so a cached entry cannot go stale while the container runs.
    # Measured on nginx 1.30.4 at cpus 1.0: 12 -> 7 syscalls and +31% rps for `/`,
    # 8 -> 5 syscalls and +16% rps for a hashed bundle.
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_errors on;

    # Keepalive timeout for client connections.
    keepalive_timeout 65;

    # --- DNS Resolver ---
    # Docker's embedded DNS (127.0.0.11) is used at RUNTIME for upstream
    # server resolution. The `resolve` parameter on the upstream server
    # directive defers DNS lookups until runtime, so nginx -t passes
    # during image build (where no DNS server is available).
    resolver 127.0.0.11 ipv6=off valid=30s;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Log to stdout so Docker captures them. Buffered: one write per 4 KiB of lines
    # instead of one per request (+15-35% rps on logged locations at cpus 1.0). 4 KiB
    # is PIPE_BUF, so each write of whole lines stays atomic on the stdout pipe both
    # workers share; lines appear at most 1 s late and are flushed on the graceful
    # SIGQUIT shutdown.
    access_log /dev/stdout main buffer=4k flush=1s;

    # --- Temporary File Paths ---
    # All temp paths live on the /var/cache/nginx tmpfs mount (docker-compose).
    # A startup wrapper script creates the subdirectories at container launch
    # because tmpfs hides any directories baked into the image layer.
    # These are global http-level directives; do NOT duplicate them in
    # individual server blocks.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # --- Server Blocks ---
    # Alpine's nginx package uses /etc/nginx/http.d/ instead of conf.d/.
    # The Dockerfile copies our server block (nginx.conf) to:
    #   /etc/nginx/http.d/default.conf
    include /etc/nginx/http.d/*.conf;
}
