# ================================================================================
# TaskFlow Frontend — Main NGINX Process-Level Configuration
# ================================================================================
# This file replaces Alpine's default /etc/nginx/nginx.conf. The server block
# (frontend routing, API proxy, compression) lives in nginx.conf which is copied
# to /etc/nginx/http.d/default.conf — included automatically at the bottom.
# ================================================================================

# Run worker processes as the dedicated unprivileged user (UID 10001) created
# in the Dockerfile. The master process is already running as this user due
# to the `USER 10001` directive, so the pid file is writable.
user nginx-runtime;

# Auto-detect available CPU cores on the host/container.
worker_processes auto;

# PID file must live on a writable tmpfs mount — the root filesystem is
# read-only. /var/run is mounted as tmpfs in docker-compose.yml.
pid /var/run/nginx.pid;

# Log errors to stderr so Docker captures them.
error_log /dev/stderr warn;

# --- Dynamic Modules ---
# load_module is a top-level directive (must be OUTSIDE any block).
# Alpine's nginx-mod-http-brotli package installs:
#   /etc/nginx/modules/10_http_brotli.conf
# which contains the load_module lines for the brotli filter and static
# modules. Alpine's packaged paths are relative to /var/lib/nginx, which is not
# traversable by the dedicated UID, so the Dockerfile rewrites them to absolute
# paths before this include is evaluated.
include /etc/nginx/modules/*.conf;

events {
    # Maximum simultaneous connections per worker.
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Core TCP/Socket Performance ---
    sendfile on;         # Zero-copy file transfers
    tcp_nopush on;       # Send headers and file in one packet
    tcp_nodelay on;      # Disable Nagle's algorithm — deliver small payloads instantly

    # Keepalive timeout for client connections.
    keepalive_timeout 65;

    # --- DNS Resolver ---
    # Docker's embedded DNS (127.0.0.11) is used at RUNTIME for upstream
    # server resolution. The `resolve` parameter on the upstream server
    # directive defers DNS lookups until runtime, so nginx -t passes
    # during image build (where no DNS server is available).
    resolver 127.0.0.11 ipv6=off valid=30s;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Log to stdout so Docker captures them.
    access_log /dev/stdout main;

    # --- Temporary File Paths ---
    # All temp paths live on the /var/cache/nginx tmpfs mount (docker-compose).
    # A startup wrapper script creates the subdirectories at container launch
    # because tmpfs hides any directories baked into the image layer.
    # These are global http-level directives; do NOT duplicate them in
    # individual server blocks.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # --- Server Blocks ---
    # Alpine's nginx package uses /etc/nginx/http.d/ instead of conf.d/.
    # The Dockerfile copies our server block (nginx.conf) to:
    #   /etc/nginx/http.d/default.conf
    include /etc/nginx/http.d/*.conf;
}
