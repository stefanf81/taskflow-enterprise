[versions]
spring-boot = "4.1.1"
dependency-check = "13.0.0"
versions-plugin = "0.61.0"
spotbugs-plugin = "6.5.11"
spotbugs-tool = "4.10.4"
# The companion BOM keeps every OpenTelemetry module at this security-reviewed release.
opentelemetry = "1.65.0"
commons-lang3 = "3.20.0"
# Pin above Spring Boot's vulnerable 1.5.34 release; 1.6.x includes the
# hardening for disallowed conditional configuration references.
logback = "1.6.3"
# Jackson 2.x and 3.x remain separate families and must stay internally aligned.
jackson2 = "2.22.2"
jackson-annotations = "2.22"
jackson3 = "3.2.2"
netty = "4.2.17.Final"
log4j2 = "2.26.1"
# Tomcat embed — pinned above Spring Boot 4.1.1's vulnerable 11.0.24 release;
# 11.0.25 fixes CVE-2026-68525, CVE-2026-65905, CVE-2026-65182 (all CRITICAL).
tomcat = "11.0.25"
hibernate = "7.4.7.Final"
caffeine = "3.2.4"
spring-modulith = "2.1.1"
springdoc = "3.1.0"
flyway = "13.4.0"
postgresql = "42.7.13"
h2 = "2.4.240"
hikari = "7.1.0"
lettuce = "7.7.0.RELEASE"
semconv = "1.43.0"
nimbus-jose-jwt = "10.9.1"
error-prone-annotations = "2.50.0"
okio = "3.18.1"
archunit = "1.5.0"
junit-platform = "6.1.3"
findsecbugs = "1.14.0"
slf4j = "2.0.18"
jacoco = "0.8.15"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
log4j2-bom = { module = "org.apache.logging.log4j:log4j-bom", version.ref = "log4j2" }

spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }

commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
log4j2-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j2" }
log4j2-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version.ref = "log4j2" }
netty-codec-dns = { module = "io.netty:netty-codec-dns", version.ref = "netty" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson2-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson2" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
hibernate-jcache = { module = "org.hibernate.orm:hibernate-jcache", version.ref = "hibernate" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
caffeine-jcache = { module = "com.github.ben-manes.caffeine:jcache", version.ref = "caffeine" }
spring-modulith-core = { module = "org.springframework.modulith:spring-modulith-starter-core", version.ref = "spring-modulith" }
spring-modulith-test = { module = "org.springframework.modulith:spring-modulith-starter-test", version.ref = "spring-modulith" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
opentelemetry-semconv = { module = "io.opentelemetry.semconv:opentelemetry-semconv", version.ref = "semconv" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
error-prone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "error-prone-annotations" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependency-check" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versions-plugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
