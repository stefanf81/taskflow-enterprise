# STAGING ONLY: same validation logic as the Deny template, but audit-only.
# Kyverno 1.20+ CEL ValidatingPolicy. INTENTIONALLY scoped to example app namespaces
# using a namespaceSelector label; label MUST be admin-controlled, not self-assignable.
# This is the DENY-mode template. First validate examples/audit/* in staging.
# `pods/ephemeralcontainers` is matched so `kubectl debug` containers are checked too.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-app-images-to-private-ghcr
spec:
  validationActions: [Audit]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        security.example.internal/managed-images: 'true'
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods', 'pods/ephemeralcontainers']
  variables:
    - name: allImages
      expression: >-
        object.spec.containers.map(c, c.image) +
        object.spec.?initContainers.orValue([]).map(c, c.image) +
        object.spec.?ephemeralContainers.orValue([]).map(c, c.image)
  validations:
    - expression: >-
        variables.allImages.all(i,
          i.matches('^ghcr[.]io/example-org/applications/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'))
      message: 'Every workload image must be from the GHCR applications package prefix and use canonical digest-only reference (no tag)'
