# Production emergency block on new Pod admissions. Maintain this policy through a
# PROTECTED GitOps repository, not from the application repo or release signer.
# Add exact repository@sha256 references to revokedImages below (sample is harmless).
# Already-running Pods must be isolated/evicted separately during incident response.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-revoked-application-digests
spec:
  validationActions: [Audit]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        security.example.internal/managed-images: 'true'
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods', 'pods/ephemeralcontainers']
  variables:
    - name: allImages
      expression: >-
        object.spec.containers.map(c, c.image) +
        object.spec.?initContainers.orValue([]).map(c, c.image) +
        object.spec.?ephemeralContainers.orValue([]).map(c, c.image)
    - name: revokedImages
      expression: >-
        ['ghcr.io/example-org/applications/example@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee']
  validations:
    - expression: >-
        variables.allImages.all(image, !(image in variables.revokedImages))
      message: 'Digest is revoked by security: replacement or explicit incident response required'
