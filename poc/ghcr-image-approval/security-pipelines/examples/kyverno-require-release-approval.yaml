# PRODUCTION clusters only. Kyverno 1.20+ ImageValidatingPolicy (DENY template; validate
# examples/audit/kyverno-require-release-approval-audit.yaml in staging first).
#
# The pre-publish release authorization approves a COMMIT (SAST, SCA, tests, review). DAST
# can only test an image that already exists, so the release gate approves the exact DIGEST
# afterwards:
#   1. .github/workflows/application-release.yml publishes and signs the image (application signer).
#   2. Staging (which does NOT apply this policy) deploys that digest; DAST runs against it.
#   3. The independently operated release gate attests the digest with ITS OWN key:
#        cosign attest --yes --tlog-upload=false --key release-gate.key \
#          --type https://example.org/release-approval/v1 \
#          --predicate release-approval.json ghcr.io/example-org/applications/myapp@sha256:...
#      (see examples/release-approval-predicate.json.example)
#   4. Production admits the digest only with that gate-signed approval.
# Applies to EVERY image under applications/: the gate's record must name a repository on the
# organisation's Git host, and the same repository and commit as the signed build record.
# Avoid a hard time-based expiration on every Pod restart; instead enforce a separately
# administered emergency revocation denylist on every new admission (see revocation example).
# Removing an attestation alone does NOT evict already running Pods.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-release-gate-approval
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods', 'pods/ephemeralcontainers']
  matchImageReferences:
    - glob: 'ghcr.io/example-org/applications/*'
  validationConfigurations:
    mutateDigest: false
    required: true
    verifyDigest: true
  credentials:
    secrets:
      - ghcr-kyverno-pull
  variables:
    - name: otherAppImages
      expression: >-
        (object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([]))
          .map(c, c.image)
          .filter(i, i.startsWith('ghcr.io/example-org/applications/'))
  attestors:
    - name: releaseGate
      cosign:
        key:
          data: |
            -----BEGIN PUBLIC KEY-----
            REPLACE_WITH_RELEASE_GATE_PUBLIC_KEY
            -----END PUBLIC KEY-----
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
    - name: appSigner
      cosign:
        key:
          data: |
            -----BEGIN PUBLIC KEY-----
            REPLACE_WITH_APPLICATION_SIGNING_PUBLIC_KEY
            -----END PUBLIC KEY-----
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  attestations:
    - name: releaseApproval
      intoto:
        type: https://example.org/release-approval/v1
    - name: buildRecord
      intoto:
        type: https://example.org/github-actions-build-record/v1
  validations:
    - expression: >-
        images.containers.all(image,
          verifyAttestationSignatures(image, attestations.releaseApproval, [attestors.releaseGate]) > 0 &&
          verifyAttestationSignatures(image, attestations.buildRecord, [attestors.appSigner]) > 0 &&
          extractPayload(image, attestations.releaseApproval).predicate.schema == 'https://example.org/release-approval/v1' &&
          extractPayload(image, attestations.releaseApproval).predicate.issuer == 'organization-protected-release-gate' &&
          extractPayload(image, attestations.releaseApproval).predicate.decision == 'APPROVED' &&
          extractPayload(image, attestations.releaseApproval).predicate.image == image &&
          extractPayload(image, attestations.releaseApproval).predicate.repository.matches('^https://github[.]com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+[.]git$') &&
          extractPayload(image, attestations.releaseApproval).predicate.checks.dast == 'PASS' &&
          extractPayload(image, attestations.releaseApproval).predicate.checks['staging-smoke'] == 'PASS' &&
          extractPayload(image, attestations.buildRecord).predicate.image == image &&
          extractPayload(image, attestations.buildRecord).predicate.gitCommit == extractPayload(image, attestations.releaseApproval).predicate.commit &&
          extractPayload(image, attestations.buildRecord).predicate.sourceRepository == extractPayload(image, attestations.releaseApproval).predicate.repository)
      message: 'Production requires a signed release approval and matching signed build claims for the same digest and source commit'
    - expression: >-
        variables.otherAppImages.all(image,
          verifyAttestationSignatures(image, attestations.releaseApproval, [attestors.releaseGate]) > 0 &&
          verifyAttestationSignatures(image, attestations.buildRecord, [attestors.appSigner]) > 0 &&
          extractPayload(image, attestations.releaseApproval).predicate.schema == 'https://example.org/release-approval/v1' &&
          extractPayload(image, attestations.releaseApproval).predicate.issuer == 'organization-protected-release-gate' &&
          extractPayload(image, attestations.releaseApproval).predicate.decision == 'APPROVED' &&
          extractPayload(image, attestations.releaseApproval).predicate.image == image &&
          extractPayload(image, attestations.releaseApproval).predicate.repository.matches('^https://github[.]com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+[.]git$') &&
          extractPayload(image, attestations.releaseApproval).predicate.checks.dast == 'PASS' &&
          extractPayload(image, attestations.releaseApproval).predicate.checks['staging-smoke'] == 'PASS' &&
          extractPayload(image, attestations.buildRecord).predicate.image == image &&
          extractPayload(image, attestations.buildRecord).predicate.gitCommit == extractPayload(image, attestations.releaseApproval).predicate.commit &&
          extractPayload(image, attestations.buildRecord).predicate.sourceRepository == extractPayload(image, attestations.releaseApproval).predicate.repository)
      message: 'Init/ephemeral container images require matching release and build attestations'
