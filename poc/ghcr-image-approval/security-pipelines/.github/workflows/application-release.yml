name: GHCR - protected application release

# Keep this workflow in the CENTRAL security repository (not the application repo).
# Dispatch an allowlisted application (policy/applications.json) and an exact source commit;
# an independent signed release gate must authorize that commit.
#
# Every action is pinned to a full commit SHA (tag in the trailing comment). Update pins
# deliberately (e.g. Renovate/Dependabot PRs reviewed by CODEOWNERS); tests reject tag pins.
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Application name from policy/applications.json (GHCR package basename)
        type: string
        required: true
      app_commit:
        description: Full SHA-1 of the application main HEAD (40 lowercase hex digits)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ghcr-app-${{ inputs.app_name }}
  cancel-in-progress: false

env:
  APP_NAME: ${{ inputs.app_name }}
  APP_COMMIT: ${{ inputs.app_commit }}
  GHCR_HOST: ghcr.io
  GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
  APP_CANDIDATE_REPO: ghcr.io/${{ vars.GHCR_NAMESPACE }}/application-candidates/${{ inputs.app_name }}
  APP_RELEASE_REPO: ghcr.io/${{ vars.GHCR_NAMESPACE }}/applications/${{ inputs.app_name }}
  APPROVED_PREFIX: ghcr.io/${{ vars.GHCR_NAMESPACE }}/approved/
  APPROVAL_PREDICATE_TYPE: https://example.org/ghcr-base-approval/v1
  COSIGN_OFFLINE_VERIFY: --insecure-ignore-tlog=true
  BUILD_RECORD_PREDICATE_TYPE: https://example.org/github-actions-build-record/v1
  RELEASE_GATE_URL: ${{ vars.RELEASE_GATE_URL }}
  RELEASE_GATE_ISSUER: ${{ vars.RELEASE_GATE_ISSUER }}
  RELEASE_GATE_SCHEMA: ${{ vars.RELEASE_GATE_SCHEMA }}
  RELEASE_REQUIRED_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}

jobs:
  # The ONLY job holding APPLICATION_READ_TOKEN: resolves the allowlisted app, checks the
  # commit is the app's main HEAD, verifies the release gate and hands the exact source on
  # as a hash-pinned `git archive`.
  authorize:
    environment: application-source-read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha256: ${{ steps.source.outputs.sha256 }}
      commit_epoch: ${{ steps.source.outputs.commit_epoch }}
      commit_iso: ${{ steps.source.outputs.commit_iso }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact SHA-256-pinned security tools (api)
        shell: bash
        run: python3 -I ci/install_verified_tools.py --kind api
      - name: Resolve application from the protected allowlist
        id: app
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          bash ci/require_ghcr_config.sh app
          python3 -I ci/app_config.py --name "$APP_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Verify source HEAD and external release-gate signature
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APPLICATION_READ_TOKEN }}
          GATE_PUBLIC_KEY_B64: ${{ secrets.RELEASE_GATE_PUBKEY_B64 }}
          APP_SOURCE_REPO: ${{ steps.app.outputs.source_repo }}
        run: |
          set -euo pipefail
          [[ "$(command -v gh)" == "$VERIFIED_TOOLS_DIR/gh" ]]
          # Captured first (PoC fix): a failed API call (expired token, 401, network) stops here
          # with gh's own error instead of being reported as the wrong commit.
          main_head="$(gh api "repos/$APP_SOURCE_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$main_head" = "$APP_COMMIT" || {
            echo "Requested commit is not the exact protected main HEAD ($APP_SOURCE_REPO main is $main_head)"; exit 1;
          }
          umask 077
          printf '%s' "$GATE_PUBLIC_KEY_B64" | base64 -d > "$RUNNER_TEMP/release-gate.pub"
          mkdir -p release-evidence
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-filesize 1048576 \
            -H 'Cache-Control: no-cache' --output release-evidence/grant.json \
            "$RELEASE_GATE_URL/$APP_COMMIT"
          python3 -I scripts/verify_release_authorization.py \
            --envelope release-evidence/grant.json \
            --public-key "$RUNNER_TEMP/release-gate.pub" \
            --expected-commit "$APP_COMMIT" \
            --expected-repository "https://github.com/$APP_SOURCE_REPO.git" \
            --expected-schema "$RELEASE_GATE_SCHEMA" \
            --expected-issuer "$RELEASE_GATE_ISSUER" \
            --required-checks "$RELEASE_REQUIRED_CHECKS" \
            --max-issued-age-minutes 10
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.app.outputs.source_repo }}
          ref: ${{ inputs.app_commit }}
          path: application
          token: ${{ secrets.APPLICATION_READ_TOKEN }}
          persist-credentials: false
      - name: Archive the exact authorized source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          python3 -I ci/source_archive.py create --repo application --commit "$APP_COMMIT" \
            --output source/source.tar > source/source.json
          for key in sha256 commit_epoch commit_iso; do
            echo "$key=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' source/source.json "$key")" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: source/source.tar
          if-no-files-found: error
          retention-days: 7

  compile:
    needs: authorize
    strategy:
      fail-fast: true
      matrix:
        worker: [a, b]
    runs-on: ubuntu-24.04
    # No environment and no secrets: this job runs the application's own (untrusted) build.
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source
      - name: Build application independently with no registry/signing privileges
        env:
          CI_SKIP_TESTS: ${{ matrix.worker == 'b' && '1' || '0' }}
          SOURCE_SHA256: ${{ needs.authorize.outputs.source_sha256 }}
          SOURCE_DATE_EPOCH: ${{ needs.authorize.outputs.commit_epoch }}
          BUILD_OUTPUT_TIMESTAMP: ${{ needs.authorize.outputs.commit_iso }}
        run: bash ci/application_pipeline.sh build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-${{ matrix.worker }}
          path: |
            outputs.tar
            manifest.json
          if-no-files-found: error
          retention-days: 7

  image_build:
    needs: [authorize, compile]
    strategy:
      fail-fast: true
      matrix:
        worker: [a, b]
    runs-on: ubuntu-24.04
    environment: ghcr-read-only
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact SHA-256-pinned security tools (image-build)
        shell: bash
        run: python3 -I ci/install_verified_tools.py --kind image-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-${{ matrix.worker }}
          path: compiled
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.worker == 'a' && 'compiled-b' || 'compiled-a' }}
          path: other
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          # Both builders must run the same Docker/BuildKit for reproducible image configs.
          version: v29.9.3
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Verify approved bases and reproducibly build image
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ github.token }}
          APPROVAL_PUBKEY_B64: ${{ secrets.APPROVAL_PUBKEY_B64 }}
          SOURCE_SHA256: ${{ needs.authorize.outputs.source_sha256 }}
          SOURCE_DATE_EPOCH: ${{ needs.authorize.outputs.commit_epoch }}
        run: |
          set -euo pipefail
          umask 077
          bash ci/require_tools.sh image-build
          printf '%s' "$APPROVAL_PUBKEY_B64" | base64 -d > "$RUNNER_TEMP/base-approval.pub"
          printf '%s' "$GHCR_PASS" | docker login "$GHCR_HOST" --username "$GHCR_USER" --password-stdin
          APPROVAL_PUBKEY="$RUNNER_TEMP/base-approval.pub" bash ci/application_pipeline.sh image
      - name: GitHub-signed provenance for the image archive, its config digest and base lists
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            application-image.tar
            image-evidence/config-digest.txt
            image-evidence/base-images.txt
            image-evidence/final-base.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-identity-${{ matrix.worker }}
          path: image-evidence/config-digest.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.worker }}
          path: |
            application-image.tar
            application-image.tar.sha256
            image-evidence/config-digest.txt
            image-evidence/image-id.txt
            image-evidence/base-images.txt
            image-evidence/final-base.txt
            image-evidence/builder-versions.txt
          if-no-files-found: error
          retention-days: 7

  # READ-ONLY: everything that parses the untrusted image (archive reader, layer analysis,
  # Syft, Grype) runs here without a GHCR write token and without a Docker daemon.
  scan:
    needs: [authorize, image_build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ghcr-read-only
    permissions:
      contents: read
      attestations: read
      packages: read
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact SHA-256-pinned security tools (scan)
        shell: bash
        run: python3 -I ci/install_verified_tools.py --kind scan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-a
          path: image-a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-b
          path: image-b
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-a
          path: compiled-a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-b
          path: compiled-b
      - name: Verify GitHub attestations, compare builds and scan (no registry writes)
        id: decision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ github.token }}
          APPROVAL_PUBKEY_B64: ${{ secrets.APPROVAL_PUBKEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          bash ci/require_tools.sh scan
          printf '%s' "$APPROVAL_PUBKEY_B64" | base64 -d > "$RUNNER_TEMP/approval.pub"
          printf '%s' "$GHCR_PASS" | crane auth login "$GHCR_HOST" --username "$GHCR_USER" --password-stdin
          rc=0
          APPROVAL_PUBKEY="$RUNNER_TEMP/approval.pub" bash ci/application_pipeline.sh scan || rc=$?
          # Summarise even a BLOCK: the reproducible release digest is what an image_ref exception names.
          if [[ -f publish-evidence/vulnerability-decision.json ]]; then
            {
              echo "### Candidate $(jq -r .decision publish-evidence/vulnerability-decision.json)"
              echo "Release digest (for image_ref exceptions): $(jq -r .release_ref publish-evidence/vulnerability-decision.json)"
              echo 'Blocking findings:'
              jq -r '(.critical + .unknown)[]? | "- **\(.id)** (\(.severity)): \(.package) \(.package_version)"' publish-evidence/vulnerability-decision.json
              echo 'High findings requiring review:'
              jq -r '.high[]? | "- **\(.id)**: \(.package) \(.package_version)"' publish-evidence/vulnerability-decision.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          [[ "$rc" -eq 0 ]] || exit "$rc"
          decision="$(jq -r .decision publish-evidence/vulnerability-decision.json)"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          test "$decision" = PASS -o "$decision" = REVIEW
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scanned-evidence
          path: |
            publish-evidence/
            manifest.json
          if-no-files-found: warn
          retention-days: 30

  # WRITE: pushes the exact attested archive the scan approved; parses nothing but the
  # archive index, and must reproduce the digest the scan job computed.
  push_candidate:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ghcr-candidate-writer
    permissions:
      contents: read
      attestations: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact SHA-256-pinned security tools (push)
        shell: bash
        run: python3 -I ci/install_verified_tools.py --kind push
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanned-evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-a
          path: image-a
      - name: Push unsigned candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ci/require_tools.sh push
          printf '%s' "$GHCR_PASS" | crane auth login "$GHCR_HOST" --username "$GHCR_USER" --password-stdin
          bash ci/application_pipeline.sh push
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pushed-evidence
          path: |
            publish-evidence/
            manifest.json
          if-no-files-found: error
          retention-days: 30

  high_review:
    needs: [scan, push_candidate]
    if: needs.scan.outputs.decision == 'REVIEW'
    runs-on: ubuntu-24.04
    environment: application-high-cve-review
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      approver: ${{ steps.reviewer.outputs.approver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact SHA-256-pinned security tools (api)
        shell: bash
        run: python3 -I ci/install_verified_tools.py --kind api
      - name: Require the reviewer of THIS environment, not the run initiator
        id: reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(command -v gh)" == "$VERIFIED_TOOLS_DIR/gh" ]]
          approver="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            python3 -I ci/environment_approver.py --environment application-high-cve-review \
              --triggering-actor "$GITHUB_TRIGGERING_ACTOR" --actor "$GITHUB_ACTOR")"
          echo "approver=$approver" >> "$GITHUB_OUTPUT"

  promote:
    needs: [scan, push_candidate, high_review]
    if: always() && needs.push_candidate.result == 'success' && (needs.high_review.result == 'success' || needs.high_review.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: ghcr-application-promoter
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact SHA-256-pinned security tools (promote)
        shell: bash
        run: python3 -I ci/install_verified_tools.py --kind promote
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pushed-evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-identity-a
          path: image-identity-a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-identity-b
          path: image-identity-b
      - name: Validate and promote immutable digest (still unsigned)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ github.token }}
          APP_HIGH_APPROVER: ${{ needs.high_review.outputs.approver }}
        run: |
          set -euo pipefail
          bash ci/require_tools.sh promote
          # Verify BOTH builders' attested CONFIG digests before treating them as evidence.
          # Use gh >= 2.97.0 to avoid affected signer-workflow matching behavior.
          bash ci/require_gh_attestation.sh image-identity-a/config-digest.txt
          bash ci/require_gh_attestation.sh image-identity-b/config-digest.txt
          printf '%s' "$GHCR_PASS" | crane auth login "$GHCR_HOST" --username "$GHCR_USER" --password-stdin
          bash ci/application_pipeline.sh promote
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promoted-evidence
          path: |
            publish-evidence/
            manifest.json
          if-no-files-found: error
          retention-days: 30

  independent_rescan:
    needs: promote
    runs-on: ubuntu-24.04
    environment: ghcr-read-only
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact SHA-256-pinned security tools (rescan)
        shell: bash
        run: python3 -I ci/install_verified_tools.py --kind rescan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promoted-evidence
      - name: Read-only independent scan and layer analysis of exact promoted digest
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ci/require_tools.sh rescan
          printf '%s' "$GHCR_PASS" | crane auth login "$GHCR_HOST" --username "$GHCR_USER" --password-stdin
          bash ci/application_pipeline.sh rescan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rescanned-evidence
          path: |
            publish-evidence/
            manifest.json
          if-no-files-found: error
          retention-days: 30

  independent_verification:
    needs: independent_rescan
    runs-on: ubuntu-24.04
    environment: independent-verification
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact SHA-256-pinned security tools (verify)
        shell: bash
        run: python3 -I ci/install_verified_tools.py --kind verify
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rescanned-evidence
      - name: Independently decide whether policy allows signing
        shell: bash
        env:
          VERIFIER_PRIVATE_KEY_B64: ${{ secrets.VERIFIER_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$VERIFIER_PRIVATE_KEY_B64" | base64 -d > "$RUNNER_TEMP/verifier.key"
          VERIFIER_KEY="$RUNNER_TEMP/verifier.key" bash ci/application_pipeline.sh verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-evidence
          path: |
            publish-evidence/
            manifest.json
          if-no-files-found: error
          retention-days: 30

  sign:
    needs: independent_verification
    runs-on: ubuntu-24.04
    environment: ghcr-application-signing
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact SHA-256-pinned security tools (promote)
        shell: bash
        run: python3 -I ci/install_verified_tools.py --kind promote
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-evidence
      - name: Fresh authorization, verify signed evidence, sign GHCR digest
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ github.token }}
          VERIFIER_PUBLIC_KEY_B64: ${{ secrets.VERIFIER_PUBLIC_KEY_B64 }}
          RELEASE_GATE_PUBKEY_B64: ${{ secrets.RELEASE_GATE_PUBKEY_B64 }}
          APP_COSIGN_KEY_B64: ${{ secrets.APP_COSIGN_KEY_B64 }}
          APP_COSIGN_PUBKEY_B64: ${{ secrets.APP_COSIGN_PUBKEY_B64 }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$VERIFIER_PUBLIC_KEY_B64" | base64 -d > "$RUNNER_TEMP/verifier.pub"
          printf '%s' "$RELEASE_GATE_PUBKEY_B64" | base64 -d > "$RUNNER_TEMP/gate.pub"
          printf '%s' "$APP_COSIGN_KEY_B64" | base64 -d > "$RUNNER_TEMP/app.key"
          printf '%s' "$APP_COSIGN_PUBKEY_B64" | base64 -d > "$RUNNER_TEMP/app.pub"
          bash ci/require_tools.sh promote
          printf '%s' "$GHCR_PASS" | crane auth login "$GHCR_HOST" --username "$GHCR_USER" --password-stdin
          VERIFIER_PUBKEY="$RUNNER_TEMP/verifier.pub" \
          RELEASE_GATE_PUBKEY="$RUNNER_TEMP/gate.pub" \
          COSIGN_KEY="$RUNNER_TEMP/app.key" COSIGN_PUBKEY="$RUNNER_TEMP/app.pub" \
