name: Security repository PR validation (no secrets)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified pinned actionlint
        run: python3 -I ci/install_verified_tools.py --kind lint
      - name: Validate GitHub Actions workflow semantics
        run: actionlint -color=false .github/workflows/*.yml examples/application-repo/.github/workflows/*.yml
      - name: Set up isolated YAML validation dependency (no secrets)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Static checks
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python3 -m compileall -q scripts ci
          for f in scripts/*.sh ci/*.sh; do bash -n "$f"; done
          python3 - <<'PY'
          import json, pathlib
          import yaml
          root=pathlib.Path('.')
          for f in root.rglob('*.json'):
              if not f.name.endswith('.example'): json.loads(f.read_text())
          for f in root.rglob('*.yaml'):
              yaml.safe_load(f.read_text())
          for f in root.rglob('*.yml'):
              yaml.safe_load(f.read_text())
          PY
      - name: Regression tests
        run: |
          source .venv/bin/activate
          python3 -m unittest discover -s tests -p 'test_*.py' -v
