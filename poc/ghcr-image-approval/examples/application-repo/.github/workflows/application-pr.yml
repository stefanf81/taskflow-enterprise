name: Application PR tests — no publishing secrets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproducible build, tests and SAST/SCA checks configured by the app
        run: |
          set -euo pipefail
          test -x ci/build_and_test.sh
          ./ci/build_and_test.sh
      # Put SAST/SCA results here. Do not add application/publisher signing keys,
      # GHCR write credentials or privileged workflow_run/pull_request_target jobs.
