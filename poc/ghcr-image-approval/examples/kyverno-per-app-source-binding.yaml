# OPTIONAL, one copy PER APPLICATION. Kyverno 1.20+ ImageValidatingPolicy (DENY template;
# validate examples/audit/kyverno-per-app-source-binding-audit.yaml in staging first).
#
# The general policies (kyverno-verify-application.yaml, kyverno-require-release-approval.yaml)
# cover every image under applications/ and accept any source repository on the organisation's
# Git host. This policy adds the exact pairing for ONE application: images in
# applications/myapp must have a signed build record naming exactly ORG/myapp.git.
# (The trusted publish job already fixes this pairing; this repeats it at admission.)
# Replace `myapp` (3x in matchImageReferences/variables, 1x in the policy name) and the Git URL.
# Both tag and digest forms are matched so the policy also applies where the digest-only
# allowlist is not enforced.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: bind-myapp-image-to-source-repository
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods', 'pods/ephemeralcontainers']
  matchImageReferences:
    - glob: 'ghcr.io/example-org/applications/myapp@*'
    - glob: 'ghcr.io/example-org/applications/myapp:*'
  validationConfigurations:
    mutateDigest: false
    required: true
    verifyDigest: true
  credentials:
    secrets:
      - ghcr-kyverno-pull
  variables:
    - name: otherAppImages
      expression: >-
        (object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([]))
          .map(c, c.image)
          .filter(i, i.startsWith('ghcr.io/example-org/applications/myapp@') ||
                     i.startsWith('ghcr.io/example-org/applications/myapp:'))
  attestors:
    - name: appSigner
      cosign:
        key:
          data: |
            -----BEGIN PUBLIC KEY-----
            REPLACE_WITH_APPLICATION_SIGNING_PUBLIC_KEY
            -----END PUBLIC KEY-----
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  attestations:
    - name: buildRecord
      intoto:
        type: https://example.org/github-actions-build-record/v1
  validations:
    - expression: >-
        images.containers.filter(i, i.startsWith('ghcr.io/example-org/applications/myapp@') || i.startsWith('ghcr.io/example-org/applications/myapp:')).all(image,
          verifyAttestationSignatures(image, attestations.buildRecord, [attestors.appSigner]) > 0 &&
          extractPayload(image, attestations.buildRecord).predicate.sourceRepository == 'https://github.com/ORG/myapp.git')
      message: 'applications/myapp images must be built from ORG/myapp.git'
    - expression: >-
        variables.otherAppImages.all(image,
          verifyAttestationSignatures(image, attestations.buildRecord, [attestors.appSigner]) > 0 &&
          extractPayload(image, attestations.buildRecord).predicate.sourceRepository == 'https://github.com/ORG/myapp.git')
      message: 'applications/myapp init/ephemeral images must be built from ORG/myapp.git'
