# Run independent tasks/projects concurrently.
org.gradle.parallel=true

# Reuse cacheable task outputs between builds.
org.gradle.caching=true

# Reuse the configured task graph when its inputs have not changed.
org.gradle.configuration-cache=true

# Store and load the configuration cache in parallel where supported.
org.gradle.configuration-cache.parallel=true

# Gradle daemon memory.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Version-coupled dependency families. Keep each family on one release even
# when Renovate groups their updates into a single pull request.
springBootVersion=4.1.1
flywayVersion=13.3.0
hibernateVersion=7.4.6.Final
nettyVersion=4.2.17.Final
log4j2Version=2.26.1
jackson2Version=2.22.2
jackson3Version=3.2.2
