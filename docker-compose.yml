services:
  db:
    image: postgres:18.6-alpine
    container_name: taskflow-db
    command:
      - "postgres"
      - "-c"
      - "max_parallel_maintenance_workers=4"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      # lz4 instead of on (= pglz); the image is built --with-lz4. pgbench on 18.6 with
      # checkpoints every 30 s (full-page-image heavy), per transaction: pglz 216-266 us
      # CPU / 922-1045 B WAL, lz4 205-224 us / 1043-1147 B, off 201-210 us / 3850 B.
      - "wal_compression=lz4"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "autovacuum_work_mem=128MB"
      - "-c"
      - "jit=off"
      - "-c"
      # Parity with production (application-prod.properties: one replica, pool 25 of 50).
      - "max_connections=50"
    env_file:
      - .env
    # Docker's 10 s default often cuts the shutdown checkpoint short (postgres image docs);
    # a SIGKILLed server replays WAL on the next start and delays service_healthy.
    stop_grace_period: 60s
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    # Parallel queries allocate their dynamic shared memory in /dev/shm, which Docker
    # caps at 64 MB. One parallel hash join may use work_mem x hash_mem_multiplier x
    # (2 workers + leader) = 16 MB x 2 x 3 = 96 MB; on PostgreSQL 18.6 with these
    # settings it failed with "could not resize shared memory segment ... No space
    # left on device" at 64m and succeeded at 256m. Pages are charged only when used.
    shm_size: 256mb
    networks:
      - backend-tier
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 512M
    # TCP, not the default Unix socket: on a fresh volume the entrypoint's temporary
    # init server listens on the socket only, so a socket probe could report healthy
    # (and start the backend) before the real server accepts TCP connections. The
    # start interval probes every second while the database boots instead of waiting
    # a full interval for the first probe.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: taskflow-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      # The local variant of the single backend Dockerfile: keeps wget for the
      # HEALTHCHECK and skips the production package refresh. Built for the host
      # architecture (arm64 on Apple Silicon, amd64 on a Linux workstation)
      # because the Dockerfile pins no platform; CI builds `prod` for linux/amd64.
      target: local
    container_name: taskflow-backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # CORS: same-origin SPA→nginx→backend requests bypass CORS entirely, but
      # state-changing POST/PUT still carry an Origin header that Spring checks
      # against this list. Whitelist both loopback hostnames so the E2E stack
      # passes whether Playwright drives the browser via localhost or 127.0.0.1.
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
      # The local E2E suite shares one client IP and would exhaust the production
      # 20/min auth bucket (csrf/me/login/register/logout) mid-suite. verify.sh
      # and `npm run e2e:docker` export a higher value; normal local runs keep 20.
      - APP_RATE_LIMIT_AUTH_MAX_REQUESTS_PER_MINUTE=${APP_RATE_LIMIT_AUTH_MAX_REQUESTS_PER_MINUTE:-20}
      # The backend accepts forwarding headers only from the Nginx container.
      # Keep this in sync with the trusted proxy network in the deployment.
      # Single backslashes on purpose: YAML plain scalars do no escape processing,
      # so a doubled `\\.` reaches the JVM as a literal backslash + any-char and the
      # pattern never matches the proxy's address (every client then shares one
      # rate-limit bucket). Keep in sync with the real proxy network.
      - APP_TRUSTED_PROXY_REGEX=^172\.([1][6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}$
      # The local stack runs the prod profile, whose admin-password guard rejects the
      # well-known development password the E2E suites log in with. Real deployments
      # leave this unset (guard on); only this disposable local stack turns it off.
      - APP_REQUIRE_STRONG_ADMIN_PASSWORD=${APP_REQUIRE_STRONG_ADMIN_PASSWORD:-false}
      # JVM sizing is owned by the deployment (JAVA_TOOL_OPTIONS), not the image
      # CMD — see the Dockerfile's shared runtime stage for the sizing-agnostic rationale.
      # This block mirrors the prod homelab/TF backend.yaml intent.
      # At 2560M limit × MaxRAMPercentage=50.0 → ~1.25 GiB heap, ~1.3 GiB off-heap.
      # GC log and OOM heap dump go to the backend-diagnostics volume, not the /tmp
      # tmpfs: tmpfs pages count against the 2560M limit (a heap-sized dump on top
      # of the running JVM invites the OOM killer) and vanish when the container
      # stops, which ExitOnOutOfMemoryError makes it do. The dump is named
      # java_pid<pid>.hprof and an existing file is never overwritten: delete it
      # after analysis. The GC log rotates the previous run's file on start.
      - JAVA_TOOL_OPTIONS=-XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:MaxGCPauseMillis=100 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/taskflow -Xlog:gc*:file=/var/log/taskflow/gc.log:time,uptime:filecount=3,filesize=10m -XX:+UseStringDeduplication -XX:+AlwaysPreTouch -XX:+ParallelRefProcEnabled -XX:+DisableExplicitGC -XX:MaxDirectMemorySize=256m -XX:MaxMetaspaceSize=256m
      # glibc-only knob (no musl equivalent): arenas scale to 8 x cores by
      # default and the JVM's carrier/worker threads spread native allocations
      # across them, padding RSS. 2 recovered ~72 MiB (median) with no
      # throughput or GC change (BENCHMARKS.md §51); mirror in homelab/TF.
      - MALLOC_ARENA_MAX=2
    env_file:
      - .env
    networks:
      - frontend-tier
      - backend-tier
    read_only: true
    tmpfs:
      - /tmp
    # Writable JVM diagnostics (see JAVA_TOOL_OPTIONS). The image creates the
    # directory owned by 10001, and a new named volume inherits that ownership.
    volumes:
      - backend-diagnostics:/var/log/taskflow
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2560M
        reservations:
          memory: 1536M
    # Docker runs the first probe one interval after start, so with 30 s the frontend
    # (service_healthy) waited ~30 s for a backend that boots in ~8 s. During the start
    # period the probe runs every 2 s and failures do not count; 60 s also covers slow
    # (no-CDS, emulated) boots, after which the 30 s interval applies again.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
        required: false
    # Allow Spring's 30-second graceful-shutdown phase to finish before Docker
    # escalates SIGTERM to SIGKILL.
    stop_grace_period: 40s
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.10.3-alpine
    container_name: taskflow-redis
    command:
      - "redis-server"
      # No --io-threads: redis.conf asks for at least 4 cores with one spare, and the
      # backend talks to Redis over one shared Lettuce connection. Measured on Redis
      # 8.10.2 under a 1-CPU quota (cpus: '1.0'), io-threads 2 raised the single-
      # connection p50 from 0.039 to 0.063-0.071 ms, cut throughput by up to 45%
      # and got the container CPU-throttled; io-threads 1 never was.
      # (io-threads-do-reads is a deprecated no-op since Redis 8.0.)
      - "--lazyfree-lazy-expire" # Redis 8.0: async deletion of expired keys
      - "yes"                    # Prevents latency spikes from rate-limit key churn
      - "--maxmemory"           # Cap memory at 50% of container limit (512M)
      - "256mb"
      - "--maxmemory-policy"    # Only evict keys that have a TTL set
      - "volatile-lru"          # Safe: rate-limit + cache keys all have TTLs
      - "--stop-writes-on-bgsave-error" # Don't reject writes if persistence fails
      - "no"                     # Cache/rate-limiter can lose data safely
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - backend-tier
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: taskflow-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686"        # Jaeger UI (HTTP)
      - "4317:4317"          # OTLP gRPC
      - "4318:4318"          # OTLP HTTP
      - "13133:13133"        # Health check (healthcheckv2 extension)
    environment:
      - JAEGER_LISTEN_HOST=0.0.0.0
      - LOG_LEVEL=info
      # Soft limit for the Go runtime below the 256M container limit: the GC works
      # harder as the heap approaches it instead of letting the cgroup OOM-kill
      # Jaeger. The in-memory store itself is capped by max_traces in the config.
      - GOMEMLIMIT=200MiB
    volumes:
      - ./jaeger/jaeger-config.yaml:/etc/jaeger/jaeger-config.yaml:ro
    command: ["--config", "/etc/jaeger/jaeger-config.yaml"]
    networks:
      - backend-tier
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: taskflow-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    ports:
      - "4200:8080" # Map host 4200 to Nginx-unprivileged port 8080
    networks:
      - frontend-tier
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
      - /var/cache/nginx:uid=10001,gid=10001
      - /var/run:uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  backend-diagnostics:

networks:
  frontend-tier:
    driver: bridge
  backend-tier:
    driver: bridge
